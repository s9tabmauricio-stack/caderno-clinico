<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="279pt" viewBox="0 0 478 279"><rect x="0.0" y="0.0" width="153.3" height="279.0" rx="10" fill="#F5F8FF" stroke="#DCE6F7" stroke-width="1"/><circle cx="23.0" cy="24" r="15" fill="#C3D8F8" stroke="#0B5BD3" stroke-width="1"/><circle cx="23.0" cy="24" r="8.2" fill="#FFFFFF"/><text x="44.0" y="22.0" font-family="Inter" font-weight="600" font-size="10" fill="#16315C" text-anchor="start">Grande calibre</text><text x="8.0" y="46.0" font-family="Inter" font-weight="400" font-size="7.2" fill="#4F5B70" text-anchor="start">aorta e seus grandes ramos</text><rect x="8.0" y="59.2" width="137.3" height="30.8" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="14.0" y="71.7" font-family="Inter" font-weight="500" font-size="8.2" fill="#1F2933" text-anchor="start">Arterite de Takayasu</text><text x="14.0" y="81.7" font-family="Inter" font-weight="400" font-size="7" fill="#4F5B70" text-anchor="start">mulher jovem</text><rect x="8.0" y="95.0" width="137.3" height="39.6" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="14.0" y="107.5" font-family="Inter" font-weight="500" font-size="8.2" fill="#1F2933" text-anchor="start">Arterite temporal</text><text x="14.0" y="117.5" font-family="Inter" font-weight="400" font-size="7" fill="#4F5B70" text-anchor="start">de células gigantes ou de Horton;</text><text x="14.0" y="126.3" font-family="Inter" font-weight="400" font-size="7" fill="#4F5B70" text-anchor="start">mulher idosa</text><rect x="162.3" y="0.0" width="153.3" height="279.0" rx="10" fill="#F5F8FF" stroke="#DCE6F7" stroke-width="1"/><circle cx="185.3" cy="24" r="10" fill="#C3D8F8" stroke="#0B5BD3" stroke-width="1"/><circle cx="185.3" cy="24" r="5.5" fill="#FFFFFF"/><text x="206.3" y="22.0" font-family="Inter" font-weight="600" font-size="10" fill="#16315C" text-anchor="start">Médio calibre</text><text x="170.3" y="46.0" font-family="Inter" font-weight="400" font-size="7.2" fill="#4F5B70" text-anchor="start">artérias musculares: femorais, tibiais,</text><text x="170.3" y="55.2" font-family="Inter" font-weight="400" font-size="7.2" fill="#4F5B70" text-anchor="start">coronárias, das vísceras</text><rect x="170.3" y="68.4" width="137.3" height="39.6" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="176.3" y="80.9" font-family="Inter" font-weight="500" font-size="8.2" fill="#1F2933" text-anchor="start">Tromboangeíte obliterante</text><text x="176.3" y="90.9" font-family="Inter" font-weight="400" font-size="7" fill="#4F5B70" text-anchor="start">doença de Buerger; homem jovem</text><text x="176.3" y="99.7" font-family="Inter" font-weight="400" font-size="7" fill="#4F5B70" text-anchor="start">que fuma</text><rect x="170.3" y="113.0" width="137.3" height="30.8" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="176.3" y="125.5" font-family="Inter" font-weight="500" font-size="8.2" fill="#1F2933" text-anchor="start">Poliarterite nodosa</text><text x="176.3" y="135.5" font-family="Inter" font-weight="400" font-size="7" fill="#4F5B70" text-anchor="start">hepatite B; aneurismas nas vísceras</text><rect x="170.3" y="148.8" width="137.3" height="30.8" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="176.3" y="161.3" font-family="Inter" font-weight="500" font-size="8.2" fill="#1F2933" text-anchor="start">Doença de Kawasaki</text><text x="176.3" y="171.3" font-family="Inter" font-weight="400" font-size="7" fill="#4F5B70" text-anchor="start">criança; coronárias</text><rect x="324.7" y="0.0" width="153.3" height="279.0" rx="10" fill="#F5F8FF" stroke="#DCE6F7" stroke-width="1"/><circle cx="347.7" cy="24" r="5.5" fill="#C3D8F8" stroke="#0B5BD3" stroke-width="1"/><circle cx="347.7" cy="24" r="3.0" fill="#FFFFFF"/><text x="368.7" y="22.0" font-family="Inter" font-weight="600" font-size="10" fill="#16315C" text-anchor="start">Pequeno calibre</text><text x="332.7" y="46.0" font-family="Inter" font-weight="400" font-size="7.2" fill="#4F5B70" text-anchor="start">arteríolas, capilares e vênulas: as mais</text><text x="332.7" y="55.2" font-family="Inter" font-weight="400" font-size="7.2" fill="#4F5B70" text-anchor="start">difíceis de diagnosticar</text><rect x="332.7" y="68.4" width="137.3" height="30.8" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="338.7" y="80.9" font-family="Inter" font-weight="500" font-size="8.2" fill="#1F2933" text-anchor="start">Granulomatose de Wegener</text><text x="338.7" y="90.9" font-family="Inter" font-weight="400" font-size="7" fill="#4F5B70" text-anchor="start">c-ANCA; pulmão e mucosas</text><rect x="332.7" y="104.2" width="137.3" height="22.0" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="338.7" y="116.7" font-family="Inter" font-weight="500" font-size="8.2" fill="#1F2933" text-anchor="start">Síndrome de Churg-Strauss</text><rect x="332.7" y="131.2" width="137.3" height="22.0" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="338.7" y="143.7" font-family="Inter" font-weight="500" font-size="8.2" fill="#1F2933" text-anchor="start">Poliangeíte microscópica</text><rect x="332.7" y="158.2" width="137.3" height="22.0" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="338.7" y="170.7" font-family="Inter" font-weight="500" font-size="8.2" fill="#1F2933" text-anchor="start">Vasculite por imunoglobulina A</text><rect x="332.7" y="185.2" width="137.3" height="22.0" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="338.7" y="197.7" font-family="Inter" font-weight="500" font-size="8.2" fill="#1F2933" text-anchor="start">Crioglobulinemia</text><rect x="332.7" y="212.2" width="137.3" height="22.0" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="338.7" y="224.7" font-family="Inter" font-weight="500" font-size="8.2" fill="#1F2933" text-anchor="start">Vasculite leucocitoclástica</text><rect x="332.7" y="239.2" width="137.3" height="30.8" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="338.7" y="251.7" font-family="Inter" font-weight="500" font-size="8.2" fill="#1F2933" text-anchor="start">Doença de Behçet</text><text x="338.7" y="261.7" font-family="Inter" font-weight="400" font-size="7" fill="#4F5B70" text-anchor="start">mucosas e olho</text></svg>