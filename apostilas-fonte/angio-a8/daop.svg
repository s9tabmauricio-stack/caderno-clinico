<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="134pt" viewBox="0 0 478 134"><text x="0.0" y="9.0" font-family="Inter" font-weight="600" font-size="8.2" fill="#16315C" text-anchor="start">Doença arterial obstrutiva periférica: o caminho de sempre, em meses ou anos</text><rect x="0.0" y="18.0" width="132.0" height="42.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="15.0" cy="39.0" r="8" fill="#0B5BD3"/><text x="15.0" y="42.2" font-family="Inter" font-weight="600" font-size="8.5" fill="#FFFFFF" text-anchor="middle">1</text><text x="29.0" y="36.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#1F2933" text-anchor="start">Dor para caminhar</text><text x="29.0" y="48.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#4F5B70" text-anchor="start">passa quando para</text><line x1="137.0" y1="39.0" x2="164.0" y2="39.0" stroke="#8AA9DF" stroke-width="2"/><polygon points="170.0,39.0 162.8,33.5 162.8,44.5" fill="#8AA9DF"/><rect x="173.0" y="18.0" width="132.0" height="42.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="188.0" cy="39.0" r="8" fill="#0B5BD3"/><text x="188.0" y="42.2" font-family="Inter" font-weight="600" font-size="8.5" fill="#FFFFFF" text-anchor="middle">2</text><text x="202.0" y="36.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#1F2933" text-anchor="start">Dor em repouso</text><text x="202.0" y="48.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#4F5B70" text-anchor="start">à noite, na cama</text><line x1="310.0" y1="39.0" x2="337.0" y2="39.0" stroke="#8AA9DF" stroke-width="2"/><polygon points="343.0,39.0 335.9,33.5 335.9,44.5" fill="#8AA9DF"/><rect x="346.0" y="18.0" width="132.0" height="42.0" rx="8" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1.6"/><circle cx="361.0" cy="39.0" r="8" fill="#0B5BD3"/><text x="361.0" y="42.2" font-family="Inter" font-weight="600" font-size="8.5" fill="#FFFFFF" text-anchor="middle">3</text><text x="375.0" y="36.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#1F2933" text-anchor="start">Lesão trófica</text><text x="375.0" y="48.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#4F5B70" text-anchor="start">ferida, necrose</text><rect x="0.0" y="92.0" width="190.0" height="40.0" rx="8" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><text x="10.0" y="108.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Tromboangeíte obliterante</text><text x="10.0" y="121.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#4F5B70" text-anchor="start">homem até 50 anos, que fuma muito</text><line x1="190.0" y1="112.0" x2="412.0" y2="112.0" stroke="#8AA9DF" stroke-width="2"/><line x1="412.0" y1="113.0" x2="412.0" y2="69.0" stroke="#8AA9DF" stroke-width="2"/><polygon points="412.0,63.0 406.5,70.2 417.5,70.2" fill="#8AA9DF"/><text x="202.0" y="106.0" font-family="Inter" font-weight="500" font-size="7.6" fill="#0B5BD3" text-anchor="start">pula as fases: chega com ferida e dor dia e noite</text><text x="405.0" y="82.0" font-family="Inter" font-weight="600" font-size="7.4" fill="#0B5BD3" text-anchor="end">Rutherford 5 e 6</text></svg>