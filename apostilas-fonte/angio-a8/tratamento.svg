<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="181pt" viewBox="0 0 478 181"><rect x="134.0" y="0.0" width="210.0" height="26.0" rx="8" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><text x="239.0" y="16.5" font-family="Inter" font-weight="600" font-size="8.8" fill="#16315C" text-anchor="middle">Vasculite com o diagnóstico feito</text><line x1="239.0" y1="26.0" x2="239.0" y2="38.0" stroke="#8AA9DF" stroke-width="2"/><line x1="103.0" y1="38.0" x2="415.0" y2="38.0" stroke="#8AA9DF" stroke-width="2"/><line x1="103.0" y1="38.0" x2="103.0" y2="52.0" stroke="#8AA9DF" stroke-width="2"/><polygon points="103.0,58.0 97.5,50.9 108.5,50.9" fill="#8AA9DF"/><line x1="279.0" y1="38.0" x2="279.0" y2="52.0" stroke="#8AA9DF" stroke-width="2"/><polygon points="279.0,58.0 273.5,50.9 284.5,50.9" fill="#8AA9DF"/><line x1="415.0" y1="38.0" x2="415.0" y2="52.0" stroke="#8AA9DF" stroke-width="2"/><polygon points="415.0,58.0 409.5,50.9 420.5,50.9" fill="#8AA9DF"/><rect x="0.0" y="60.0" width="206.0" height="54.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="8.0" y="72.0" font-family="Inter" font-weight="600" font-size="6.8" fill="#0B5BD3" text-anchor="start">A REGRA</text><text x="8.0" y="84.0" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Arterite temporal, arterite de Takayasu, poliarterite</text><text x="8.0" y="94.0" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">nodosa, doença de Behçet, granulomatose de</text><text x="8.0" y="104.0" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Wegener e vasculite leucocitoclástica</text><line x1="103.0" y1="114.0" x2="103.0" y2="126.0" stroke="#8AA9DF" stroke-width="2"/><polygon points="103.0,132.0 97.5,124.8 108.5,124.8" fill="#8AA9DF"/><rect x="0.0" y="132.0" width="206.0" height="47.8" rx="8" fill="#0B5BD3" stroke="#0B5BD3" stroke-width="1"/><text x="8.0" y="147.0" font-family="Inter" font-weight="600" font-size="9" fill="#FFFFFF" text-anchor="start">Corticoide, o carro-chefe</text><text x="8.0" y="158.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#E3ECFB" text-anchor="start">nos casos graves, outros imunossupressores</text><rect x="216.0" y="60.0" width="126.0" height="54.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="224.0" y="72.0" font-family="Inter" font-weight="600" font-size="6.8" fill="#0B5BD3" text-anchor="start">EXCEÇÃO</text><text x="224.0" y="84.0" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Doença de Kawasaki</text><line x1="279.0" y1="114.0" x2="279.0" y2="126.0" stroke="#8AA9DF" stroke-width="2"/><polygon points="279.0,132.0 273.5,124.8 284.5,124.8" fill="#8AA9DF"/><rect x="216.0" y="132.0" width="126.0" height="47.8" rx="8" fill="#0B5BD3" stroke="#0B5BD3" stroke-width="1"/><text x="224.0" y="147.0" font-family="Inter" font-weight="600" font-size="9" fill="#FFFFFF" text-anchor="start">Ácido acetilsalicílico</text><text x="224.0" y="158.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#E3ECFB" text-anchor="start">o tratamento de base</text><rect x="352.0" y="60.0" width="126.0" height="54.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="360.0" y="72.0" font-family="Inter" font-weight="600" font-size="6.8" fill="#0B5BD3" text-anchor="start">EXCEÇÃO</text><text x="360.0" y="84.0" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Tromboangeíte obliterante</text><text x="360.0" y="94.0" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">(doença de Buerger)</text><line x1="415.0" y1="114.0" x2="415.0" y2="126.0" stroke="#8AA9DF" stroke-width="2"/><polygon points="415.0,132.0 409.5,124.8 420.5,124.8" fill="#8AA9DF"/><rect x="352.0" y="132.0" width="126.0" height="47.8" rx="8" fill="#0B5BD3" stroke="#0B5BD3" stroke-width="1"/><text x="360.0" y="14