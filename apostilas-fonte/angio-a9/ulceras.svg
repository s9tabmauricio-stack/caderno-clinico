<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="222.1pt" viewBox="0 0 478 222.1"><rect x="89.0" y="2" width="300" height="37.5" rx="10" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.2"/><text x="239.0" y="19.5" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="middle">Ferida na perna ou no pé</text><text x="239.0" y="32.0" font-family="Inter" font-size="8.2" fill="#3A3A3C" text-anchor="middle">Onde ela está e como é a pele ao redor?</text><line x1="239.0" y1="39.5" x2="239.0" y2="51.5" stroke="#8AA9DF" stroke-width="1.6"/><line x1="75.7" y1="51.5" x2="402.3" y2="51.5" stroke="#8AA9DF" stroke-width="1.6"/><line x1="75.7" y1="51.5" x2="75.7" y2="63.5" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="71.7,62.5 79.7,62.5 75.7,68.5" fill="#8AA9DF"/><rect x="0.6" y="69.5" width="150.1" height="84.0" rx="10" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.2"/><text x="9.0" y="87.0" font-family="Inter SemiBold" font-size="9" fill="#16315C" text-anchor="start">Maléolo medial</text><text x="9.0" y="100.5" font-family="Inter" font-size="7.9" fill="#3A3A3C" text-anchor="start">Por dentro do tornozelo; raramente</text><text x="9.0" y="110.3" font-family="Inter" font-size="7.9" fill="#3A3A3C" text-anchor="start">em outro ponto.</text><text x="9.0" y="123.1" font-family="Inter" font-size="7.9" fill="#3A3A3C" text-anchor="start">Pele ao redor com doença venosa:</text><text x="9.0" y="132.9" font-family="Inter" font-size="7.9" fill="#3A3A3C" text-anchor="start">dermatite ocre,</text><text x="9.0" y="142.7" font-family="Inter" font-size="7.9" fill="#3A3A3C" text-anchor="start">lipodermatoesclerose.</text><line x1="239.0" y1="51.5" x2="239.0" y2="63.5" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="235.0,62.5 243.0,62.5 239.0,68.5" fill="#8AA9DF"/><rect x="163.9" y="69.5" width="150.1" height="84.0" rx="10" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.2"/><text x="172.3" y="87.0" font-family="Inter SemiBold" font-size="9" fill="#16315C" text-anchor="start">Extremidade</text><text x="172.3" y="100.5" font-family="Inter" font-size="7.9" fill="#3A3A3C" text-anchor="start">Ponta do dedo, calcâneo ou</text><text x="172.3" y="110.3" font-family="Inter" font-size="7.9" fill="#3A3A3C" text-anchor="start">tornozelo.</text><text x="172.3" y="123.1" font-family="Inter" font-size="7.9" fill="#3A3A3C" text-anchor="start">Falta de circulação (isquemia).</text><line x1="402.3" y1="51.5" x2="402.3" y2="63.5" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="398.3,62.5 406.3,62.5 402.3,68.5" fill="#8AA9DF"/><rect x="327.3" y="69.5" width="150.1" height="84.0" rx="10" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.2"/><text x="335.7" y="87.0" font-family="Inter SemiBold" font-size="9" fill="#16315C" text-anchor="start">Fora do lugar habitual</text><text x="335.7" y="100.5" font-family="Inter" font-size="7.9" fill="#3A3A3C" text-anchor="start">Joelho, bolsa escrotal, outros</text><text x="335.7" y="110.3" font-family="Inter" font-size="7.9" fill="#3A3A3C" text-anchor="start">pontos.</text><text x="335.7" y="123.1" font-family="Inter" font-size="7.9" fill="#3A3A3C" text-anchor="start">Pele ao redor sem sinais de doença</text><text x="335.7" y="132.9" font-family="Inter" font-size="7.9" fill="#3A3A3C" text-anchor="start">venosa.</text><text x="335.7" y="145.7" font-family="Inter" font-size="7.9" fill="#3A3A3C" text-anchor="start">Necrose e dor intensa.</text><line x1="75.7" y1="153.5" x2="75.7" y2="165.5" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="71.7,164.5 79.7,164.5 75.7,170.5" fill="#8AA9DF"/><rect x="0.6" y="171.5" width="150.1" height="48.6" rx="10" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1.2"/><text x="9.0" y="189.0" font-family="Inter SemiBold" font-size="9.2" fill="#0B5BD3" text-anchor="start">Úlcera venosa</text><text x="9.0" y="202.5" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="start">Cerca de 80% das feridas. Bota de</text><text x="9.0" y="212.3" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="start">Unna.</text><line x1="239.0" y1="153.5" x2="239.0" y2="165.5" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="235.0,164.5 243.0,164.5 239.0,170.5" fill="#8AA9DF"/><rect x="163.9" y="171.5" width="150.1" height="48.6" rx="10" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1.2"/><text x="172.3" y="189.0" font-family="Inter SemiBold" font-size="9.2" fill="#0B5BD3" text-anchor="start">Úlcera arterial</text><text x="172.3" y="202.5" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="start">Isquêmica, por falta de circulação.</text><line x1="402.3" y1="153.5" x2="402.3" y2="165.5" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="398.3,164.5 406.3,164.5 402.3,170.5" fill="#8AA9DF"/><rect x="327.3" y="171.5" width="150.1" height="48.6" rx="10" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1.2"/><text x="335.7" y="189.0" font-family="Inter SemiBold" font-size="9.2" fill="#0B5BD3" text-anchor="start">Pensar em vasculite</text><text x="335.7" y="202.5" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="start">Há doença de base: pedir o</text><text x="335.7" y="212.3" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="start">parecer do reumatologista.</text></svg>