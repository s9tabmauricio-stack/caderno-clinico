<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="120pt" viewBox="0 0 478 120">
<rect x="0.0" y="34.0" width="104.5" height="83.5" rx="9" ry="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="8.0" y="49.9" font-family="Inter" font-size="8.6" font-weight="600" fill="#16315C" text-anchor="start">Perda de néfrons</text>
<text x="8.0" y="63.7" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">Diabetes:</text>
<text x="8.0" y="73.8" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">glomeruloesclerose.</text>
<text x="8.0" y="83.9" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">Hipertensão: esclerose</text>
<text x="8.0" y="94.1" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">das arteríolas.</text>
<polyline points="107.5,75.8 116.5,75.8" fill="none" stroke="#8AA9DF" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="121.5,75.8 115.5,72.2 115.5,79.4" fill="#8AA9DF"/>
<rect x="124.5" y="34.0" width="104.5" height="83.5" rx="9" ry="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="132.5" y="49.9" font-family="Inter" font-size="8.6" font-weight="600" fill="#16315C" text-anchor="start">Os que sobram</text>
<text x="132.5" y="60.4" font-family="Inter" font-size="8.6" font-weight="600" fill="#16315C" text-anchor="start">trabalham a mais</text>
<text x="132.5" y="74.2" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">Eliminam mais sódio,</text>
<text x="132.5" y="84.3" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">potássio e água: a</text>
<text x="132.5" y="94.4" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">homeostase se</text>
<text x="132.5" y="104.6" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">mantém.</text>
<polyline points="232.0,75.8 241.0,75.8" fill="none" stroke="#8AA9DF" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="246.0,75.8 240.0,72.2 240.0,79.4" fill="#8AA9DF"/>
<rect x="249.0" y="34.0" width="104.5" height="83.5" rx="9" ry="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="257.0" y="49.9" font-family="Inter" font-size="8.6" font-weight="600" fill="#16315C" text-anchor="start">Hipertrofia e</text>
<text x="257.0" y="60.4" font-family="Inter" font-size="8.6" font-weight="600" fill="#16315C" text-anchor="start">hiperfiltração</text>
<text x="257.0" y="74.2" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">O excesso de trabalho</text>
<text x="257.0" y="84.3" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">lesa os próprios</text>
<text x="257.0" y="94.4" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">néfrons que sobram.</text>
<polyline points="356.5,75.8 365.5,75.8" fill="none" stroke="#8AA9DF" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="370.5,75.8 364.5,72.2 364.5,79.4" fill="#8AA9DF"/>
<rect x="373.5" y="34.0" width="104.5" height="83.5" rx="9" ry="9" fill="#F5F8FF" stroke="#16315C" stroke-width="1.3"/>
<text x="381.5" y="49.9" font-family="Inter" font-size="8.6" font-weight="600" fill="#16315C" text-anchor="start">Esclerose de todos</text>
<text x="381.5" y="60.4" font-family="Inter" font-size="8.6" font-weight="600" fill="#16315C" text-anchor="start">os glomérulos</text>
<text x="381.5" y="74.2" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">Anúria: o paciente vive</text>
<text x="381.5" y="84.3" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">de diálise.</text>
<polyline points="301.2,32.0 301.2,12.0 52.2,12.0 52.2,26.0" fill="none" stroke="#8AA9DF" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="52.2,31.0 48.6,25.0 55.9,25.0" fill="#8AA9DF"/>
<rect x="87.3" y="5.0" width="178.8" height="14.0" rx="7" ry="7" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/>
<text x="176.8" y="14.7" font-family="Inter" font-size="7.6" font-weight="500" fill="#4F5B70" text-anchor="middle">o ciclo se repete: a cada volta, menos néfrons</text>
</svg>
