<text x="418.5" y="156.4" font-family="Inter" font-size="7.2" fill="#3A3A3C" text-anchor="middle">osteossíntese, prótese,</text>
<text x="418.5" y="165.7" font-family="Inter" font-size="7.2" fill="#3A3A3C" text-anchor="middle">fixador</text>
