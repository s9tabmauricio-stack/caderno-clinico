<text x="131.0" y="37.0" font-family="Inter SemiBold" font-size="8.6" fill="#16315C" text-anchor="start">Imobilizar</text>
<text x="131.0" y="49.8" font-family="Inter" font-size="7.6" fill="#3A3A3C" text-anchor="start">proteger a lesão e aliviar</text>
