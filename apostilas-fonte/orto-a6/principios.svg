<text x="10.0" y="135.4" font-family="Inter" font-size="7.8" fill="#3A3A3C" text-anchor="start">física, psicológica e laboral: voltar a trabalhar, ao</text>
<text x="10.0" y="145.7" font-family="Inter" font-size="7.8" fill="#3A3A3C" text-anchor="start">esporte, ao que fazia antes</text>
