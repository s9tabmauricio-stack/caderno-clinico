<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="129pt" viewBox="0 0 478 129"><line x1="6" y1="44" x2="466" y2="44" stroke="#8AA9DF" stroke-width="2"/><polygon points="465,39.5 465,48.5 472,44" fill="#8AA9DF"/><circle cx="20" cy="44" r="5" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1.6"/><text x="14.0" y="32.0" font-family="Inter SemiBold" font-weight="600" font-size="8" fill="#16315C" text-anchor="start">Início: crises de dor</text><circle cx="300" cy="44" r="5" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1.6"/><text x="300.0" y="32.0" font-family="Inter SemiBold" font-weight="600" font-size="8" fill="#16315C" text-anchor="middle">Cerca de 10 anos depois</text><text x="472.0" y="59.0" font-family="Inter Medium" font-weight="500" font-size="7.4" fill="#6C6C70" text-anchor="end">anos</text><rect x="6.0" y="66.0" width="270.0" height="62.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="14.0" y="81.0" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#0B5BD3" text-anchor="start">Fase de dor</text><text x="14.0" y="94.0" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">Crises de 1 a 7 dias, com intervalos sem dor. Álcool e comida</text><text x="14.0" y="104.8" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">gordurosa disparam a crise; o paciente passa a ter medo de</text><text x="14.0" y="115.6" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">comer.</text><rect x="282.0" y="66.0" width="190.0" height="62.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="290.0" y="81.0" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#0B5BD3" text-anchor="start">Fase de perda da função</text><text x="290.0" y="94.0" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">Esteatorreia e diabetes, quando já se perdeu</text><text x="290.0" y="104.8" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">mais de 90% do parênquima.</text></svg>