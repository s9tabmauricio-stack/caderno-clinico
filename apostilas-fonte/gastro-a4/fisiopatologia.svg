<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="235pt" viewBox="0 0 478 235"><rect x="0.0" y="0.0" width="229.0" height="22.0" rx="6" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><text x="114.5" y="14.5" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#16315C" text-anchor="middle">Normal: as enzimas ligam no intestino</text><rect x="249.0" y="0.0" width="229.0" height="22.0" rx="6" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><text x="363.5" y="14.5" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#16315C" text-anchor="middle">Pancreatite: as enzimas ligam no pâncreas</text><rect x="0.0" y="36.0" width="229.0" height="33.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="7.0" y="50.5" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">As células acinares liberam as proteases desligadas</text><text x="7.0" y="61.3" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">(pró-enzimas). Amilase e lipase já saem ativas.</text><rect x="249.0" y="36.0" width="229.0" height="33.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="256.0" y="50.5" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">Gatilho: cálculo no fim do colédoco, álcool, triglicerídeos</text><text x="256.0" y="61.3" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">ou cálcio altos, remédio, tumor.</text><line x1="114.5" y1="70.6" x2="114.5" y2="77.6" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="110.5,76.6 118.5,76.6 114.5,82.6" fill="#8AA9DF"/><line x1="363.5" y1="70.6" x2="363.5" y2="77.6" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="359.5,76.6 367.5,76.6 363.5,82.6" fill="#8AA9DF"/><rect x="0.0" y="83.6" width="229.0" height="33.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="7.0" y="98.1" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">No duodeno, a enteropeptidase do intestino transforma</text><text x="7.0" y="108.9" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">o tripsinogênio em tripsina.</text><rect x="249.0" y="83.6" width="229.0" height="33.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="256.0" y="98.1" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">O tripsinogênio vira tripsina dentro das células do</text><text x="256.0" y="108.9" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">pâncreas, em quantidade que vence as defesas.</text><line x1="114.5" y1="118.2" x2="114.5" y2="125.2" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="110.5,124.2 118.5,124.2 114.5,130.2" fill="#8AA9DF"/><line x1="363.5" y1="118.2" x2="363.5" y2="125.2" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="359.5,124.2 367.5,124.2 363.5,130.2" fill="#8AA9DF"/><rect x="0.0" y="131.2" width="229.0" height="44.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="7.0" y="145.7" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">A tripsina liga as outras: pró-elastase em elastase,</text><text x="7.0" y="156.5" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">quimotripsinogênio em quimotripsina,</text><text x="7.0" y="167.3" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">pró-carboxipeptidase em carboxipeptidase.</text><rect x="249.0" y="131.2" width="229.0" height="44.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="256.0" y="145.7" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">A tripsina liga as outras enzimas em série: o pâncreas</text><text x="256.0" y="156.5" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">começa a digerir a si mesmo.</text><line x1="114.5" y1="176.6" x2="114.5" y2="183.6" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="110.5,182.6 118.5,182.6 114.5,188.6" fill="#8AA9DF"/><line x1="363.5" y1="176.6" x2="363.5" y2="183.6" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="359.5,182.6 367.5,182.6 363.5,188.6" fill="#8AA9DF"/><rect x="0.0" y="189.6" width="229.0" height="44.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="7.0" y="204.1" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">As proteínas da comida são digeridas dentro do</text><text x="7.0" y="214.9" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">intestino. O pâncreas fica protegido.</text><rect x="249.0" y="189.6" width="229.0" height="44.4" rx="7" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1.3"/><text x="256.0" y="204.1" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">Inflamação local. Se for intensa: resposta inflamatória</text><text x="256.0" y="214.9" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">sistêmica, pulmão inflamado, choque e insuficiência</text><text x="256.0" y="225.7" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">renal.</text></svg>