<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="414pt" viewBox="0 0 478 414"><rect x="0.0" y="0.0" width="478.0" height="47.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="8.0" y="16.0" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#16315C" text-anchor="start">Suspeita clínica</text><text x="8.0" y="28.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Icterícia, perda de peso, dor epigástrica ou lombar. No posto, um ultrassom já levanta a suspeita: vesícula distendida, colédoco</text><text x="8.0" y="38.7" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">dilatado, massa na cabeça do pâncreas.</text><rect x="238.1" y="48.6" width="1.8" height="10.0" fill="#8AA9DF"/><polygon points="235.0,57.6 243.0,57.6 239.0,63.6" fill="#8AA9DF"/><rect x="0.0" y="64.6" width="478.0" height="47.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="8.0" y="80.6" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#16315C" text-anchor="start">Reunião multidisciplinar e estadiamento</text><text x="8.0" y="92.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Tomografia de abdome com protocolo pancreático (ou ressonância), tomografia de tórax e CA 19-9 de base. Se preciso:</text><text x="8.0" y="103.3" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">colangiorressonância, colangiopancreatografia endoscópica, ecoendoscopia, PET-CT.</text><rect x="238.1" y="113.3" width="1.8" height="10.0" fill="#8AA9DF"/><polygon points="235.0,122.3 243.0,122.3 239.0,128.3" fill="#8AA9DF"/><rect x="129.0" y="129.3" width="220.0" height="22.7" rx="7" fill="#E8F0FE" stroke="#8AA9DF" stroke-width="1"/><text x="239.0" y="144.3" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#16315C" text-anchor="middle">Tem metástase à distância?</text><rect x="350.0" y="139.7" width="19.0" height="1.8" fill="#8AA9DF"/><polygon points="368.0,136.6 368.0,144.6 374.0,140.6" fill="#8AA9DF"/><text x="357.0" y="136.6" font-family="Inter Medium" font-weight="500" font-size="7.3" fill="#0B5BD3" text-anchor="start">sim</text><rect x="376.0" y="125.6" width="102.0" height="51.1" rx="7" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1"/><text x="427.0" y="139.2" font-family="Inter SemiBold" font-weight="600" font-size="7.8" fill="#16315C" text-anchor="middle">Irressecável</text><text x="427.0" y="150.7" font-family="Inter" font-weight="400" font-size="7" fill="#1F2933" text-anchor="middle">paliação: prótese biliar,</text><text x="427.0" y="160.4" font-family="Inter" font-weight="400" font-size="7" fill="#1F2933" text-anchor="middle">quimioterapia paliativa ou</text><text x="427.0" y="170.0" font-family="Inter" font-weight="400" font-size="7" fill="#1F2933" text-anchor="middle">só cuidados paliativos</text><rect x="238.1" y="152.9" width="1.8" height="12.0" fill="#8AA9DF"/><polygon points="235.0,163.9 243.0,163.9 239.0,169.9" fill="#8AA9DF"/><text x="244.0" y="163.9" font-family="Inter Medium" font-weight="500" font-size="7.3" fill="#0B5BD3" text-anchor="start">não</text><rect x="0.0" y="170.9" width="366.0" height="22.7" rx="7" fill="#E8F0FE" stroke="#8AA9DF" stroke-width="1"/><text x="183.0" y="185.9" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#16315C" text-anchor="middle">Contato do tumor com a artéria mesentérica superior ou o tronco celíaco</text><line x1="239.0" y1="193.6" x2="239.0" y2="203.6" stroke="#8AA9DF" stroke-width="1.8"/><line x1="75.7" y1="203.6" x2="402.3" y2="203.6" stroke="#8AA9DF" stroke-width="1.8"/><rect x="74.8" y="203.6" width="1.8" height="9.0" fill="#8AA9DF"/><polygon points="71.7,211.6 79.7,211.6 75.7,217.6" fill="#8AA9DF"/><rect x="0.0" y="217.6" width="151.3" height="35.1" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="75.7" y="232.8" font-family="Inter SemiBold" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="middle">Ressecável</text><text x="75.7" y="244.9" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="middle">Sem contato arterial</text><rect x="238.1" y="203.6" width="1.8" height="9.0" fill="#8AA9DF"/><polygon points="235.0,211.6 243.0,211.6 239.0,217.6" fill="#8AA9DF"/><rect x="163.3" y="217.6" width="151.3" height="35.1" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="239.0" y="232.8" font-family="Inter SemiBold" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="middle">Limítrofe (borderline)</text><text x="239.0" y="244.9" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="middle">Contato de até 180°</text><rect x="401.4" y="203.6" width="1.8" height="9.0" fill="#8AA9DF"/><polygon points="398.3,211.6 406.3,211.6 402.3,217.6" fill="#8AA9DF"/><rect x="326.7" y="217.6" width="151.3" height="35.1" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="402.3" y="232.8" font-family="Inter SemiBold" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="middle">Localmente avançado</text><text x="402.3" y="244.9" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="middle">Contato acima de 180°</text><rect x="74.8" y="253.7" width="1.8" height="10.0" fill="#8AA9DF"/><polygon points="71.7,262.7 79.7,262.7 75.7,268.7" fill="#8AA9DF"/><rect x="0.0" y="268.7" width="151.3" height="74.9" rx="7" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1"/><text x="7.0" y="283.3" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Sem fator de alto risco: cirurgia</text><text x="7.0" y="293.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">direto. Com alto risco (CA 19-9 muito</text><text x="7.0" y="304.3" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">alto, linfonodos aumentados, perda</text><text x="7.0" y="314.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">de peso excessiva, dor extrema,</text><text x="7.0" y="325.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">imagem duvidosa): biópsia e</text><text x="7.0" y="335.7" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">quimioterapia antes.</text><rect x="238.1" y="253.7" width="1.8" height="10.0" fill="#8AA9DF"/><polygon points="235.0,262.7 243.0,262.7 239.0,268.7" fill="#8AA9DF"/><rect x="163.3" y="268.7" width="151.3" height="74.9" rx="7" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1"/><text x="170.3" y="293.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Biópsia, quimioterapia neoadjuvante,</text><text x="170.3" y="304.3" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">nova tomografia e cirurgia se ficar</text><text x="170.3" y="314.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">possível. Veia (mesentérica superior</text><text x="170.3" y="325.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">ou porta) se reconstrói.</text><rect x="401.4" y="253.7" width="1.8" height="10.0" fill="#8AA9DF"/><polygon points="398.3,262.7 406.3,262.7 402.3,268.7" fill="#8AA9DF"/><rect x="326.7" y="268.7" width="151.3" height="74.9" rx="7" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1"/><text x="333.7" y="299.0" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Em geral irressecável. Conforme a</text><text x="333.7" y="309.5" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">equipe, ressecção em casos</text><text x="333.7" y="320.0" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">selecionados.</text><line x1="75.7" y1="343.7" x2="75.7" y2="353.7" stroke="#8AA9DF" stroke-width="1.8"/><line x1="239.0" y1="343.7" x2="239.0" y2="353.7" stroke="#8AA9DF" stroke-width="1.8"/><line x1="75.7" y1="353.7" x2="239.0" y2="353.7" stroke="#8AA9DF" stroke-width="1.8"/><rect x="156.4" y="353.7" width="1.8" height="9.0" fill="#8AA9DF"/><polygon points="153.3,361.7 161.3,361.7 157.3,367.7" fill="#8AA9DF"/><rect x="0.0" y="367.7" width="314.7" height="45.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="157.3" y="382.7" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#16315C" text-anchor="middle">Depois da cirurgia</text><text x="157.3" y="394.9" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle">quase todos fazem quimioterapia adjuvante (biologia agressiva), salvo o muito</text><text x="157.3" y="405.4" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle">idoso ou com muitas doenças.</text></svg>