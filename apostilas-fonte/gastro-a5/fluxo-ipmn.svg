<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="253pt" viewBox="0 0 478 253"><rect x="0.0" y="0.0" width="478.0" height="33.1" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="6.0" y="14.0" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#16315C" text-anchor="start">Cisto suspeito de neoplasia mucinosa papilífera intraductal</text><text x="6.0" y="26.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Ressonância com colangiorressonância, tomografia e, se preciso, ecoendoscopia; classificar o ducto acometido.</text><rect x="149.1" y="34.1" width="1.8" height="6.0" fill="#8AA9DF"/><polygon points="146.0,39.1 154.0,39.1 150.0,45.1" fill="#8AA9DF"/><rect x="0.0" y="46.1" width="300.0" height="43.6" rx="7" fill="#E8F0FE" stroke="#8AA9DF" stroke-width="1"/><text x="6.0" y="60.1" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#16315C" text-anchor="start">Tem estigma de alto risco?</text><text x="6.0" y="72.4" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Icterícia obstrutiva com cisto na cabeça; nódulo mural captante de 5 mm ou</text><text x="6.0" y="82.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">mais; ducto principal de 10 mm ou mais; citologia positiva.</text><rect x="301.0" y="67.1" width="28.0" height="1.8" fill="#8AA9DF"/><polygon points="328.0,64.0 328.0,72.0 334.0,68.0" fill="#8AA9DF"/><text x="308.0" y="64.0" font-family="Inter Medium" font-weight="500" font-size="7.3" fill="#0B5BD3" text-anchor="start">sim</text><rect x="334.0" y="54.0" width="144.0" height="33.1" rx="7" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1"/><text x="406.0" y="68.0" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#16315C" text-anchor="middle">Cirurgia</text><text x="406.0" y="80.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle">ressecção direta</text><rect x="149.1" y="90.8" width="1.8" height="8.0" fill="#8AA9DF"/><polygon points="146.0,97.8 154.0,97.8 150.0,103.8" fill="#8AA9DF"/><text x="155.0" y="99.8" font-family="Inter Medium" font-weight="500" font-size="7.3" fill="#0B5BD3" text-anchor="start">não</text><rect x="0.0" y="104.8" width="300.0" height="54.1" rx="7" fill="#E8F0FE" stroke="#8AA9DF" stroke-width="1"/><text x="6.0" y="118.8" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#16315C" text-anchor="start">Tem característica preocupante?</text><text x="6.0" y="131.0" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Cisto de 3 cm ou mais; nódulo mural menor que 5 mm; parede espessa ou</text><text x="6.0" y="141.5" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">captante; ducto principal de 5 a 9 mm; crescimento rápido; linfonodo</text><text x="6.0" y="152.0" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">aumentado; pancreatite aguda.</text><rect x="301.0" y="130.9" width="28.0" height="1.8" fill="#8AA9DF"/><polygon points="328.0,127.8 328.0,135.8 334.0,131.8" fill="#8AA9DF"/><text x="308.0" y="127.8" font-family="Inter Medium" font-weight="500" font-size="7.3" fill="#0B5BD3" text-anchor="start">sim</text><rect x="334.0" y="109.8" width="144.0" height="54.1" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="406.0" y="123.8" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#16315C" text-anchor="middle">Ecoendoscopia com punção</text><text x="406.0" y="136.1" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle">citologia e antígeno</text><text x="406.0" y="146.5" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle">carcinoembrionário no líquido do</text><text x="406.0" y="157.0" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle">cisto</text><rect x="405.1" y="165.0" width="1.8" height="6.0" fill="#8AA9DF"/><polygon points="402.0,170.0 410.0,170.0 406.0,176.0" fill="#8AA9DF"/><rect x="334.0" y="176.0" width="144.0" height="20.1" rx="7" fill="#E8F0FE" stroke="#8AA9DF" stroke-width="1"/><text x="406.0" y="189.6" font-family="Inter SemiBold" font-weight="600" font-size="7.8" fill="#16315C" text-anchor="middle">Displasia de alto grau ou câncer?</text><rect x="149.1" y="159.9" width="1.8" height="45.2" fill="#8AA9DF"/><polygon points="146.0,204.1 154.0,204.1 150.0,210.1" fill="#8AA9DF"/><text x="155.0" y="168.9" font-family="Inter Medium" font-weight="500" font-size="7.3" fill="#0B5BD3" text-anchor="start">não</text><rect x="367.1" y="197.1" width="1.8" height="8.0" fill="#8AA9DF"/><polygon points="364.0,204.1 372.0,204.1 368.0,210.1" fill="#8AA9DF"/><text x="373.0" y="205.1" font-family="Inter Medium" font-weight="500" font-size="7.3" fill="#0B5BD3" text-anchor="start">sim</text><rect x="443.1" y="197.1" width="1.8" height="8.0" fill="#8AA9DF"/><polygon points="440.0,204.1 448.0,204.1 444.0,210.1" fill="#8AA9DF"/><text x="449.0" y="205.1" font-family="Inter Medium" font-weight="500" font-size="7.3" fill="#0B5BD3" text-anchor="start">não</text><rect x="334.0" y="210.1" width="68.0" height="41.5" rx="7" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1"/><text x="368.0" y="234.4" font-family="Inter SemiBold" font-weight="600" font-size="7.8" fill="#16315C" text-anchor="middle">Cirurgia</text><rect x="410.0" y="210.1" width="68.0" height="41.5" rx="7" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1"/><text x="444.0" y="223.7" font-family="Inter SemiBold" font-weight="600" font-size="7.8" fill="#16315C" text-anchor="middle">Seguimento</text><text x="444.0" y="235.2" font-family="Inter" font-weight="400" font-size="7" fill="#1F2933" text-anchor="middle">imagem a cada</text><text x="444.0" y="244.9" font-family="Inter" font-weight="400" font-size="7" fill="#1F2933" text-anchor="middle">6 meses a 1 ano</text><rect x="0.0" y="210.1" width="300.0" height="41.5" rx="7" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1"/><text x="150.0" y="228.3" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#16315C" text-anchor="middle">Seguimento com imagem</text><text x="150.0" y="240.5" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle">sem estigma e sem característica preocupante</text></svg>