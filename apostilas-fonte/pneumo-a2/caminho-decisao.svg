<svg xmlns="http://www.w3.org/2000/svg" width="478" height="420.0" viewBox="0 0 478 420.0"><rect x="0.6" y="0.6" width="476.8" height="45.8" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.2"/><circle cx="17" cy="14.6" r="8.5" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1.2"/><text x="17" y="17.8" text-anchor="middle" font-family="Inter SemiBold" font-size="8.5" fill="#0B5BD3">1</text><text x="34.0" y="14.6" font-family="Inter SemiBold" font-size="9" fill="#16315C">É pneumonia?</text><text x="34.0" y="26.5" font-family="Inter" font-size="8" fill="#1F2933">Clínica (sintomas respiratórios agudos, febre, dor pleurítica, achados focais), imagem com opacidade nova e</text><text x="34.0" y="37.4" font-family="Inter" font-size="8" fill="#1F2933">contexto fora do hospital.</text><line x1="239.0" y1="46.4" x2="239.0" y2="53.4" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="235.4,52.4 242.6,52.4 239.0,57.4" fill="#8AA9DF"/><rect x="0.6" y="57.4" width="476.8" height="45.8" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.2"/><circle cx="17" cy="71.4" r="8.5" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1.2"/><text x="17" y="74.6" text-anchor="middle" font-family="Inter SemiBold" font-size="8.5" fill="#0B5BD3">2</text><text x="34.0" y="71.4" font-family="Inter SemiBold" font-size="9" fill="#16315C">Quem é esse paciente?</text><text x="34.0" y="83.3" font-family="Inter" font-size="8" fill="#1F2933">Comorbidades, antibiótico ou internação nos últimos 90 dias, isolamento prévio de germe resistente, alergias,</text><text x="34.0" y="94.2" font-family="Inter" font-size="8" fill="#1F2933">deglutição e suporte em casa.</text><line x1="239.0" y1="103.2" x2="239.0" y2="110.2" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="235.4,109.2 242.6,109.2 239.0,114.2" fill="#8AA9DF"/><rect x="0.6" y="114.2" width="476.8" height="34.9" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.2"/><circle cx="17" cy="128.2" r="8.5" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1.2"/><text x="17" y="131.4" text-anchor="middle" font-family="Inter SemiBold" font-size="8.5" fill="#0B5BD3">3</text><text x="34.0" y="128.2" font-family="Inter SemiBold" font-size="9" fill="#16315C">Onde tratar e qual a gravidade?</text><text x="34.0" y="140.1" font-family="Inter" font-size="8" fill="#1F2933">CURB-65 com julgamento clínico. Um critério maior ou três menores definem a pneumonia grave.</text><line x1="239.0" y1="149.1" x2="239.0" y2="156.1" stroke="#8AA9DF" stroke-width="1.6"/><line x1="76.7" y1="156.1" x2="401.3" y2="156.1" stroke="#8AA9DF" stroke-width="1.6"/><line x1="76.7" y1="156.1" x2="76.7" y2="165.1" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="73.1,164.1 80.3,164.1 76.7,169.1" fill="#8AA9DF"/><line x1="239.0" y1="156.1" x2="239.0" y2="165.1" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="235.4,164.1 242.6,164.1 239.0,169.1" fill="#8AA9DF"/><line x1="401.3" y1="156.1" x2="401.3" y2="165.1" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="397.7,164.1 404.9,164.1 401.3,169.1" fill="#8AA9DF"/><rect x="0.6" y="169.1" width="152.3" height="54.7" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.2"/><text x="8.6" y="182.1" font-family="Inter SemiBold" font-size="9" fill="#16315C">Em casa</text><text x="8.6" y="194.0" font-family="Inter" font-size="8" fill="#1F2933">CURB-65 de 0 a 1 e nenhum outro</text><text x="8.6" y="204.9" font-family="Inter" font-size="8" fill="#1F2933">motivo para internar.</text><rect x="162.9" y="169.1" width="152.3" height="54.7" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.2"/><text x="170.9" y="182.1" font-family="Inter SemiBold" font-size="9" fill="#16315C">Na enfermaria</text><text x="170.9" y="194.0" font-family="Inter" font-size="8" fill="#1F2933">CURB-65 de 2 ou mais, ou</text><text x="170.9" y="204.9" font-family="Inter" font-size="8" fill="#1F2933">hipoxemia, comorbidade</text><text x="170.9" y="215.8" font-family="Inter" font-size="8" fill="#1F2933">descompensada ou falta de suporte.</text><rect x="325.1" y="169.1" width="152.3" height="54.7" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.2"/><text x="333.1" y="182.1" font-family="Inter SemiBold" font-size="9" fill="#16315C">Na terapia intensiva</text><text x="333.1" y="194.0" font-family="Inter" font-size="8" fill="#1F2933">Pneumonia grave: um critério maior</text><text x="333.1" y="204.9" font-family="Inter" font-size="8" fill="#1F2933">ou três menores.</text><line x1="76.7" y1="223.8" x2="76.7" y2="230.8" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="73.1,229.8 80.3,229.8 76.7,234.8" fill="#8AA9DF"/><line x1="239.0" y1="223.8" x2="239.0" y2="230.8" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="235.4,229.8 242.6,229.8 239.0,234.8" fill="#8AA9DF"/><line x1="401.3" y1="223.8" x2="401.3" y2="230.8" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="397.7,229.8 404.9,229.8 401.3,234.8" fill="#8AA9DF"/><rect x="0.6" y="234.8" width="152.3" height="43.8" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.2"/><text x="8.6" y="247.8" font-family="Inter SemiBold" font-size="9" fill="#16315C">Exames</text><text x="8.6" y="259.7" font-family="Inter" font-size="8" fill="#1F2933">Oximetria e radiografia. Sem exames</text><text x="8.6" y="270.6" font-family="Inter" font-size="8" fill="#1F2933">de sangue nem cultura de rotina.</text><rect x="162.9" y="234.8" width="152.3" height="43.8" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.2"/><text x="170.9" y="247.8" font-family="Inter SemiBold" font-size="9" fill="#16315C">Exames</text><text x="170.9" y="259.7" font-family="Inter" font-size="8" fill="#1F2933">Exames laboratoriais conforme a</text><text x="170.9" y="270.6" font-family="Inter" font-size="8" fill="#1F2933">avaliação e culturas.</text><rect x="325.1" y="234.8" width="152.3" height="43.8" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.2"/><text x="333.1" y="247.8" font-family="Inter SemiBold" font-size="9" fill="#16315C">Exames</text><text x="333.1" y="259.7" font-family="Inter" font-size="8" fill="#1F2933">Investigação ampliada:</text><text x="333.1" y="270.6" font-family="Inter" font-size="8" fill="#1F2933">hemoculturas e testes virais.</text><line x1="76.7" y1="278.6" x2="76.7" y2="285.6" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="73.1,284.6 80.3,284.6 76.7,289.6" fill="#8AA9DF"/><line x1="239.0" y1="278.6" x2="239.0" y2="285.6" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="235.4,284.6 242.6,284.6 239.0,289.6" fill="#8AA9DF"/><line x1="401.3" y1="278.6" x2="401.3" y2="285.6" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="397.7,284.6 404.9,284.6 401.3,289.6" fill="#8AA9DF"/><rect x="0.6" y="289.6" width="152.3" height="65.6" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.2"/><text x="8.6" y="302.6" font-family="Inter SemiBold" font-size="9" fill="#16315C">Antibiótico</text><text x="8.6" y="314.5" font-family="Inter" font-size="8" fill="#1F2933">Sem comorbidade: amoxicilina,</text><text x="8.6" y="325.4" font-family="Inter" font-size="8" fill="#1F2933">doxiciclina ou macrolídeo. Com</text><text x="8.6" y="336.3" font-family="Inter" font-size="8" fill="#1F2933">comorbidade: combinação ou</text><text x="8.6" y="347.2" font-family="Inter" font-size="8" fill="#1F2933">fluoroquinolona.</text><rect x="162.9" y="289.6" width="152.3" height="65.6" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.2"/><text x="170.9" y="302.6" font-family="Inter SemiBold" font-size="9" fill="#16315C">Antibiótico</text><text x="170.9" y="314.5" font-family="Inter" font-size="8" fill="#1F2933">Betalactâmico com macrolídeo, ou</text><text x="170.9" y="325.4" font-family="Inter" font-size="8" fill="#1F2933">fluoroquinolona respiratória sozinha.</text><rect x="325.1" y="289.6" width="152.3" height="65.6" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.2"/><text x="333.1" y="302.6" font-family="Inter SemiBold" font-size="9" fill="#16315C">Antibiótico</text><text x="333.1" y="314.5" font-family="Inter" font-size="8" fill="#1F2933">Antibiótico e manejo de pneumonia</text><text x="333.1" y="325.4" font-family="Inter" font-size="8" fill="#1F2933">grave; considerar corticoide, nunca</text><text x="333.1" y="336.3" font-family="Inter" font-size="8" fill="#1F2933">na influenza.</text><line x1="76.7" y1="355.2" x2="76.7" y2="362.2" stroke="#8AA9DF" stroke-width="1.6"/><line x1="239.0" y1="355.2" x2="239.0" y2="362.2" stroke="#8AA9DF" stroke-width="1.6"/><line x1="401.3" y1="355.2" x2="401.3" y2="362.2" stroke="#8AA9DF" stroke-width="1.6"/><line x1="76.7" y1="362.2" x2="401.3" y2="362.2" stroke="#8AA9DF" stroke-width="1.6"/><line x1="239.0" y1="362.2" x2="239.0" y2="372.2" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="235.4,368.2 242.6,368.2 239.0,373.2" fill="#8AA9DF"/><rect x="0.6" y="373.2" width="476.8" height="45.8" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.2"/><circle cx="17" cy="387.2" r="8.5" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1.2"/><text x="17" y="390.4" text-anchor="middle" font-family="Inter SemiBold" font-size="8.5" fill="#0B5BD3">4</text><text x="34.0" y="387.2" font-family="Inter SemiBold" font-size="9" fill="#16315C">Reavaliar em 48 a 72 horas</text><text x="34.0" y="399.1" font-family="Inter" font-size="8" fill="#1F2933">Estável: encerrar com 3 a 5 dias (grave: 5 dias ou mais). Não estável: rever o diagnóstico, a gravidade, o agente, a</text><text x="34.0" y="410.0" font-family="Inter" font-size="8" fill="#1F2933">resistência e se o remédio foi usado direito.</text></svg>