<svg xmlns="http://www.w3.org/2000/svg" width="478" height="142" viewBox="0 0 478 142">
<rect x="0.5" y="1.0" width="477.0" height="26.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="239.0" y="17.5" font-family="Inter SemiBold" font-weight="600" font-size="9" fill="#16315C" text-anchor="middle">Bloqueia a entrada de cálcio nas células musculares lisas dos vasos</text>
<polygon points="237.4,29.0 240.6,29.0 240.6,37.0 244.5,37.0 239.0,43.0 233.5,37.0 237.4,37.0" fill="#8AA9DF"/>
<rect x="0.5" y="45.0" width="477.0" height="26.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="239.0" y="61.5" font-family="Inter SemiBold" font-weight="600" font-size="9" fill="#16315C" text-anchor="middle">O vaso não contrai e fica dilatado: vasodilatação</text>
<polygon points="237.4,73.0 240.6,73.0 240.6,75.0 244.5,75.0 239.0,81.0 233.5,75.0 237.4,75.0" fill="#8AA9DF"/>
<rect x="74.1" y="79.4" width="329.9" height="3.2" fill="#8AA9DF"/>
<polygon points="74.1,81.0 77.3,81.0 77.3,85.0 81.2,85.0 75.7,91.0 70.2,85.0 74.1,85.0" fill="#8AA9DF"/>
<polygon points="237.4,81.0 240.6,81.0 240.6,85.0 244.5,85.0 239.0,91.0 233.5,85.0 237.4,85.0" fill="#8AA9DF"/>
<polygon points="400.7,81.0 403.9,81.0 403.9,85.0 407.8,85.0 402.3,91.0 396.8,85.0 400.7,85.0" fill="#8AA9DF"/>
<rect x="0.5" y="92.0" width="150.3" height="48.4" rx="8" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/>
<text x="9.0" y="107.0" font-family="Inter SemiBold" font-weight="600" font-size="8.8" fill="#16315C" text-anchor="start">A resistência vascular</text>
<text x="9.0" y="118.0" font-family="Inter SemiBold" font-weight="600" font-size="8.8" fill="#16315C" text-anchor="start">periférica cai</text>
<text x="9.0" y="129.5" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">a pressão baixa</text>
<rect x="163.8" y="92.0" width="150.3" height="48.4" rx="8" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/>
<text x="172.3" y="107.0" font-family="Inter SemiBold" font-weight="600" font-size="8.8" fill="#16315C" text-anchor="start">O retorno venoso diminui</text>
<text x="172.3" y="118.5" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">edema bimaleolar, em volta dos</text>
<text x="172.3" y="128.9" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">tornozelos</text>
<rect x="327.2" y="92.0" width="150.3" height="48.4" rx="8" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/>
<text x="335.7" y="107.0" font-family="Inter SemiBold" font-weight="600" font-size="8.8" fill="#16315C" text-anchor="start">O rosto também dilata</text>
<text x="335.7" y="118.5" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">rubor facial: duas manchinhas</text>
<text x="335.7" y="128.9" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">vermelhas</text>
</svg>
