<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="177pt" viewBox="0 0 478 177"><text x="8" y="13" font-family="Inter SemiBold" font-size="8.4" fill="#16315C" text-anchor="start">Contando desde a internação</text><rect x="10" y="22" width="164" height="40" rx="9" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1" stroke-dasharray="3 2.5"/><rect x="10" y="22" width="164" height="40" rx="9" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1" stroke-dasharray="3 2.5"/><text x="92.0" y="40.585" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="middle">Comunitária</text><text x="92.0" y="53.095" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">provavelmente já internou com ela</text><rect x="181" y="22" width="144" height="40" rx="9" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1.1"/><text x="253.0" y="40.585" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="middle">Hospitalar precoce</text><text x="253.0" y="53.095" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">até o 4º dia de internação</text><rect x="331" y="22" width="139" height="40" rx="9" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1.1"/><text x="400.5" y="40.585" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="middle">Hospitalar tardia</text><text x="400.5" y="53.095" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">a partir do 5º dia de internação</text><line x1="8" y1="22" x2="8" y2="64" stroke="#0B5BD3" stroke-width="1.6"/><line x1="178" y1="22" x2="178" y2="64" stroke="#0B5BD3" stroke-width="1.6"/><line x1="328" y1="22" x2="328" y2="64" stroke="#0B5BD3" stroke-width="1.6"/><text x="11" y="76" font-family="Inter" font-size="7.8" fill="#0B5BD3" text-anchor="start">internação</text><text x="181" y="76" font-family="Inter" font-size="7.8" fill="#0B5BD3" text-anchor="start">48 horas</text><text x="331" y="76" font-family="Inter" font-size="7.8" fill="#0B5BD3" text-anchor="start">5º dia</text><text x="8" y="96" font-family="Inter SemiBold" font-size="8.4" fill="#16315C" text-anchor="start">Contando desde a intubação</text><rect x="10" y="105" width="164" height="50" rx="9" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1" stroke-dasharray="3 2.5"/><text x="92.0" y="118.44" font-family="Inter SemiBold" font-size="8.8" fill="#16315C" text-anchor="middle">Ainda não é associada à</text><text x="92.0" y="129.44" font-family="Inter SemiBold" font-size="8.8" fill="#16315C" text-anchor="middle">ventilação</text><text x="92.0" y="141.16" font-family="Inter" font-size="7.2" fill="#4A4A4F" text-anchor="middle">é comunitária ou hospitalar, conforme a</text><text x="92.0" y="150.52" font-family="Inter" font-size="7.2" fill="#4A4A4F" text-anchor="middle">internação</text><rect x="181" y="105" width="289" height="50" rx="9" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1.1"/><text x="325.5" y="128.585" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="middle">Pneumonia associada à ventilação mecânica</text><text x="325.5" y="141.095" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">o quadro começou com o paciente intubado há pelo menos 48 horas</text><line x1="8" y1="105" x2="8" y2="157" stroke="#0B5BD3" stroke-width="1.6"/><line x1="178" y1="105" x2="178" y2="157" stroke="#0B5BD3" stroke-width="1.6"/><text x="11" y="169" font-family="Inter" font-size="7.8" fill="#0B5BD3" text-anchor="start">intubação orotraqueal</text><text x="181" y="169" font-family="Inter" font-size="7.8" fill="#0B5BD3" text-anchor="start">48 horas</text></svg>