<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="190pt" viewBox="0 0 478 190"><rect x="2" y="2" width="224" height="26" rx="9" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1"/><text x="114.0" y="13.585" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="middle">Bacilos gram-negativos</text><text x="114.0" y="26.095000000000002" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">Pseudomonas, Klebsiella, E. coli, Acinetobacter</text><line x1="114.0" y1="29" x2="114.0" y2="33.5" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="114.0,39 110.8,33.5 117.2,33.5" fill="#8AA9DF"/><rect x="2" y="40" width="224" height="41.599999999999994" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="114.0" y="54" font-family="Inter" font-size="8.2" fill="#1F2933" text-anchor="middle">Algum fator de risco da lista do tipo de</text><text x="114.0" y="65.2" font-family="Inter" font-size="8.2" fill="#1F2933" text-anchor="middle">pneumonia? Na associada à ventilação, também:</text><text x="114.0" y="76.4" font-family="Inter" font-size="8.2" fill="#1F2933" text-anchor="middle">resistência local acima de 10% ou desconhecida.</text><line x1="104.0" y1="83.6" x2="68.9680262739486" y2="100.24018751987441" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="64.0,102.6 67.59504446733007,97.34969950594068 70.34100808056712,103.13067553380814" fill="#8AA9DF"/><line x1="124.0" y1="83.6" x2="159.0319737260514" y2="100.24018751987441" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="164.0,102.6 157.65899191943288,103.13067553380814 160.40495553266993,97.34969950594068" fill="#8AA9DF"/><text x="62.0" y="96.6" font-family="Inter SemiBold" font-size="7.6" fill="#0B5BD3" text-anchor="end">Sim</text><text x="166.0" y="96.6" font-family="Inter SemiBold" font-size="7.6" fill="#0B5BD3" text-anchor="start">Não</text><rect x="2.0" y="103.6" width="108.0" height="50" rx="9" fill="#E7F7EC" stroke="#BFE5CB" stroke-width="1.1"/><text x="56.0" y="117.46999999999998" font-family="Inter SemiBold" font-size="8.8" fill="#1E7A34" text-anchor="middle">Duas drogas</text><text x="56.0" y="129.20999999999998" font-family="Inter" font-size="7.4" fill="#4A4A4F" text-anchor="middle">sem juntar dois</text><text x="56.0" y="138.82999999999998" font-family="Inter" font-size="7.4" fill="#4A4A4F" text-anchor="middle">betalactâmicos</text><text x="56.0" y="148.45" font-family="Inter" font-size="7.4" fill="#4A4A4F" text-anchor="middle">(sinergismo)</text><rect x="118.0" y="103.6" width="108.0" height="50" rx="9" fill="#E7F7EC" stroke="#BFE5CB" stroke-width="1.1"/><text x="172.0" y="122.27999999999999" font-family="Inter SemiBold" font-size="8.8" fill="#1E7A34" text-anchor="middle">Uma droga</text><text x="172.0" y="134.01999999999998" font-family="Inter" font-size="7.4" fill="#4A4A4F" text-anchor="middle">que também cubra o</text><text x="172.0" y="143.64" font-family="Inter" font-size="7.4" fill="#4A4A4F" text-anchor="middle">estafilococo sensível</text><rect x="252" y="2" width="224" height="26" rx="9" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1"/><text x="364.0" y="13.585" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="middle">Cocos gram-positivos</text><text x="364.0" y="26.095000000000002" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">Staphylococcus aureus (estafilococo)</text><line x1="364.0" y1="29" x2="364.0" y2="33.5" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="364.0,39 360.8,33.5 367.2,33.5" fill="#8AA9DF"/><rect x="252" y="40" width="224" height="41.599999999999994" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="364.0" y="54" font-family="Inter" font-size="8.2" fill="#1F2933" text-anchor="middle">Estafilococo resistente à oxacilina acima do corte,</text><text x="364.0" y="65.2" font-family="Inter" font-size="8.2" fill="#1F2933" text-anchor="middle">ou taxa desconhecida? Hospitalar: 20%.</text><text x="364.0" y="76.4" font-family="Inter" font-size="8.2" fill="#1F2933" text-anchor="middle">Associada à ventilação: 10 a 20%.</text><line x1="354.0" y1="83.6" x2="318.96802627394857" y2="100.24018751987441" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="314.0,102.6 317.59504446733007,97.34969950594068 320.34100808056706,103.13067553380814" fill="#8AA9DF"/><line x1="374.0" y1="83.6" x2="409.03197372605143" y2="100.24018751987441" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="414.0,102.6 407.65899191943294,103.13067553380814 410.40495553266993,97.34969950594068" fill="#8AA9DF"/><text x="312.0" y="96.6" font-family="Inter SemiBold" font-size="7.6" fill="#0B5BD3" text-anchor="end">Sim</text><text x="416.0" y="96.6" font-family="Inter SemiBold" font-size="7.6" fill="#0B5BD3" text-anchor="start">Não</text><rect x="252.0" y="103.6" width="108.0" height="50" rx="9" fill="#E7F7EC" stroke="#BFE5CB" stroke-width="1.1"/><text x="306.0" y="121.58999999999999" font-family="Inter SemiBold" font-size="8.8" fill="#1E7A34" text-anchor="middle">Vancomicina ou</text><text x="306.0" y="132.58999999999997" font-family="Inter SemiBold" font-size="8.8" fill="#1E7A34" text-anchor="middle">linezolida</text><text x="306.0" y="144.32999999999998" font-family="Inter" font-size="7.4" fill="#4A4A4F" text-anchor="middle">somar ao esquema</text><rect x="368.0" y="103.6" width="108.0" height="50" rx="9" fill="#E7F7EC" stroke="#BFE5CB" stroke-width="1.1"/><text x="422.0" y="116.77999999999999" font-family="Inter SemiBold" font-size="8.8" fill="#1E7A34" text-anchor="middle">Não precisa de</text><text x="422.0" y="127.77999999999999" font-family="Inter SemiBold" font-size="8.8" fill="#1E7A34" text-anchor="middle">vancomicina</text><text x="422.0" y="139.51999999999998" font-family="Inter" font-size="7.4" fill="#4A4A4F" text-anchor="middle">basta cobrir o estafilococo</text><text x="422.0" y="149.14" font-family="Inter" font-size="7.4" fill="#4A4A4F" text-anchor="middle">sensível</text><rect x="2" y="159.6" width="474" height="30" rx="9" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1"/><text x="239.0" y="172.6" font-family="Inter SemiBold" font-size="9.2" fill="#16315C" text-anchor="middle">Somando as duas colunas: de 1 a 3 antibióticos</text><text x="239.0" y="183.6" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">As doses e as combinações estão nas tabelas da diretriz: não precisa decorar, precisa saber consultar.</text></svg>