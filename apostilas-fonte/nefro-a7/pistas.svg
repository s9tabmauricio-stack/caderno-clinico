<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="325pt" viewBox="0 0 478 325">
<text x="2.0" y="9.0" font-family="Inter" font-size="7.2" font-weight="600" fill="#6C6C70" text-anchor="start">Pista na consulta ou no exame</text>
<text x="338.0" y="9.0" font-family="Inter" font-size="7.2" font-weight="600" fill="#6C6C70" text-anchor="start">Pense em</text>
<rect x="0.0" y="18.0" width="300.0" height="25.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="8.0" y="32.8" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="start">Hipertensão com potássio baixo no sangue (e alto na urina)</text>
<rect x="336.0" y="18.0" width="142.0" height="25.0" rx="8" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/>
<text x="344.0" y="33.0" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">Hiperaldosteronismo primário</text>
<line x1="304.0" y1="30.5" x2="329.0" y2="30.5" stroke="#8AA9DF" stroke-width="1.4"/>
<polygon points="333.0,30.5 327.5,33.8 327.5,27.2" fill="#8AA9DF"/>
<rect x="0.0" y="49.0" width="300.0" height="35.2" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="8.0" y="63.6" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="start">Crises de pressão alta com dor de cabeça, suor, palpitação, palidez e</text>
<text x="8.0" y="74.2" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="start">pelos arrepiados</text>
<rect x="336.0" y="49.0" width="142.0" height="35.2" rx="8" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/>
<text x="344.0" y="69.1" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">Feocromocitoma</text>
<line x1="304.0" y1="66.6" x2="329.0" y2="66.6" stroke="#8AA9DF" stroke-width="1.4"/>
<polygon points="333.0,66.6 327.5,69.9 327.5,63.3" fill="#8AA9DF"/>
<rect x="0.0" y="90.2" width="300.0" height="35.2" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="8.0" y="104.8" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="start">Início súbito antes dos 30 ou depois dos 55 anos, sopro no abdome,</text>
<text x="8.0" y="115.4" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="start">edema agudo de pulmão sem explicação</text>
<rect x="336.0" y="90.2" width="142.0" height="35.2" rx="8" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/>
<text x="344.0" y="110.3" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">Estenose da artéria renal</text>
<line x1="304.0" y1="107.8" x2="329.0" y2="107.8" stroke="#8AA9DF" stroke-width="1.4"/>
<polygon points="333.0,107.8 327.5,111.1 327.5,104.5" fill="#8AA9DF"/>
<rect x="0.0" y="131.4" width="300.0" height="35.2" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="8.0" y="146.0" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="start">Inchaço, anemia, cansaço, ureia e creatinina altas, exame de urina</text>
<text x="8.0" y="156.6" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="start">alterado</text>
<rect x="336.0" y="131.4" width="142.0" height="35.2" rx="8" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/>
<text x="344.0" y="151.5" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">Doença renal parenquimatosa</text>
<line x1="304.0" y1="149.0" x2="329.0" y2="149.0" stroke="#8AA9DF" stroke-width="1.4"/>
<polygon points="333.0,149.0 327.5,152.3 327.5,145.7" fill="#8AA9DF"/>
<rect x="0.0" y="172.6" width="300.0" height="25.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="8.0" y="187.4" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="start">Ronco, sono picado, sono não reparador e sonolência de dia</text>
<rect x="336.0" y="172.6" width="142.0" height="25.0" rx="8" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/>
<text x="344.0" y="187.6" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">Apneia do sono</text>
<line x1="304.0" y1="185.1" x2="329.0" y2="185.1" stroke="#8AA9DF" stroke-width="1.4"/>
<polygon points="333.0,185.1 327.5,188.4 327.5,181.8" fill="#8AA9DF"/>
<rect x="0.0" y="203.6" width="300.0" height="25.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="8.0" y="218.4" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="start">Pressão dos braços diferente da pressão das pernas</text>
<rect x="336.0" y="203.6" width="142.0" height="25.0" rx="8" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/>
<text x="344.0" y="218.6" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">Coarctação da aorta</text>
<line x1="304.0" y1="216.1" x2="329.0" y2="216.1" stroke="#8AA9DF" stroke-width="1.4"/>
<polygon points="333.0,216.1 327.5,219.4 327.5,212.8" fill="#8AA9DF"/>
<rect x="0.0" y="234.6" width="300.0" height="25.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="8.0" y="249.4" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="start">Rosto em lua cheia, giba, barriga grande e pernas finas</text>
<rect x="336.0" y="234.6" width="142.0" height="25.0" rx="8" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/>
<text x="344.0" y="249.6" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">Síndrome de Cushing</text>
<line x1="304.0" y1="247.1" x2="329.0" y2="247.1" stroke="#8AA9DF" stroke-width="1.4"/>
<polygon points="333.0,247.1 327.5,250.4 327.5,243.8" fill="#8AA9DF"/>
<rect x="0.0" y="265.6" width="300.0" height="25.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="8.0" y="280.4" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="start">Magreza, intolerância ao calor, taquicardia e agitação</text>
<rect x="336.0" y="265.6" width="142.0" height="25.0" rx="8" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/>
<text x="344.0" y="280.6" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">Hipertireoidismo</text>
<line x1="304.0" y1="278.1" x2="329.0" y2="278.1" stroke="#8AA9DF" stroke-width="1.4"/>
<polygon points="333.0,278.1 327.5,281.4 327.5,274.8" fill="#8AA9DF"/>
<rect x="0.0" y="296.6" width="300.0" height="25.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="8.0" y="311.4" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="start">Cansaço, ganho de peso, queda de cabelo, pressão diastólica alta</text>
<rect x="336.0" y="296.6" width="142.0" height="25.0" rx="8" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/>
<text x="344.0" y="311.6" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">Hipotireoidismo</text>
<line x1="304.0" y1="309.1" x2="329.0" y2="309.1" stroke="#8AA9DF" stroke-width="1.4"/>
<polygon points="333.0,309.1 327.5,312.4 327.5,305.8" fill="#8AA9DF"/>
</svg>
