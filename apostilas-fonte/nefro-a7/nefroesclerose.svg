<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="202pt" viewBox="0 0 478 202">
<rect x="0.0" y="2.0" width="109.0" height="58.6" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="7.0" y="16.2" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">Pressão alta por anos</text>
<text x="7.0" y="30.0" font-family="Inter" font-size="7.5" font-weight="400" fill="#1F2933" text-anchor="start">a pressão dentro do</text>
<text x="7.0" y="40.0" font-family="Inter" font-size="7.5" font-weight="400" fill="#1F2933" text-anchor="start">glomérulo sobe</text>
<line x1="111.0" y1="31.3" x2="117.0" y2="31.3" stroke="#8AA9DF" stroke-width="1.4"/>
<polygon points="121.0,31.3 115.5,34.6 115.5,28.0" fill="#8AA9DF"/>
<rect x="123.0" y="2.0" width="109.0" height="58.6" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="130.0" y="16.2" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">Arteríolas aferentes</text>
<text x="130.0" y="27.0" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">esclerosadas</text>
<text x="130.0" y="40.8" font-family="Inter" font-size="7.5" font-weight="400" fill="#1F2933" text-anchor="start">arterioloesclerose:</text>
<text x="130.0" y="50.8" font-family="Inter" font-size="7.5" font-weight="400" fill="#1F2933" text-anchor="start">envelhecem antes da hora</text>
<line x1="234.0" y1="31.3" x2="240.0" y2="31.3" stroke="#8AA9DF" stroke-width="1.4"/>
<polygon points="244.0,31.3 238.5,34.6 238.5,28.0" fill="#8AA9DF"/>
<rect x="246.0" y="2.0" width="109.0" height="58.6" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="253.0" y="16.2" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">Luz estreita, isquemia</text>
<text x="253.0" y="30.0" font-family="Inter" font-size="7.5" font-weight="400" fill="#1F2933" text-anchor="start">do glomérulo e do</text>
<text x="253.0" y="40.0" font-family="Inter" font-size="7.5" font-weight="400" fill="#1F2933" text-anchor="start">túbulo-interstício</text>
<line x1="357.0" y1="31.3" x2="363.0" y2="31.3" stroke="#8AA9DF" stroke-width="1.4"/>
<polygon points="367.0,31.3 361.5,34.6 361.5,28.0" fill="#8AA9DF"/>
<rect x="369.0" y="2.0" width="109.0" height="58.6" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="376.0" y="16.2" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">Glomérulo se perde</text>
<text x="376.0" y="30.0" font-family="Inter" font-size="7.5" font-weight="400" fill="#1F2933" text-anchor="start">esclerose focal, depois</text>
<text x="376.0" y="40.0" font-family="Inter" font-size="7.5" font-weight="400" fill="#1F2933" text-anchor="start">segmentar, depois global</text>
<rect x="0.0" y="94.6" width="330.0" height="105.8" rx="10" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/>
<text x="8.0" y="106.6" font-family="Inter" font-size="7.4" font-weight="600" fill="#6C6C70" text-anchor="start">O ciclo que perpetua a lesão renal</text>
<rect x="8.0" y="112.6" width="95.3" height="57.8" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="15.0" y="126.6" font-family="Inter" font-size="8.2" font-weight="600" fill="#16315C" text-anchor="start">Sobram menos</text>
<text x="15.0" y="137.2" font-family="Inter" font-size="8.2" font-weight="600" fill="#16315C" text-anchor="start">néfrons</text>
<text x="15.0" y="150.8" font-family="Inter" font-size="7.4" font-weight="400" fill="#1F2933" text-anchor="start">de 1 milhão, vão sendo</text>
<text x="15.0" y="160.6" font-family="Inter" font-size="7.4" font-weight="400" fill="#1F2933" text-anchor="start">perdidos</text>
<line x1="105.3" y1="141.5" x2="111.3" y2="141.5" stroke="#8AA9DF" stroke-width="1.4"/>
<polygon points="115.3,141.5 109.8,144.8 109.8,138.2" fill="#8AA9DF"/>
<rect x="117.3" y="112.6" width="95.3" height="57.8" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="124.3" y="126.6" font-family="Inter" font-size="8.2" font-weight="600" fill="#16315C" text-anchor="start">Os que sobram</text>
<text x="124.3" y="137.2" font-family="Inter" font-size="8.2" font-weight="600" fill="#16315C" text-anchor="start">trabalham a mais</text>
<text x="124.3" y="150.8" font-family="Inter" font-size="7.4" font-weight="400" fill="#1F2933" text-anchor="start">para dar conta da</text>
<text x="124.3" y="160.6" font-family="Inter" font-size="7.4" font-weight="400" fill="#1F2933" text-anchor="start">filtração</text>
<line x1="214.7" y1="141.5" x2="220.7" y2="141.5" stroke="#8AA9DF" stroke-width="1.4"/>
<polygon points="224.7,141.5 219.2,144.8 219.2,138.2" fill="#8AA9DF"/>
<rect x="226.7" y="112.6" width="95.3" height="57.8" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="233.7" y="126.6" font-family="Inter" font-size="8.2" font-weight="600" fill="#16315C" text-anchor="start">Adoecem pelo</text>
<text x="233.7" y="137.2" font-family="Inter" font-size="8.2" font-weight="600" fill="#16315C" text-anchor="start">esforço</text>
<text x="233.7" y="150.8" font-family="Inter" font-size="7.4" font-weight="400" fill="#1F2933" text-anchor="start">e o ciclo recomeça</text>
<path d="M274.3,172.4 L274.3,184.4 L55.7,184.4 L55.7,176.4" fill="none" stroke="#8AA9DF" stroke-width="1.4"/>
<polygon points="55.7,172.4 59.0,177.9 52.4,177.9" fill="#8AA9DF"/>
<path d="M423.5,62.6 L423.5,76.6 L55.7,76.6 L55.7,90.6" fill="none" stroke="#8AA9DF" stroke-width="1.4"/>
<polygon points="55.7,93.6 52.4,88.1 59.0,88.1" fill="#8AA9DF"/>
<rect x="344.0" y="94.6" width="134.0" height="105.8" rx="10" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1.6"/>
<text x="352.0" y="132.6" font-family="Inter" font-size="8.8" font-weight="700" fill="#0B5BD3" text-anchor="start">Controle ideal da pressão</text>
<text x="352.0" y="148.1" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">Freia o ciclo: menos glomérulos</text>
<text x="352.0" y="158.5" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">destruídos ao longo dos anos. É</text>
<text x="352.0" y="168.9" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">o foco do tratamento.</text>
<line x1="342.0" y1="147.5" x2="337.0" y2="147.5" stroke="#0B5BD3" stroke-width="1.4"/>
<polygon points="333.0,147.5 338.5,144.2 338.5,150.8" fill="#0B5BD3"/>
</svg>
