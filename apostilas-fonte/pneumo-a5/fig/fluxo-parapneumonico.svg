<rect x="163.8" y="176.0" width="34.5" height="10.0" rx="3" fill="#1F2933"/>
<text x="181.0" y="183.1" font-family="Inter" font-size="5.6" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.6">PROVA</text>
<text x="238.0" y="216.7" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">Turvo ou pus · Gram ou cultura com</text>
<text x="238.0" y="226.7" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">bactéria · pH abaixo de 7,2</text>
<rect x="330.0" y="182.0" width="148.0" height="64.0" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="404.0" y="211.9" font-family="Inter" font-size="7.4" font-weight="400" fill="#1F2933" text-anchor="middle">Pouco líquido, claro, sem bactéria e</text>
<text x="404.0" y="221.3" font-family="Inter" font-size="7.4" font-weight="400" fill="#1F2933" text-anchor="middle">pH de 7,2 ou mais</text>
<polygon points="403.8,144.3 244.2,179.9 243.2,175.5 238.0,182.0 245.5,185.7 244.5,181.3 404.2,145.7" fill="#8AA9DF"/>
