<text x="404.0" y="287.9" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933" text-anchor="middle">Esvazia, mantém o antibiótico e</text>
<text x="404.0" y="297.1" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933" text-anchor="middle">reavalia; voltou: nova punção</text>
