<text x="72.0" y="63.9" font-family="Inter" font-size="7.4" font-weight="400" fill="#1F2933" text-anchor="middle">Derrame menor que 10 mm (coluna</text>
<text x="72.0" y="73.3" font-family="Inter" font-size="7.4" font-weight="400" fill="#1F2933" text-anchor="middle">menor que 1 cm, deitado de lado)</text>
<rect x="330.0" y="51.0" width="148.0" height="30.0" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="404.0" y="68.7" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="middle">Derrame maior que 10 mm</text>
<rect x="0.0" y="108.0" width="144.0" height="44.0" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="72.0" y="127.9" font-family="Inter" font-size="7.4" font-weight="400" fill="#1F2933" text-anchor="middle">Não punciona: trata a pneumonia e</text>
<text x="72.0" y="137.3" font-family="Inter" font-size="7.4" font-weight="400" fill="#1F2933" text-anchor="middle">repete a radiografia</text>
