<text x="238.0" y="287.7" font-family="Inter" font-size="7.8" font-weight="600" fill="#FFFFFF" text-anchor="middle">Drenagem fechada: dreno em selo</text>
<text x="238.0" y="297.7" font-family="Inter" font-size="7.8" font-weight="600" fill="#FFFFFF" text-anchor="middle">d&#x27;água</text>
