<text x="323.5" y="292.3" font-family="Inter" font-size="6.8" font-weight="600" fill="#0B5BD3" text-anchor="middle">piorou</text>
<rect x="159.0" y="331.0" width="158.0" height="38.0" rx="6" fill="#16315C" stroke="#16315C" stroke-width="1"/>
<text x="238.0" y="347.9" font-family="Inter" font-size="7.4" font-weight="600" fill="#FFFFFF" text-anchor="middle">Sem resposta: cirurgia (vídeo ou aberta,</text>
<text x="238.0" y="357.3" font-family="Inter" font-size="7.4" font-weight="600" fill="#FFFFFF" text-anchor="middle">decorticação)</text>
