<rect x="1.0" y="128.0" width="150.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="76.0" y="143.9" font-family="Inter" font-size="7.4" font-weight="400" fill="#1F2933" text-anchor="middle">Não: procurar outra causa da falta de</text>
<text x="76.0" y="153.3" font-family="Inter" font-size="7.4" font-weight="400" fill="#1F2933" text-anchor="middle">ar</text>
<rect x="322.0" y="128.0" width="156.0" height="36.0" rx="6" fill="#F5F8FF" stroke="#8AA9DF" stroke-width="1" stroke-dasharray="3 2"/>
<text x="400.0" y="143.8" font-family="Inter" font-size="7.6" font-weight="600" fill="#16315C" text-anchor="middle">Sim: o pulmão reexpandiu? (exame de</text>
<text x="400.0" y="153.5" font-family="Inter" font-size="7.6" font-weight="600" fill="#16315C" text-anchor="middle">imagem)</text>
<polygon points="138.7,95.3 81.5,124.4 79.4,120.4 76.0,128.0 84.2,129.7 82.1,125.7 139.3,96.7" fill="#8AA9DF"/>
