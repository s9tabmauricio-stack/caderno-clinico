<text x="107.5" y="114.3" font-family="Inter" font-size="6.8" font-weight="600" fill="#0B5BD3" text-anchor="middle">não</text>
<polygon points="338.7,96.7 393.9,125.6 391.8,129.6 400.0,128.0 396.7,120.4 394.6,124.3 339.3,95.3" fill="#8AA9DF"/>
