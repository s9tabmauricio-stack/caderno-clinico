<text x="239.0" y="56.7" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="middle">Toracocentese de alívio (guiada por ultrassom)</text>
<rect x="139.0" y="82.0" width="200.0" height="28.0" rx="6" fill="#F5F8FF" stroke="#8AA9DF" stroke-width="1" stroke-dasharray="3 2"/>
<text x="239.0" y="98.8" font-family="Inter" font-size="8" font-weight="600" fill="#16315C" text-anchor="middle">A falta de ar melhorou?</text>
