<rect x="1.0" y="241.0" width="150.0" height="46.0" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="76.0" y="261.9" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933" text-anchor="middle">Pouco tempo (1 a 2 meses):</text>
<text x="76.0" y="271.1" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933" text-anchor="middle">toracocentese a cada 15 a 20 dias</text>
<rect x="174.0" y="241.0" width="150.0" height="46.0" rx="6" fill="#16315C" stroke="#16315C" stroke-width="1"/>
<text x="249.0" y="261.9" font-family="Inter" font-size="7.2" font-weight="600" fill="#FFFFFF" text-anchor="middle">Bom tempo (1 a 2 anos): pleurodese</text>
<text x="249.0" y="271.1" font-family="Inter" font-size="7.2" font-weight="600" fill="#FFFFFF" text-anchor="middle">com talco ou iodopovidona</text>
