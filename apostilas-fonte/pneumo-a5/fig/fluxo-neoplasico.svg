<text x="369.5" y="114.3" font-family="Inter" font-size="6.8" font-weight="600" fill="#0B5BD3" text-anchor="middle">sim</text>
<rect x="155.0" y="182.0" width="168.0" height="36.0" rx="6" fill="#F5F8FF" stroke="#8AA9DF" stroke-width="1" stroke-dasharray="3 2"/>
<text x="239.0" y="197.8" font-family="Inter" font-size="7.6" font-weight="600" fill="#16315C" text-anchor="middle">Reexpandiu: quanto tempo de vida se</text>
<text x="239.0" y="207.5" font-family="Inter" font-size="7.6" font-weight="600" fill="#16315C" text-anchor="middle">espera?</text>
<rect x="326.0" y="182.0" width="152.0" height="64.0" rx="6" fill="#FFFFFF" stroke="#E3E3E8" stroke-width="1" stroke-dasharray="3 2"/>
<text x="402.0" y="207.6" font-family="Inter" font-size="6.9" font-weight="400" fill="#4A4A4F" text-anchor="middle">Não reexpandiu (slide): cateter pleural</text>
<text x="402.0" y="216.4" font-family="Inter" font-size="6.9" font-weight="400" fill="#4A4A4F" text-anchor="middle">tunelizado se viver mais de 1 semana; se</text>
<text x="402.0" y="225.2" font-family="Inter" font-size="6.9" font-weight="400" fill="#4A4A4F" text-anchor="middle">não, punções, oxigênio ou morfina</text>
