<circle cx="152.0" cy="157.0" r="7.0" fill="#0B5BD3"/>
<text x="152.0" y="159.6" font-family="Inter" font-size="7.2" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="239.0" y="164.0" font-family="Inter" font-size="7.2" font-weight="600" fill="#16315C" text-anchor="middle">sobram cerca de 6:</text>
<text x="239.0" y="173.4" font-family="Inter" font-size="7.2" font-weight="600" fill="#16315C" text-anchor="middle">saem pela linfa</text>
<text x="404.0" y="60.0" font-family="Inter" font-size="8" font-weight="600" fill="#16315C" text-anchor="middle">empurra 29</text>
<text x="404.0" y="70.4" font-family="Inter" font-size="8" font-weight="600" fill="#16315C" text-anchor="middle">puxa 29</text>
