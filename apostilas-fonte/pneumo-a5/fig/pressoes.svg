<text x="239.0" y="26.0" font-family="Inter" font-size="7" font-weight="400" fill="#6C6C70" text-anchor="middle">onde o líquido fica</text>
<rect x="330.0" y="0.0" width="148.0" height="198.0" rx="9" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/>
<text x="404.0" y="15.0" font-family="Inter" font-size="8.6" font-weight="700" fill="#16315C" text-anchor="middle">Pulmão</text>
<text x="404.0" y="26.0" font-family="Inter" font-size="7" font-weight="400" fill="#6C6C70" text-anchor="middle">capilar da pleura visceral</text>
