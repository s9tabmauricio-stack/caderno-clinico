<text x="74.0" y="66.0" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933" text-anchor="middle">empurra o líquido</text>
<text x="74.0" y="75.4" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933" text-anchor="middle">para fora</text>
