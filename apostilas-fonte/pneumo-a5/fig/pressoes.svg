<polygon points="300.0,96.9 361.0,96.9 361.0,101.0 368.0,96.0 361.0,91.0 361.0,95.1 300.0,95.1" fill="#8AA9DF"/>
<text x="404.0" y="92.0" font-family="Inter" font-size="7.6" font-weight="700" fill="#16315C" text-anchor="middle">saldo: zero</text>
<circle cx="404.0" cy="126.0" r="7.0" fill="#0B5BD3"/>
<text x="404.0" y="128.6" font-family="Inter" font-size="7.2" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="404.0" y="144.0" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933" text-anchor="middle">inflamação abre a</text>
<text x="404.0" y="153.4" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933" text-anchor="middle">membrana: passam</text>
<text x="404.0" y="162.7" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933" text-anchor="middle">proteínas e células</text>
<text x="0.0" y="214.0" font-family="Inter" font-size="7.4" font-weight="400" fill="#6C6C70" text-anchor="start">Números do slide 4, em centímetros de água. Os selos marcam onde age cada mecanismo: 1 mais pressão no vaso, 2 menos proteína</text>
<text x="0.0" y="223.6" font-family="Inter" font-size="7.4" font-weight="400" fill="#6C6C70" text-anchor="start">no sangue, 3 linfa entupida, 4 pleura inflamada.</text>
