<text x="128.0" y="50.6" font-family="Inter" font-size="7.2" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="239.0" y="55.0" font-family="Inter" font-size="7.2" font-weight="600" fill="#16315C" text-anchor="middle">entra líquido</text>
<text x="74.0" y="116.0" font-family="Inter" font-size="15" font-weight="700" fill="#16315C" text-anchor="middle">29</text>
<text x="74.0" y="128.0" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933" text-anchor="middle">as proteínas puxam</text>
<text x="74.0" y="137.4" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933" text-anchor="middle">de volta</text>
