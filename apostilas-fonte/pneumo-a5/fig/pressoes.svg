<text x="128.0" y="112.6" font-family="Inter" font-size="7.2" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="239.0" y="117.0" font-family="Inter" font-size="7.2" font-weight="600" fill="#16315C" text-anchor="middle">volta para o vaso</text>
<rect x="12.0" y="152.0" width="124.0" height="30.0" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="74.0" y="164.0" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933" text-anchor="middle">vaso linfático</text>
<text x="74.0" y="173.4" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933" text-anchor="middle">leva o que sobra</text>
