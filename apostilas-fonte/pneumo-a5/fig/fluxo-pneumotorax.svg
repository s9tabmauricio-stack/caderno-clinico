<svg xmlns="http://www.w3.org/2000/svg" width="478" height="300" viewBox="0 0 478 300">
<rect x="129.0" y="1.0" width="220.0" height="26.0" rx="6" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1"/>
<text x="239.0" y="16.9" font-family="Inter" font-size="8.2" font-weight="600" fill="#16315C" text-anchor="middle">Pneumotórax confirmado na imagem</text>
<rect x="114.0" y="45.0" width="250.0" height="30.0" rx="6" fill="#F5F8FF" stroke="#8AA9DF" stroke-width="1" stroke-dasharray="3 2"/>
<text x="239.0" y="62.7" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">O paciente está instável (insuficiência respiratória)?</text>
<polygon points="238.2,27.0 238.2,38.5 233.8,38.5 239.0,45.0 244.2,38.5 239.8,38.5 239.8,27.0" fill="#8AA9DF"/>
<rect x="1.0" y="96.0" width="150.0" height="40.0" rx="6" fill="#16315C" stroke="#16315C" stroke-width="1"/>
<text x="76.0" y="113.8" font-family="Inter" font-size="7.6" font-weight="600" fill="#FFFFFF" text-anchor="middle">Sim: dreno sempre, qualquer</text>
<text x="76.0" y="123.5" font-family="Inter" font-size="7.6" font-weight="600" fill="#FFFFFF" text-anchor="middle">tamanho</text>
<rect x="322.0" y="96.0" width="156.0" height="40.0" rx="6" fill="#F5F8FF" stroke="#8AA9DF" stroke-width="1" stroke-dasharray="3 2"/>
<text x="400.0" y="118.7" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">Não: depende do tamanho</text>
