<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="478" height="189" viewBox="0 0 478 189"><rect x="0" y="0" width="149" height="121" rx="10" fill="white" stroke="#C3D8F8"/><circle cx="17" cy="19" r="10" fill="#E8F0FE"/><text x="17" y="22.2" font-family="Inter SemiBold" font-size="9" fill="#0B5BD3" text-anchor="middle">1</text><text x="33" y="22" font-family="Inter SemiBold" font-size="10" fill="#16315C" text-anchor="start">Sintomas urinários</text><text x="12" y="44.0" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">Ardor e urgência: pensar na</text><text x="12" y="57.5" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">bexiga. Procurar dor lombar,</text><text x="12" y="71.0" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">febre e sintomas gerais.</text><rect x="164" y="0" width="149" height="121" rx="10" fill="white" stroke="#C3D8F8"/><circle cx="181" cy="19" r="10" fill="#E8F0FE"/><text x="181" y="22.2" font-family="Inter SemiBold" font-size="9" fill="#0B5BD3" text-anchor="middle">2</text><text x="197" y="22" font-family="Inter SemiBold" font-size="10" fill="#16315C" text-anchor="start">Suspeita renal</text><text x="176" y="44.0" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">Investigar pielonefrite com</text><text x="176" y="57.5" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">avaliação clínica, cultura e</text><text x="176" y="71.0" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">exames apropriados.</text><rect x="329" y="0" width="149" height="121" rx="10" fill="white" stroke="#C3D8F8"/><circle cx="346" cy="19" r="10" fill="#E8F0FE"/><text x="346" y="22.2" font-family="Inter SemiBold" font-size="9" fill="#0B5BD3" text-anchor="middle">3</text><text x="362" y="22" font-family="Inter SemiBold" font-size="10" fill="#16315C" text-anchor="start">Definir o cuidado</text><text x="341" y="44.0" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">Critério absoluto ou gestante</text><text x="341" y="57.5" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">com pielonefrite: internação.</text><text x="341" y="71.0" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">Sem gravidade: avaliar</text><text x="341" y="84.5" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">ambulatório.</text><path d="M149,60 L159,60" stroke="#8AA9DF" stroke-width="1.4" fill="none"/><polygon points="158,57 158,63 164,60" fill="#8AA9DF"/><path d="M313,60 L324,60" stroke="#8AA9DF" stroke-width="1.4" fill="none"/><polygon points="323,57 323,63 329,60" fill="#8AA9DF"/><rect x="0" y="132" width="478" height="55" rx="9" fill="#F5F8FF" stroke="#C3D8F8"/><text x="12" y="150" font-family="Inter SemiBold" font-size="9" fill="#16315C" text-anchor="start">Se não há indicação absoluta</text><text x="12" y="167.0" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">Estabilidade, acesso ao medicamento e reavaliação possível sustentam a avaliação para tratamento</text><text x="12" y="180.5" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">ambulatorial.</text></svg>