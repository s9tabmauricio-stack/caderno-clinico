<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="478" height="122" viewBox="0 0 478 122"><rect x="0" y="0" width="149" height="120" rx="10" fill="white" stroke="#C3D8F8"/><circle cx="17" cy="19" r="10" fill="#E8F0FE"/><text x="17" y="22.2" font-family="Inter SemiBold" font-size="9" fill="#0B5BD3" text-anchor="middle">1</text><text x="33" y="22" font-family="Inter SemiBold" font-size="10" fill="#16315C" text-anchor="start">Identificar</text><text x="12" y="44.0" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">Sintomas e exames; colher</text><text x="12" y="57.5" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">cultura. Na abordagem da</text><text x="12" y="71.0" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">aula, não atrasar tratamento</text><text x="12" y="84.5" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">de infecção sintomática.</text><rect x="164" y="0" width="149" height="120" rx="10" fill="white" stroke="#C3D8F8"/><circle cx="181" cy="19" r="10" fill="#E8F0FE"/><text x="181" y="22.2" font-family="Inter SemiBold" font-size="9" fill="#0B5BD3" text-anchor="middle">2</text><text x="197" y="22" font-family="Inter SemiBold" font-size="10" fill="#16315C" text-anchor="start">Tratar e observar</text><text x="176" y="44.0" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">Escolher fármaco compatível</text><text x="176" y="57.5" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">com a gestação. Sem</text><text x="176" y="71.0" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">resposta em 2–3 dias:</text><text x="176" y="84.5" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">reavaliar.</text><rect x="329" y="0" width="149" height="120" rx="10" fill="white" stroke="#C3D8F8"/><circle cx="346" cy="19" r="10" fill="#E8F0FE"/><text x="346" y="22.2" font-family="Inter SemiBold" font-size="9" fill="#0B5BD3" text-anchor="middle">3</text><text x="362" y="22" font-family="Inter SemiBold" font-size="10" fill="#16315C" text-anchor="start">Confirmar resposta</text><text x="341" y="44.0" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">Controle de urocultura em</text><text x="341" y="57.5" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">uma semana, no esquema de</text><text x="341" y="71.0" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">acompanhamento da aula.</text><path d="M149,58 L159,58" stroke="#8AA9DF" stroke-width="1.4" fill="none"/><polygon points="158,55 158,61 164,58" fill="#8AA9DF"/><path d="M313,58 L324,58" stroke="#8AA9DF" stroke-width="1.4" fill="none"/><polygon points="323,55 323,61 329,58" fill="#8AA9DF"/></svg>