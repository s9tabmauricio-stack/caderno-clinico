<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="146pt" viewBox="0 0 478 146" role="img">
<title>Do preparo ao acompanhamento</title><desc>Marcar o Dia D entre sete e trinta dias, preparar mudanças de rotina e seguir acompanhando.</desc>
<line x1="79" y1="25" x2="399" y2="25" stroke="#8AA9DF" stroke-width="2" stroke-linecap="round"/>
<circle cx="79" cy="25" r="11" fill="#0B5BD3"/>
<text x="79" y="28.5" font-family="Inter SemiBold" font-size="9" fill="white" text-anchor="middle">1</text>
<text x="79" y="12" font-family="Inter SemiBold" font-size="9.5" fill="#16315C" text-anchor="middle">Preparação</text>
<circle cx="239" cy="25" r="11" fill="#0B5BD3"/>
<text x="239" y="28.5" font-family="Inter SemiBold" font-size="9" fill="white" text-anchor="middle">2</text>
<text x="239" y="12" font-family="Inter SemiBold" font-size="9.5" fill="#16315C" text-anchor="middle">Dia D</text>
<circle cx="399" cy="25" r="11" fill="#0B5BD3"/>
<text x="399" y="28.5" font-family="Inter SemiBold" font-size="9" fill="white" text-anchor="middle">3</text>
<text x="399" y="12" font-family="Inter SemiBold" font-size="9.5" fill="#16315C" text-anchor="middle">Seguimento</text>
<rect x="2" y="46" width="154" height="82" rx="10" fill="white" stroke="#C3D8F8" stroke-width="1"/>
<text x="14" y="66" font-family="Inter SemiBold" font-size="9.5" fill="#0B5BD3" text-anchor="start">7–30 dias antes</text>
<text x="14" y="85.0" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">Marcar a data; identificar</text>
<text x="14" y="98.5" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">gatilhos; combinar mudanças.</text>
<rect x="162" y="46" width="154" height="82" rx="10" fill="white" stroke="#C3D8F8" stroke-width="1"/>
<text x="174" y="66" font-family="Inter SemiBold" font-size="9.5" fill="#0B5BD3" text-anchor="start">Mudar a rotina</text>
<text x="174" y="85.0" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">Retirar o cigarro dos</text>
<text x="174" y="98.5" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">hábitos do dia a dia.</text>
<rect x="322" y="46" width="154" height="82" rx="10" fill="white" stroke="#C3D8F8" stroke-width="1"/>
<text x="334" y="66" font-family="Inter SemiBold" font-size="9.5" fill="#0B5BD3" text-anchor="start">Acompanhar</text>
<text x="334" y="85.0" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">Rever fissura e dificuldades;</text>
<text x="334" y="98.5" font-family="Inter" font-size="9" fill="#1F2933" text-anchor="start">reformular o plano se recair.</text>
<text x="239" y="143" font-family="Inter" font-size="8.5" fill="#5C6878" text-anchor="middle">Plano construído com a pessoa, conforme sua rotina e necessidades.</text>
</svg>
