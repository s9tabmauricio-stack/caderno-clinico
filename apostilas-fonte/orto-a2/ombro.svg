<svg xmlns="http://www.w3.org/2000/svg" width="478" height="243" viewBox="0 0 478 243"><rect x="99" y="2" width="280" height="45" rx="9" fill="white" stroke="#C3D8F8"/><text x="110" y="22.0" font-family="Inter" font-size="10" fill="#1F2933" font-weight="600">Avaliar a função do manguito rotador</text><path d="M239 47v15H116v14M239 62H362v14" fill="none" stroke="#8AA9DF" stroke-width="2"/><rect x="2" y="77" width="228" height="128" rx="9" fill="white" stroke="#C3D8F8"/><text x="14" y="98.0" font-family="Inter" font-size="10" fill="#1F2933" font-weight="600">Manguito funcional</text><text x="14" y="120.0" font-family="Inter" font-size="9" fill="#1F2933" font-weight="400">Biomecânica preservada</text><text x="14" y="144.0" font-family="Inter" font-size="9" fill="#1F2933" font-weight="400">Prótese anatômica</text><text x="14" y="168.0" font-family="Inter" font-size="9" fill="#1F2933" font-weight="400">Cabeça no úmero; cavidade na glenoide</text><rect x="248" y="77" width="228" height="128" rx="9" fill="white" stroke="#C3D8F8"/><text x="260" y="98.0" font-family="Inter" font-size="10" fill="#1F2933" font-weight="600">Manguito insuficiente</text><text x="260" y="120.0" font-family="Inter" font-size="9" fill="#1F2933" font-weight="400">Biomecânica comprometida</text><text x="260" y="144.0" font-family="Inter" font-size="9" fill="#1F2933" font-weight="400">Prótese reversa</text><text x="260" y="168.0" font-family="Inter" font-size="9" fill="#1F2933" font-weight="400">Esfera na glenoide; cavidade no úmero</text><text x="10" y="225.0" font-family="Inter" font-size="9" fill="#1F2933" font-weight="400">Na prótese reversa, o deltoide passa a ter papel central no movimento.</text></svg>