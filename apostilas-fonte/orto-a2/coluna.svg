<svg xmlns="http://www.w3.org/2000/svg" width="478" height="288" viewBox="0 0 478 288"><rect x="109" y="2" width="260" height="44" rx="9" fill="white" stroke="#C3D8F8"/><text x="120" y="20.0" font-family="Inter" font-size="10" fill="#1F2933" font-weight="600">Dor na coluna: história e exame neurológico</text><path d="M239 46v16H77v12M239 62v12M239 62H401v12" fill="none" stroke="#8AA9DF" stroke-width="2"/><rect x="2" y="77" width="152" height="68" rx="9" fill="white" stroke="#C3D8F8"/><text x="12" y="98.0" font-family="Inter" font-size="10" fill="#1F2933" font-weight="600">Alteração perineal ou</text><text x="12" y="113.0" font-family="Inter" font-size="10" fill="#1F2933" font-weight="600">esfincteriana</text><path d="M78 146v12" stroke="#8AA9DF" stroke-width="2"/><polygon points="74,156 82,156 78,162" fill="#8AA9DF"/><rect x="2" y="164" width="152" height="62" rx="9" fill="white" stroke="#C3D8F8"/><text x="12" y="186.0" font-family="Inter" font-size="9" fill="#1F2933" font-weight="400">Suspeitar de compressão da</text><text x="12" y="199.5" font-family="Inter" font-size="9" fill="#1F2933" font-weight="400">cauda equina.</text><path d="M78 227v12" stroke="#8AA9DF" stroke-width="2"/><polygon points="74,237 82,237 78,243" fill="#8AA9DF"/><rect x="2" y="245" width="152" height="40" rx="9" fill="white" stroke="#C3D8F8"/><text x="12" y="263.0" font-family="Inter" font-size="9" fill="#1F2933" font-weight="600">Atendimento urgente</text><rect x="162" y="77" width="152" height="68" rx="9" fill="white" stroke="#C3D8F8"/><text x="172" y="98.0" font-family="Inter" font-size="10" fill="#1F2933" font-weight="600">Déficit neurológico</text><text x="172" y="113.0" font-family="Inter" font-size="10" fill="#1F2933" font-weight="600">progressivo</text><path d="M238 146v12" stroke="#8AA9DF" stroke-width="2"/><polygon points="234,156 242,156 238,162" fill="#8AA9DF"/><rect x="162" y="164" width="152" height="62" rx="9" fill="white" stroke="#C3D8F8"/><text x="172" y="186.0" font-family="Inter" font-size="9" fill="#1F2933" font-weight="400">A função neurológica pode</text><text x="172" y="199.5" font-family="Inter" font-size="9" fill="#1F2933" font-weight="400">indicar cirurgia.</text><path d="M238 227v12" stroke="#8AA9DF" stroke-width="2"/><polygon points="234,237 242,237 238,243" fill="#8AA9DF"/><rect x="162" y="245" width="152" height="40" rx="9" fill="white" stroke="#C3D8F8"/><text x="172" y="263.0" font-family="Inter" font-size="9" fill="#1F2933" font-weight="600">Avaliação especializada</text><rect x="322" y="77" width="152" height="68" rx="9" fill="white" stroke="#C3D8F8"/><text x="332" y="98.0" font-family="Inter" font-size="10" fill="#1F2933" font-weight="600">Dor refratária,</text><text x="332" y="113.0" font-family="Inter" font-size="10" fill="#1F2933" font-weight="600">instabilidade ou estenose</text><path d="M398 146v12" stroke="#8AA9DF" stroke-width="2"/><polygon points="394,156 402,156 398,162" fill="#8AA9DF"/><rect x="322" y="164" width="152" height="62" rx="9" fill="white" stroke="#C3D8F8"/><text x="332" y="186.0" font-family="Inter" font-size="9" fill="#1F2933" font-weight="400">Avaliar a indicação e a</text><text x="332" y="199.5" font-family="Inter" font-size="9" fill="#1F2933" font-weight="400">estratégia cirúrgica.</text><path d="M398 227v12" stroke="#8AA9DF" stroke-width="2"/><polygon points="394,237 402,237 398,243" fill="#8AA9DF"/><rect x="322" y="245" width="152" height="40" rx="9" fill="white" stroke="#C3D8F8"/><text x="332" y="263.0" font-family="Inter" font-size="9" fill="#1F2933" font-weight="600">Conduta individualizada</text></svg>