<svg xmlns="http://www.w3.org/2000/svg" width="478" height="87" viewBox="0 0 478 87"><rect x="2" y="2" width="112" height="82" rx="9" fill="white" stroke="#C3D8F8"/><text x="9" y="19.0" font-family="Inter" font-size="8" fill="#1F2933" font-weight="600">1. Amolecimento</text><text x="9" y="39.0" font-family="Inter" font-size="8.5" fill="#1F2933" font-weight="400">A cartilagem perde sua</text><text x="9" y="51.75" font-family="Inter" font-size="8.5" fill="#1F2933" font-weight="400">consistência.</text><polygon points="116,38 120,42 116,46" fill="#8AA9DF"/><rect x="122" y="2" width="112" height="82" rx="9" fill="white" stroke="#C3D8F8"/><text x="129" y="19.0" font-family="Inter" font-size="8" fill="#1F2933" font-weight="600">2. Fibrilação</text><text x="129" y="39.0" font-family="Inter" font-size="8.5" fill="#1F2933" font-weight="400">A superfície se</text><text x="129" y="51.75" font-family="Inter" font-size="8.5" fill="#1F2933" font-weight="400">desorganiza em fibras.</text><polygon points="236,38 240,42 236,46" fill="#8AA9DF"/><rect x="242" y="2" width="112" height="82" rx="9" fill="white" stroke="#C3D8F8"/><text x="249" y="19.0" font-family="Inter" font-size="8" fill="#1F2933" font-weight="600">3. Destacamento</text><text x="249" y="39.0" font-family="Inter" font-size="8.5" fill="#1F2933" font-weight="400">Partes se separam do</text><text x="249" y="51.75" font-family="Inter" font-size="8.5" fill="#1F2933" font-weight="400">osso subcondral.</text><polygon points="356,38 360,42 356,46" fill="#8AA9DF"/><rect x="362" y="2" width="112" height="82" rx="9" fill="white" stroke="#C3D8F8"/><text x="369" y="19.0" font-family="Inter" font-size="8" fill="#1F2933" font-weight="600">4. Erosão</text><text x="369" y="39.0" font-family="Inter" font-size="8.5" fill="#1F2933" font-weight="400">A perda de cartilagem</text><text x="369" y="51.75" font-family="Inter" font-size="8.5" fill="#1F2933" font-weight="400">expõe o osso.</text></svg>