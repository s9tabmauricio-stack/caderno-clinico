<svg xmlns="http://www.w3.org/2000/svg" width="478" height="158" viewBox="0 0 478 158"><text x="1" y="15" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#16315C">O mesmo benefício, visto de duas formas</text><text x="1" y="49" font-family="Inter, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1F2933">Placebo</text><rect x="96" y="35" width="290" height="20" rx="4" fill="#EDF1F6" stroke="#EDF1F6"/><rect x="96" y="35" width="58.0" height="20" rx="4" fill="#0B5BD3" stroke="#0B5BD3"/><text x="477" y="49" font-family="Inter, sans-serif" font-size="10" font-weight="400" text-anchor="end" fill="#16315C">20 em 100</text><text x="1" y="92" font-family="Inter, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1F2933">Medicação</text><rect x="96" y="78" width="290" height="20" rx="4" fill="#EDF1F6" stroke="#EDF1F6"/><rect x="96" y="78" width="29.0" height="20" rx="4" fill="#0B5BD3" stroke="#0B5BD3"/><text x="477" y="92" font-family="Inter, sans-serif" font-size="10" font-weight="400" text-anchor="end" fill="#16315C">10 em 100</text><text x="96" y="128" font-family="Inter, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#16315C">10 eventos a menos por 100 pessoas: 10 pontos percentuais</text><text x="96" y="147" font-family="Inter, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#16315C">10 a menos entre os 20 eventos do controle: redução de 50%</text></svg>