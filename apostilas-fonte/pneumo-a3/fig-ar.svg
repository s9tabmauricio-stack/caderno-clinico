<svg xmlns="http://www.w3.org/2000/svg" width="478" height="150" viewBox="0 0 478 150" font-family="Inter"><text x="0" y="12" font-family="Inter" font-size="10.5" font-weight="700" fill="#16315C" text-anchor="start">O ar que fica para trás, ciclo a ciclo</text><text x="0" y="25" font-family="Inter" font-size="8.3" font-weight="400" fill="#6C6C70" text-anchor="start">Inspiração ativa (1 tempo) e expiração passiva (2 tempos), com o desenho exagerado para mostrar a sobra.</text><rect x="0" y="34" width="235.0" height="116" rx="9" fill="#F5F8FF" stroke="#DCE6F8" stroke-width="1"/><text x="11" y="50" font-family="Inter" font-size="9.4" font-weight="700" fill="#1F2933" text-anchor="start">Pulmão normal</text><text x="11" y="63.0" font-family="Inter" font-size="8.2" font-weight="400" fill="#3A3A3C" text-anchor="start">Inspira 500 mL e solta 500 mL: sempre volta ao</text><text x="11" y="73.5" font-family="Inter" font-size="8.2" font-weight="400" fill="#3A3A3C" text-anchor="start">mesmo ponto.</text><line x1="12" y1="136" x2="223.0" y2="136" stroke="#A9C4EE" stroke-width="0.8" stroke-dasharray="2 3"/><polyline points="12.0,136.0 26.1,86.0 54.2,136.0 68.3,86.0 96.4,136.0 110.5,86.0 138.6,136.0 152.7,86.0 180.8,136.0 194.9,86.0 223.0,136.0" fill="none" stroke="#0B5BD3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><rect x="243.0" y="34" width="235.0" height="116" rx="9" fill="#F5F8FF" stroke="#DCE6F8" stroke-width="1"/><text x="254.0" y="50" font-family="Inter" font-size="9.4" font-weight="700" fill="#1F2933" text-anchor="start">Pulmão obstruído</text><text x="254.0" y="63.0" font-family="Inter" font-size="8.2" font-weight="400" fill="#3A3A3C" text-anchor="start">Inspira 499 mL e solta só 498 mL: a cada ciclo sobra</text><text x="254.0" y="73.5" font-family="Inter" font-size="8.2" font-weight="400" fill="#3A3A3C" text-anchor="start">um pouco.</text><line x1="255.0" y1="136" x2="466.0" y2="136" stroke="#A9C4EE" stroke-width="0.8" stroke-dasharray="2 3"/><polygon points="255.0,136 255.0,136.0 297.2,131.4 339.4,126.8 381.6,122.2 423.8,117.6 466.0,113.0 466.0,136" fill="#CFE0FB"/><text x="464.0" y="147" font-family="Inter" font-size="8" font-weight="700" fill="#16315C" text-anchor="end">ar aprisionado: o volume residual sobe</text><polyline points="255.0,136.0 269.1,90.0 297.2,131.4 311.3,85.4 339.4,126.8 353.5,80.8 381.6,122.2 395.7,76.2 423.8,117.6 437.9,71.6 466.0,113.0" fill="none" stroke="#0B5BD3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>