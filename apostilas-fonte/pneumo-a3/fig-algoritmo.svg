<svg xmlns="http://www.w3.org/2000/svg" width="478" height="268" viewBox="0 0 478 268" font-family="Inter"><rect x="0" y="0" width="478" height="30" rx="9" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><text x="239.0" y="14" font-family="Inter SemiBold" font-size="9.2" font-weight="600" fill="#16315C" text-anchor="middle">1. O paciente teve exacerbação?</text><rect x="155.8" y="30" width="1.4" height="13" fill="#8AA9DF"/><polygon points="152.9,42 160.1,42 156.5,48" fill="#8AA9DF"/><text x="164.5" y="46" font-family="Inter" font-size="8.2" font-weight="700" fill="#1F2933" text-anchor="start">Não</text><rect x="403.3" y="30" width="1.4" height="13" fill="#8AA9DF"/><polygon points="400.4,42 407.6,42 404.0,48" fill="#8AA9DF"/><text x="412.0" y="46" font-family="Inter" font-size="8.2" font-weight="700" fill="#1F2933" text-anchor="start">Sim</text><rect x="0" y="48" width="313" height="43.5" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="156.5" y="62" font-family="Inter SemiBold" font-size="9.2" font-weight="600" fill="#16315C" text-anchor="middle">2. Quanto sintoma ele tem?</text><text x="156.5" y="83.5" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="middle">Escala de dispneia mMRC (0 a 4) ou questionário CAT (0 a 40)</text><rect x="330" y="48" width="148" height="43.5" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="404.0" y="62" font-family="Inter SemiBold" font-size="9.2" font-weight="600" fill="#16315C" text-anchor="middle">Grupo E</text><text x="404.0" y="83.5" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="middle">Exacerbador: já é E, ponto final</text><rect x="73.3" y="91.5" width="1.4" height="21.0" fill="#8AA9DF"/><polygon points="70.4,111.5 77.6,111.5 74.0,117.5" fill="#8AA9DF"/><text x="82.0" y="109.5" font-family="Inter" font-size="8.2" font-weight="700" fill="#1F2933" text-anchor="start">mMRC 0 ou 1</text><rect x="238.3" y="91.5" width="1.4" height="21.0" fill="#8AA9DF"/><polygon points="235.4,111.5 242.6,111.5 239.0,117.5" fill="#8AA9DF"/><text x="247.0" y="109.5" font-family="Inter" font-size="8.2" font-weight="700" fill="#1F2933" text-anchor="start">mMRC 2 ou mais</text><rect x="403.3" y="91.5" width="1.4" height="21.0" fill="#8AA9DF"/><polygon points="400.4,111.5 407.6,111.5 404.0,117.5" fill="#8AA9DF"/><rect x="0" y="117.5" width="148" height="54.0" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="74.0" y="131.5" font-family="Inter SemiBold" font-size="9.2" font-weight="600" fill="#16315C" text-anchor="middle">Grupo A</text><text x="74.0" y="153.0" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="middle">Pouco sintoma, sem exacerbação</text><rect x="165" y="117.5" width="148" height="54.0" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="239.0" y="131.5" font-family="Inter SemiBold" font-size="9.2" font-weight="600" fill="#16315C" text-anchor="middle">Grupo B</text><text x="239.0" y="153.0" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="middle">Mais dispneia, sem exacerbação</text><rect x="330" y="117.5" width="148" height="54.0" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="404.0" y="131.5" font-family="Inter SemiBold" font-size="9.2" font-weight="600" fill="#16315C" text-anchor="middle">Contar eosinófilos</text><text x="404.0" y="153.0" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="middle">No sangue, para decidir o</text><text x="404.0" y="163.5" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="middle">corticoide inalatório</text><rect x="73.3" y="171.5" width="1.4" height="13.0" fill="#8AA9DF"/><polygon points="70.4,183.5 77.6,183.5 74.0,189.5" fill="#8AA9DF"/><rect x="238.3" y="171.5" width="1.4" height="13.0" fill="#8AA9DF"/><polygon points="235.4,183.5 242.6,183.5 239.0,189.5" fill="#8AA9DF"/><rect x="403.3" y="171.5" width="1.4" height="13.0" fill="#8AA9DF"/><polygon points="400.4,183.5 407.6,183.5 404.0,189.5" fill="#8AA9DF"/><rect x="0" y="189.5" width="148" height="76.5" rx="9" fill="#E7F7EC" stroke="#BFE5CB" stroke-width="1"/><text x="74.0" y="203.5" font-family="Inter SemiBold" font-size="9.2" font-weight="600" fill="#1E7A34" text-anchor="middle">Um broncodilatador</text><rect x="165" y="189.5" width="148" height="76.5" rx="9" fill="#E7F7EC" stroke="#BFE5CB" stroke-width="1"/><text x="239.0" y="203.5" font-family="Inter SemiBold" font-size="9.2" font-weight="600" fill="#1E7A34" text-anchor="middle">Dois broncodilatadores de</text><text x="239.0" y="215.5" font-family="Inter SemiBold" font-size="9.2" font-weight="600" fill="#1E7A34" text-anchor="middle">longa ação</text><text x="239.0" y="237.0" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="middle">Beta-2 agonista +</text><text x="239.0" y="247.5" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="middle">antimuscarínico, juntos</text><rect x="330" y="189.5" width="148" height="76.5" rx="9" fill="#E7F7EC" stroke="#BFE5CB" stroke-width="1"/><text x="404.0" y="203.5" font-family="Inter SemiBold" font-size="9.2" font-weight="600" fill="#1E7A34" text-anchor="middle">Os mesmos dois de longa</text><text x="404.0" y="215.5" font-family="Inter SemiBold" font-size="9.2" font-weight="600" fill="#1E7A34" text-anchor="middle">ação</text><text x="404.0" y="237.0" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="middle">Com eosinófilos ≥ 300: considerar</text><text x="404.0" y="247.5" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="middle">somar o corticoide inalatório</text><text x="404.0" y="258.0" font-family="Inter" font-size="8" font-weight="400" fill="#1F2933" text-anchor="middle">(terapia tripla)</text></svg>