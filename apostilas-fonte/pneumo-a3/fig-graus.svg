<svg xmlns="http://www.w3.org/2000/svg" width="478" height="236" viewBox="0 0 478 236" font-family="Inter"><rect x="0" y="0" width="478" height="40" rx="9" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><text x="239.0" y="16" font-family="Inter" font-size="8.6" font-weight="700" fill="#1F2933" text-anchor="middle">Condição para os quatro graus: índice de Tiffeneau abaixo de 0,70 depois do broncodilatador</text><text x="239.0" y="30" font-family="Inter" font-size="8.2" font-weight="400" fill="#3A3A3C" text-anchor="middle">O grau vem do volume expiratório forçado no primeiro segundo, em % do valor previsto</text><rect x="0.0" y="84" width="100" height="112" rx="5" fill="#C3D8F8"/><text x="50.0" y="77" font-family="Inter" font-size="12" font-weight="700" fill="#16315C" text-anchor="middle">≥ 80%</text><text x="50.0" y="209" font-family="Inter" font-size="9" font-weight="700" fill="#1F2933" text-anchor="middle">Leve</text><text x="50.0" y="221" font-family="Inter" font-size="8" font-weight="400" fill="#6C6C70" text-anchor="middle">Grau 1 (GOLD 1)</text><rect x="126.0" y="108" width="100" height="88" rx="5" fill="#A6C1EE"/><text x="176.0" y="101" font-family="Inter" font-size="12" font-weight="700" fill="#16315C" text-anchor="middle">50 a 79%</text><text x="176.0" y="209" font-family="Inter" font-size="9" font-weight="700" fill="#1F2933" text-anchor="middle">Moderada</text><text x="176.0" y="221" font-family="Inter" font-size="8" font-weight="400" fill="#6C6C70" text-anchor="middle">Grau 2 (GOLD 2)</text><rect x="252.0" y="132" width="100" height="64" rx="5" fill="#86A8E3"/><text x="302.0" y="125" font-family="Inter" font-size="12" font-weight="700" fill="#16315C" text-anchor="middle">30 a 49%</text><text x="302.0" y="209" font-family="Inter" font-size="9" font-weight="700" fill="#1F2933" text-anchor="middle">Grave</text><text x="302.0" y="221" font-family="Inter" font-size="8" font-weight="400" fill="#6C6C70" text-anchor="middle">Grau 3 (GOLD 3)</text><rect x="378.0"