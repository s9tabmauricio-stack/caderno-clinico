<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="182pt" viewBox="0 0 478 182"><rect x="0.0" y="1" width="151.3" height="93.0" rx="10" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="9.0" y="16.0" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="start">Reumáticas</text><text x="9.0" y="29.2" font-family="Inter SemiBold" font-size="6.6" fill="#0B5BD3" text-anchor="start">AUTOIMUNES</text><text x="9.0" y="44.2" font-family="Inter" font-size="8.2" fill="#1F2933" text-anchor="start">Artrite reumatoide, lúpus e</text><text x="9.0" y="54.9" font-family="Inter" font-size="8.2" fill="#1F2933" text-anchor="start">espondilite anquilosante. O corpo</text><text x="9.0" y="65.5" font-family="Inter" font-size="8.2" fill="#1F2933" text-anchor="start">ataca a membrana sinovial da</text><text x="9.0" y="76.2" font-family="Inter" font-size="8.2" fill="#1F2933" text-anchor="start">articulação e do tendão.</text><line x1="75.66666666666667" y1="95.0" x2="75.66666666666667" y2="108.0" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="71.66666666666667,107.0 79.66666666666667,107.0 75.66666666666667,113.0" fill="#8AA9DF"/><rect x="163.3" y="1" width="151.3" height="93.0" rx="10" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="172.3" y="16.0" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="start">Metabólicas</text><text x="172.3" y="29.2" font-family="Inter SemiBold" font-size="6.6" fill="#0B5BD3" text-anchor="start">MICROCIRCULAÇÃO</text><text x="172.3" y="44.2" font-family="Inter" font-size="8.2" fill="#1F2933" text-anchor="start">Diabetes e tabaco estragam os</text><text x="172.3" y="54.9" font-family="Inter" font-size="8.2" fill="#1F2933" text-anchor="start">vasos da ponta da circulação, que</text><text x="172.3" y="65.5" font-family="Inter" font-size="8.2" fill="#1F2933" text-anchor="start">são os únicos que o tendão tem.</text><line x1="239.0" y1="95.0" x2="239.0" y2="108.0" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="235.0,107.0 243.0,107.0 239.0,113.0" fill="#8AA9DF"/><rect x="326.7" y="1" width="151.3" height="93.0" rx="10" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="335.7" y="16.0" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="start">Traumáticas e degenerativas</text><text x="335.7" y="29.2" font-family="Inter SemiBold" font-size="6.6" fill="#0B5BD3" text-anchor="start">AS MAIS FREQUENTES</text><text x="335.7" y="44.2" font-family="Inter" font-size="8.2" fill="#1F2933" text-anchor="start">Sobrecarga e uso excessivo:</text><text x="335.7" y="54.9" font-family="Inter" font-size="8.2" fill="#1F2933" text-anchor="start">esporte, trabalho, salto alto e</text><text x="335.7" y="65.5" font-family="Inter" font-size="8.2" fill="#1F2933" text-anchor="start">também a falta de músculo.</text><line x1="402.33333333333337" y1="95.0" x2="402.33333333333337" y2="108.0" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="398.33333333333337,107.0 406.33333333333337,107.0 402.33333333333337,113.0" fill="#8AA9DF"/><rect x="0" y="114.0" width="478" height="34" rx="10" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><text x="239.0" y="128.0" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="middle">Tendão, êntese, bursa ou bainha adoecem</text><text x="239.0" y="140.0" font-family="Inter" font-size="8.2" fill="#1F2933" text-anchor="middle">dor, inflamação, calcificação ou ruptura</text><rect x="60" y="158.0" width="358" height="22" rx="10" fill="#FFFFFF" stroke="#8AA9DF" stroke-width="1" stroke-dasharray="4 3"/><text x="239.0" y="172.5" font-family="Inter Medium" font-size="8.2" fill="#16315C" text-anchor="middle">Nenhuma causa achada? Idiopático: o que ainda não se explicou</text></svg>