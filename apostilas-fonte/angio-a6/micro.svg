<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="216pt" viewBox="0 0 478 216"><rect x="20" y="22" width="438" height="26" rx="13" fill="#E8F0FE" stroke="#C3D8F8"/><polyline points="150.0,35.0 325.0,35.0" fill="none" stroke="#0B5BD3" stroke-width="1.6"/><polygon points="330.0,35.0 324.0,38.3 324.0,31.7" fill="#0B5BD3"/><text x="240.0" y="31.0" font-family="Inter" font-weight="500" font-size="7.2" fill="#0B5BD3" text-anchor="middle">sangue</text><text x="20.0" y="14.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Lado arterial do capilar</text><text x="458.0" y="14.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="end">Lado venoso do capilar</text><rect x="20.0" y="66.0" width="438.0" height="74.0" rx="10" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><text x="239.0" y="80.0" font-family="Inter" font-weight="600" font-size="8.2" fill="#16315C" text-anchor="middle">Espaço intersticial (entre as células)</text><circle cx="140" cy="105" r="10" fill="#FFFFFF" stroke="#C3D8F8"/><circle cx="180" cy="105" r="10" fill="#FFFFFF" stroke="#C3D8F8"/><circle cx="220" cy="105" r="10" fill="#FFFFFF" stroke="#C3D8F8"/><circle cx="260" cy="105" r="10" fill="#FFFFFF" stroke="#C3D8F8"/><circle cx="300" cy="105" r="10" fill="#FFFFFF" stroke="#C3D8F8"/><circle cx="340" cy="105" r="10" fill="#FFFFFF" stroke="#C3D8F8"/><polyline points="44.0,50.0 44.0,87.5" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="44.0,92.0 41.0,86.5 47.0,86.5" fill="#8AA9DF"/><polyline points="66.0,50.0 66.0,87.5" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="66.0,92.0 63.0,86.5 69.0,86.5" fill="#8AA9DF"/><polyline points="412.0,92.0 412.0,54.5" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="412.0,50.0 415.0,55.5 409.0,55.5" fill="#8AA9DF"/><polyline points="434.0,92.0 434.0,54.5" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="434.0,50.0 437.0,55.5 431.0,55.5" fill="#8AA9DF"/><text x="78.0" y="98.0" font-family="Inter" font-weight="600" font-size="8.2" fill="#0B5BD3" text-anchor="start">filtra</text><text x="400.0" y="98.0" font-family="Inter" font-weight="600" font-size="8.2" fill="#0B5BD3" text-anchor="end">reabsorve</text><text x="239.0" y="128.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="middle">As células ficam coesas, com o líquido no lugar certo</text><rect x="120" y="170" width="338" height="22" rx="11" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1.2"/><polyline points="250.0,181.0 395.0,181.0" fill="none" stroke="#0B5BD3" stroke-width="1.6"/><polygon points="400.0,181.0 394.0,184.3 394.0,177.7" fill="#0B5BD3"/><text x="325.0" y="177.5" font-family="Inter" font-weight="500" font-size="7.2" fill="#0B5BD3" text-anchor="middle">linfa</text><polyline points="180.0,142.0 180.0,163.5" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="180.0,168.0 177.0,162.5 183.0,162.5" fill="#8AA9DF"/><polyline points="239.0,142.0 239.0,163.5" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="239.0,168.0 236.0,162.5 242.0,162.5" fill="#8AA9DF"/><polyline points="298.0,142.0 298.0,163.5" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="298.0,168.0 295.0,162.5 301.0,162.5" fill="#8AA9DF"/><text x="20.0" y="166.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Linfático</text><text x="20.0" y="178.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="start">recolhe o excesso,</text><text x="20.0" y="187.4" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="start">sempre um pouco a mais</text><text x="239.0" y="210.0" font-family="Inter" font-weight="500" font-size="7.6" fill="#1F2933" text-anchor="middle">Recolher um pouco a mais do que sobrou cria pressão negativa: o tecido fica firme, como um pacote a vácuo.</text></svg>