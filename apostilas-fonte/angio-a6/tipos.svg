<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="261.4pt" viewBox="0 0 478 261.4"><rect x="164.0" y="2.0" width="150.0" height="26.0" rx="9" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1"/><text x="239.0" y="18.5" font-family="Inter" font-weight="600" font-size="9.4" fill="#16315C" text-anchor="middle">Linfedema</text><rect x="0.5" y="50.0" width="148.0" height="34.0" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="74.5" y="64.0" font-family="Inter" font-weight="600" font-size="8.8" fill="#16315C" text-anchor="middle">Primário</text><text x="74.5" y="76.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="middle">defeito do próprio sistema</text><rect x="165.0" y="50.0" width="313.0" height="34.0" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="321.5" y="64.0" font-family="Inter" font-weight="600" font-size="8.8" fill="#16315C" text-anchor="middle">Secundário</text><text x="321.5" y="76.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="middle">algo danificou um sistema que funcionava</text><polyline points="239.0,29.0 239.0,39.0 74.5,39.0 74.5,45.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="74.5,49.0 71.8,44.0 77.2,44.0" fill="#8AA9DF"/><polyline points="239.0,39.0 321.5,39.0 321.5,45.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="321.5,49.0 318.8,44.0 324.2,44.0" fill="#8AA9DF"/><text x="239.0" y="108.0" font-family="Inter" font-weight="600" font-size="8.2" fill="#0B5BD3" text-anchor="middle">Inflamatório</text><text x="404.0" y="108.0" font-family="Inter" font-weight="600" font-size="8.2" fill="#0B5BD3" text-anchor="middle">Não inflamatório</text><text x="74.5" y="108.0" font-family="Inter" font-weight="600" font-size="8.2" fill="#0B5BD3" text-anchor="middle">Pela idade de início</text><polyline points="74.5,85.0 74.5,94.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="74.5,98.0 71.8,93.0 77.2,93.0" fill="#8AA9DF"/><polyline points="239.0,85.0 239.0,94.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="239.0,98.0 236.2,93.0 241.8,93.0" fill="#8AA9DF"/><polyline points="404.0,85.0 404.0,94.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="404.0,98.0 401.2,93.0 406.8,93.0" fill="#8AA9DF"/><rect x="0.5" y="116.0" width="148.0" height="52.2" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="8.5" y="130.0" font-family="Inter" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Congênito</text><text x="8.5" y="142.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">já nasce com ele (síndrome de</text><text x="8.5" y="151.4" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">Turner, síndrome de</text><text x="8.5" y="160.8" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">Klippel-Trénaunay)</text><rect x="0.5" y="175.2" width="148.0" height="33.4" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="8.5" y="189.2" font-family="Inter" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Precoce</text><text x="8.5" y="201.2" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">começa antes dos 35 anos</text><rect x="0.5" y="215.6" width="148.0" height="42.8" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="8.5" y="229.6" font-family="Inter" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Tardio</text><text x="8.5" y="241.6" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">começa depois dos 35 anos; o mais</text><text x="8.5" y="251.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">visto</text><rect x="165.0" y="116.0" width="148.0" height="63.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="173.0" y="130.0" font-family="Inter" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Filariose</text><text x="173.0" y="142.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">Wuchereria bancrofti; elefantíase</text><rect x="165.0" y="186.0" width="148.0" height="72.4" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="173.0" y="200.0" font-family="Inter" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Pós-infeccioso</text><text x="173.0" y="212.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">erisipela de repetição, com porta de</text><text x="173.0" y="221.4" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">entrada nos pés</text><rect x="330.0" y="116.0" width="148.0" height="45.9" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="338.0" y="130.0" font-family="Inter" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Tumoral</text><text x="338.0" y="142.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">pouco frequente; em geral, doença</text><text x="338.0" y="151.4" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">avançada</text><rect x="330.0" y="168.9" width="148.0" height="45.9" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="338.0" y="182.9" font-family="Inter" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Pós-cirúrgico</text><text x="338.0" y="194.9" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">mastectomia com retirada dos</text><text x="338.0" y="204.3" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">linfonodos axilares; radioterapia</text><rect x="330.0" y="221.9" width="148.0" height="36.5" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="338.0" y="235.9" font-family="Inter" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Trauma</text><text x="338.0" y="247.9" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">acidentes</text></svg>