<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="170pt" viewBox="0 0 478 170"><rect x="0.5" y="4.0" width="107.0" height="64.0" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="15.0" cy="19.0" r="7.5" fill="#0B5BD3"/><text x="15.0" y="21.9" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">1</text><text x="28.0" y="22.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">A linfa</text><text x="9.0" y="41.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="start">filtra, reabsorve e o</text><text x="9.0" y="50.6" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="start">linfático tira o excesso</text><polyline points="109.5,36.0 117.0,36.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="121.5,36.0 116.0,39.0 116.0,33.0" fill="#8AA9DF"/><rect x="123.5" y="4.0" width="107.0" height="64.0" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="138.0" cy="19.0" r="7.5" fill="#0B5BD3"/><text x="138.0" y="21.9" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">2</text><text x="151.0" y="22.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">A drenagem falha</text><text x="132.0" y="41.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="start">proteína parada,</text><text x="132.0" y="50.6" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="start">inflamação e erisipela</text><polyline points="232.5,36.0 240.0,36.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="244.5,36.0 239.0,39.0 239.0,33.0" fill="#8AA9DF"/><rect x="246.5" y="4.0" width="107.0" height="64.0" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="261.0" cy="19.0" r="7.5" fill="#0B5BD3"/><text x="261.0" y="21.9" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">3</text><text x="274.0" y="22.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Os tipos</text><text x="255.0" y="41.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="start">primário pela idade;</text><text x="255.0" y="50.6" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="start">secundário pela causa</text><polyline points="355.5,36.0 363.0,36.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="367.5,36.0 362.0,39.0 362.0,33.0" fill="#8AA9DF"/><rect x="369.5" y="4.0" width="107.0" height="64.0" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="384.0" cy="19.0" r="7.5" fill="#0B5BD3"/><text x="384.0" y="21.9" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">4</text><text x="397.0" y="22.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">O quadro clínico</text><text x="378.0" y="41.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="start">frio, duro, cilíndrico,</text><text x="378.0" y="50.6" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="start">quase sem dor</text><rect x="0.5" y="102.0" width="107.0" height="64.0" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1" stroke-dasharray="4 3"/><circle cx="15.0" cy="117.0" r="7.5" fill="#0B5BD3"/><text x="15.0" y="119.9" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">5</text><text x="28.0" y="120.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Lipedema</text><text x="9.0" y="139.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="start">o ramo do lado: doença</text><text x="9.0" y="148.6" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="start">da gordura</text><polyline points="109.5,134.0 117.0,134.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="121.5,134.0 116.0,137.0 116.0,131.0" fill="#8AA9DF"/><rect x="123.5" y="102.0" width="107.0" height="64.0" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="138.0" cy="117.0" r="7.5" fill="#0B5BD3"/><text x="138.0" y="119.9" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">6</text><text x="151.0" y="120.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Diagnóstico</text><text x="132.0" y="139.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="start">história e</text><text x="132.0" y="148.6" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="start">linfocintilografia</text><polyline points="232.5,134.0 240.0,134.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="244.5,134.0 239.0,137.0 239.0,131.0" fill="#8AA9DF"/><rect x="246.5" y="102.0" width="107.0" height="64.0" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="261.0" cy="117.0" r="7.5" fill="#0B5BD3"/><text x="261.0" y="119.9" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">7</text><text x="274.0" y="120.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Tratamento</text><text x="274.0" y="131.2" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">clínico</text><text x="255.0" y="149.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="start">quatro medidas somadas</text><polyline points="355.5,134.0 363.0,134.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="367.5,134.0 362.0,137.0 362.0,131.0" fill="#8AA9DF"/><rect x="369.5" y="102.0" width="107.0" height="64.0" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="384.0" cy="117.0" r="7.5" fill="#0B5BD3"/><text x="384.0" y="119.9" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">8</text><text x="397.0" y="120.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Cirurgia</text><text x="378.0" y="139.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="start">pouca derivação, alguma</text><text x="378.0" y="148.6" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="start">redução; neoplasias</text><polyline points="423.0,69.0 423.0,85.0 54.0,85.0 54.0,96.5" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="54.0,101.0 51.0,95.5 57.0,95.5" fill="#8AA9DF"/></svg>