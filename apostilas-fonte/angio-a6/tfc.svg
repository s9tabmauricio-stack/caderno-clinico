<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="122pt" viewBox="0 0 478 122"><text x="100.0" y="8.0" font-family="Inter" font-weight="600" font-size="7.4" fill="#6C6C70" text-anchor="start">pé (periferia)</text><text x="472.0" y="8.0" font-family="Inter" font-weight="600" font-size="7.4" fill="#6C6C70" text-anchor="end">virilha (centro)</text><text x="0.0" y="34.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Drenagem estética</text><text x="0.0" y="45.0" font-family="Inter" font-weight="400" font-size="7.2" fill="#6C6C70" text-anchor="start">massagem que empurra</text><text x="0.0" y="54.0" font-family="Inter" font-weight="400" font-size="7.2" fill="#6C6C70" text-anchor="start">o líquido de baixo para</text><text x="0.0" y="63.0" font-family="Inter" font-weight="400" font-size="7.2" fill="#6C6C70" text-anchor="start">cima</text><rect x="96" y="24" width="380" height="24" rx="12" fill="#F5F8FF" stroke="#C3D8F8"/><rect x="380" y="21" width="30" height="30" rx="3" fill="#DCDCE2" stroke="#8E8E93" stroke-width="1"/><text x="395.0" y="39.0" font-family="Inter" font-weight="600" font-size="6.6" fill="#4F5B70" text-anchor="middle">fechado</text><polyline points="110.0,36.0 372.0,36.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="377.0,36.0 371.0,39.3 371.0,32.7" fill="#8AA9DF"/><text x="106.0" y="61.0" font-family="Inter" font-weight="500" font-size="7.4" fill="#1F2933" text-anchor="start">Empurra a partir do pé e o líquido para no bloqueio: não passa.</text><text x="0.0" y="84.5" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Terapia física</text><text x="0.0" y="95.5" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">complexa</text><text x="0.0" y="106.5" font-family="Inter" font-weight="400" font-size="7.2" fill="#6C6C70" text-anchor="start">abre o centro primeiro,</text><text x="0.0" y="115.5" font-family="Inter" font-weight="400" font-size="7.2" fill="#6C6C70" text-anchor="start">depois traz a periferia</text><rect x="96" y="80" width="380" height="24" rx="12" fill="#F5F8FF" stroke="#C3D8F8"/><rect x="380" y="77" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1.2" stroke-dasharray="3 2"/><circle cx="395.0" cy="92.0" r="7" fill="#0B5BD3"/><text x="395.0" y="94.9" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">1</text><polyline points="413.0,92.0 459.0,92.0" fill="none" stroke="#0B5BD3" stroke-width="1.6"/><polygon points="464.0,92.0 458.0,95.3 458.0,88.7" fill="#0B5BD3"/><polyline points="110.0,92.0 371.0,92.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="376.0,92.0 370.0,95.3 370.0,88.7" fill="#8AA9DF"/><circle cx="238.0" cy="92.0" r="7" fill="#0B5BD3"/><text x="238.0" y="94.9" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">2</text><text x="106.0" y="117.0" font-family="Inter" font-weight="500" font-size="7.4" fill="#1F2933" text-anchor="start">2  depois, traz o líquido do pé</text><text x="472.0" y="117.0" font-family="Inter" font-weight="500" font-size="7.4" fill="#1F2933" text-anchor="end">1  primeiro, abre o pedágio: linfonodos e coletores do centro</text></svg>