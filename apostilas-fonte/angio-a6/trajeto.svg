<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="252pt" viewBox="0 0 478 252"><rect x="0.5" y="6.0" width="150.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="15.0" cy="21.0" r="7" fill="#0B5BD3"/><text x="15.0" y="23.9" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">1</text><text x="28.0" y="24.0" font-family="Inter" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Capilares linfáticos</text><text x="168.0" y="24.0" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">Recolhem o excesso de líquido, proteínas e corpos estranhos do tecido.</text><polyline points="75.0,37.0 75.0,43.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="75.0,47.0 72.2,42.0 77.8,42.0" fill="#8AA9DF"/><rect x="0.5" y="48.0" width="150.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="15.0" cy="63.0" r="7" fill="#0B5BD3"/><text x="15.0" y="65.9" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">2</text><text x="28.0" y="66.0" font-family="Inter" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Coletores com válvulas</text><text x="168.0" y="66.0" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">Cada linfângio se contrai: a válvula de baixo fecha, a de cima abre e a linfa sobe.</text><polyline points="75.0,79.0 75.0,85.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="75.0,89.0 72.2,84.0 77.8,84.0" fill="#8AA9DF"/><rect x="0.5" y="90.0" width="150.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="15.0" cy="105.0" r="7" fill="#0B5BD3"/><text x="15.0" y="107.9" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">3</text><text x="28.0" y="108.0" font-family="Inter" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Linfonodos inguinais</text><text x="168.0" y="108.0" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">Na virilha, a linfa passa pelo filtro que apresenta os antígenos aos linfócitos.</text><polyline points="75.0,121.0 75.0,127.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="75.0,131.0 72.2,126.0 77.8,126.0" fill="#8AA9DF"/><rect x="0.5" y="132.0" width="150.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="15.0" cy="147.0" r="7" fill="#0B5BD3"/><text x="15.0" y="149.9" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">4</text><text x="28.0" y="150.0" font-family="Inter" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Cisterna do quilo</text><text x="168.0" y="150.0" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">Recebe a gordura absorvida do intestino: a linfa fica leitosa (quilosa).</text><polyline points="75.0,163.0 75.0,169.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="75.0,173.0 72.2,168.0 77.8,168.0" fill="#8AA9DF"/><rect x="0.5" y="174.0" width="150.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="15.0" cy="189.0" r="7" fill="#0B5BD3"/><text x="15.0" y="191.9" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">5</text><text x="28.0" y="192.0" font-family="Inter" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Ducto torácico</text><text x="168.0" y="186.8" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">Sobe pelo tórax levando a linfa do abdome, dos membros inferiores e do lado</text><text x="168.0" y="197.2" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">esquerdo do corpo.</text><polyline points="75.0,205.0 75.0,211.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="75.0,215.0 72.2,210.0 77.8,210.0" fill="#8AA9DF"/><rect x="0.5" y="216.0" width="150.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="15.0" cy="231.0" r="7" fill="#0B5BD3"/><text x="15.0" y="233.9" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">6</text><text x="28.0" y="234.0" font-family="Inter" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Veia subclávia esquerda</text><text x="168.0" y="234.0" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">Recebe a linfa, com suas proteínas e gorduras, de volta ao sangue.</text></svg>