<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="244.4pt" viewBox="0 0 478 244.4"><rect x="0.0" y="6.0" width="109.0" height="54.5" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1"/><text x="62.5" y="25.4" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">Trombo fecha um</text><text x="62.5" y="34.9" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">ramo</text><text x="62.5" y="46.8" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">da artéria pulmonar</text><circle cx="14.0" cy="33.3" r="7" fill="#0B5BD3"/><text x="14.0" y="36.2" font-family="Inter" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text><rect x="123.0" y="6.0" width="109.0" height="54.5" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1"/><text x="185.5" y="20.6" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">Pressão sobe e o</text><text x="185.5" y="30.2" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">ventrículo direito</text><text x="185.5" y="39.7" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">dilata</text><text x="185.5" y="51.5" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">a valva tricúspide vaza</text><circle cx="137.0" cy="33.3" r="7" fill="#0B5BD3"/><text x="137.0" y="36.2" font-family="Inter" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text><rect x="246.0" y="6.0" width="109.0" height="54.5" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1"/><text x="308.5" y="20.9" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">Parede tensa e</text><text x="308.5" y="30.4" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">inflamada</text><text x="308.5" y="42.3" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">o ventrículo direito</text><text x="308.5" y="51.3" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">pede mais oxigênio</text><circle cx="260.0" cy="33.3" r="7" fill="#0B5BD3"/><text x="260.0" y="36.2" font-family="Inter" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text><rect x="369.0" y="6.0" width="109.0" height="54.5" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="423.5" y="25.7" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">Espaço morto</text><text x="423.5" y="37.6" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">área ventilada sem sangue:</text><text x="423.5" y="46.5" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">hipoxemia</text><path d="M110.0 33.3L118.5 33.3" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="122.0,33.3 118.0,35.7 118.0,30.8" fill="#8AA9DF"/><path d="M233.0 33.3L241.5 33.3" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="245.0,33.3 241.0,35.7 241.0,30.8" fill="#8AA9DF"/><text x="362.0" y="36.3" font-family="Inter" font-size="11" font-weight="600" fill="#0B5BD3" text-anchor="middle">+</text><path d="M300.5 60.5L300.5 72.5L423.5 72.5" stroke="#8AA9DF" stroke-width="1.3" fill="none" stroke-linejoin="round"/><path d="M423.5 60.5L423.5 72.5" stroke="#8AA9DF" stroke-width="1.3" fill="none" stroke-linejoin="round"/><text x="362.0" y="83.0" font-family="Inter" font-size="7" font-weight="400" fill="#16315C" text-anchor="middle">mais demanda, menos oferta</text><path d="M423.5 72.5L423.5 93.0" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="423.5,97.5 420.4,92.5 426.6,92.5" fill="#8AA9DF"/><rect x="0.0" y="98.5" width="109.0" height="54.0" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1" stroke-dasharray="3 2.4"/><text x="54.5" y="117.9" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">O que procurar</text><text x="54.5" y="129.8" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">ventrículo direito dilatado,</text><text x="54.5" y="138.7" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">pressão caindo, lactato alto</text><rect x="246.0" y="98.5" width="109.0" height="54.0" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1"/><text x="308.5" y="113.2" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">Coronárias recebem</text><text x="308.5" y="122.7" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">menos sangue</text><text x="308.5" y="134.5" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">a isquemia piora e o</text><text x="308.5" y="143.5" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">ciclo se fecha</text><circle cx="260.0" cy="125.5" r="7" fill="#0B5BD3"/><text x="260.0" y="128.4" font-family="Inter" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">7</text><rect x="369.0" y="98.5" width="109.0" height="54.0" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1"/><text x="431.5" y="113.2" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">Isquemia do</text><text x="431.5" y="122.7" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">ventrículo direito</text><text x="431.5" y="134.5" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">ele começa a infartar e</text><text x="431.5" y="143.5" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">a contração cai</text><circle cx="383.0" cy="125.5" r="7" fill="#0B5BD3"/><text x="383.0" y="128.4" font-family="Inter" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text><rect x="0.0" y="184.5" width="109.0" height="54.0" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="54.5" y="203.9" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">Parada e óbito</text><text x="54.5" y="215.7" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">se ninguém desobstrui o</text><text x="54.5" y="224.7" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">vaso a tempo</text><rect x="246.0" y="184.5" width="109.0" height="54.0" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1"/><text x="308.5" y="199.1" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">Débito cardíaco e</text><text x="308.5" y="208.6" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">pressão caem</text><text x="308.5" y="220.5" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">síncope, hipotensão:</text><text x="308.5" y="229.5" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">choque obstrutivo</text><circle cx="260.0" cy="211.4" r="7" fill="#0B5BD3"/><text x="260.0" y="214.3" font-family="Inter" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">6</text><rect x="369.0" y="184.5" width="109.0" height="54.0" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1"/><text x="431.5" y="199.1" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">Débito do ventrículo</text><text x="431.5" y="208.6" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">direito cai</text><text x="431.5" y="220.5" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">chega pouco sangue</text><text x="431.5" y="229.5" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">ao ventrículo esquerdo</text><circle cx="383.0" cy="211.4" r="7" fill="#0B5BD3"/><text x="383.0" y="214.3" font-family="Inter" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">5</text><path d="M356.0 125.5L364.5 125.5" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="368.0,125.5 364.0,128.0 364.0,123.0" fill="#8AA9DF"/><path d="M423.5 152.5L423.5 179.0" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="423.5,183.5 420.4,178.5 426.6,178.5" fill="#8AA9DF"/><path d="M368.0 211.4L359.5 211.4" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="356.0,211.4 360.0,209.0 360.0,213.9" fill="#8AA9DF"/><path d="M300.5 184.5L300.5 158.0" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="300.5,153.5 303.6,158.5 297.4,158.5" fill="#8AA9DF"/><path d="M245.0 211.4L114.5 211.4" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="110.0,211.4 115.0,208.3 115.0,214.5" fill="#8AA9DF"/><text x="184.5" y="122.5" font-family="Inter" font-size="9" font-weight="700" fill="#0B5BD3" text-anchor="middle">espiral</text><text x="184.5" y="134.5" font-family="Inter" font-size="9" font-weight="700" fill="#0B5BD3" text-anchor="middle">da morte</text></svg>