<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="287.3pt" viewBox="0 0 478 287.3"><rect x="104.0" y="6.0" width="270.0" height="24.2" rx="7" fill="#E8F0FE" stroke="#8AA9DF" stroke-width="1.1"/><text x="239.0" y="21.2" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="middle">Suspeita de embolia pulmonar em paciente estável</text><path d="M239.0 30.2L239.0 41.7" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="239.0,46.2 235.9,41.2 242.1,41.2" fill="#8AA9DF"/><rect x="69.0" y="46.2" width="340.0" height="33.5" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="239.0" y="60.8" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="middle">História, exame físico e escore de Wells (ou de Genebra): qual a probabilidade antes do</text><text x="239.0" y="70.6" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="middle">exame?</text><path d="M239.0 79.7L239.0 92.7" stroke="#8AA9DF" stroke-width="1.3" fill="none" stroke-linejoin="round"/><path d="M68.0 92.7L410.0 92.7" stroke="#8AA9DF" stroke-width="1.3" fill="none" stroke-linejoin="round"/><path d="M68.0 92.7L68.0 101.2" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="68.0,105.7 64.9,100.7 71.1,100.7" fill="#8AA9DF"/><rect x="0.0" y="106.7" width="136.0" height="23.8" rx="7" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1.1"/><text x="68.0" y="121.5" font-family="Inter" font-size="8" font-weight="600" fill="#16315C" text-anchor="middle">Probabilidade baixa</text><path d="M239.0 92.7L239.0 101.2" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="239.0,105.7 235.9,100.7 242.1,100.7" fill="#8AA9DF"/><rect x="171.0" y="106.7" width="136.0" height="23.8" rx="7" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1.1"/><text x="239.0" y="121.5" font-family="Inter" font-size="8" font-weight="600" fill="#16315C" text-anchor="middle">Probabilidade moderada</text><path d="M410.0 92.7L410.0 101.2" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="410.0,105.7 406.9,100.7 413.1,100.7" fill="#8AA9DF"/><rect x="342.0" y="106.7" width="136.0" height="23.8" rx="7" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1.1"/><text x="410.0" y="121.5" font-family="Inter" font-size="8" font-weight="600" fill="#16315C" text-anchor="middle">Probabilidade alta</text><path d="M68.0 130.5L68.0 143.0" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="68.0,147.5 64.9,142.5 71.1,142.5" fill="#8AA9DF"/><rect x="0.0" y="148.5" width="136.0" height="44.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="68.0" y="163.1" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">Critérios PERC</text><text x="68.0" y="175.0" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">oito perguntas: alguma resposta é</text><text x="68.0" y="183.9" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">sim?</text><path d="M239.0 130.5L239.0 143.0" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="239.0,147.5 235.9,142.5 242.1,142.5" fill="#8AA9DF"/><rect x="171.0" y="148.5" width="136.0" height="44.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="239.0" y="167.6" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">Dímero D + critérios YEARS</text><text x="239.0" y="179.5" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">o resultado define o ponto de corte</text><path d="M410.0 130.5L410.0 143.0" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="410.0,147.5 406.9,142.5 413.1,142.5" fill="#8AA9DF"/><rect x="342.0" y="148.5" width="136.0" height="44.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="410.0" y="167.6" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">Direto para a imagem</text><text x="410.0" y="179.5" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">sem dímero D: só faria perder horas</text><path d="M137.0 170.7L165.5 170.7" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="170.0,170.7 165.0,173.8 165.0,167.6" fill="#8AA9DF"/><text x="153.5" y="166.7" font-family="Inter" font-size="7" font-weight="400" fill="#16315C" text-anchor="middle">alguma</text><text x="153.5" y="181.7" font-family="Inter" font-size="7" font-weight="400" fill="#16315C" text-anchor="middle">sim</text><rect x="0.0" y="236.9" width="136.0" height="44.4" rx="7" fill="#E8F0FE" stroke="#8AA9DF" stroke-width="1.1"/><text x="68.0" y="251.5" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">Nada mais a pedir</text><text x="68.0" y="263.4" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">probabilidade muito baixa, menor</text><text x="68.0" y="272.4" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">que 1%</text><rect x="171.0" y="236.9" width="136.0" height="44.4" rx="7" fill="#E8F0FE" stroke="#8AA9DF" stroke-width="1.1"/><text x="239.0" y="251.5" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">Embolia afastada</text><text x="239.0" y="263.4" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">sem exame de imagem; procure</text><text x="239.0" y="272.4" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">outra causa</text><rect x="342.0" y="236.9" width="136.0" height="44.4" rx="7" fill="#E8F0FE" stroke="#8AA9DF" stroke-width="1.1"/><text x="410.0" y="256.0" font-family="Inter" font-size="7.8" font-weight="600" fill="#16315C" text-anchor="middle">Angiotomografia</text><text x="410.0" y="267.9" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933" text-anchor="middle">confirma ou afasta a embolia</text><path d="M68.0 192.9L68.0 231.4" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="68.0,235.9 64.9,230.9 71.1,230.9" fill="#8AA9DF"/><text x="73.0" y="217.9" font-family="Inter" font-size="7" font-weight="400" fill="#16315C" text-anchor="start">todas não</text><path d="M239.0 192.9L239.0 231.4" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="239.0,235.9 235.9,230.9 242.1,230.9" fill="#8AA9DF"/><text x="234.0" y="217.9" font-family="Inter" font-size="7" font-weight="400" fill="#16315C" text-anchor="end">abaixo do corte</text><path d="M289.0 192.9L289.0 214.9L410.0 214.9" stroke="#8AA9DF" stroke-width="1.3" fill="none" stroke-linejoin="round"/><text x="349.5" y="210.9" font-family="Inter" font-size="7" font-weight="400" fill="#16315C" text-anchor="middle">acima do corte</text><path d="M410.0 192.9L410.0 231.4" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="410.0,235.9 406.9,230.9 413.1,230.9" fill="#8AA9DF"/></svg>