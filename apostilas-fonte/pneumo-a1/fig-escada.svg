<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="244.0pt" viewBox="0 0 478 244.0"><text x="0.0" y="13.0" font-family="Inter" font-size="7.4" font-weight="400" fill="#16315C" text-anchor="start">quanto maior a letra e o número, maior o risco de morrer</text><path d="M205.7 10.5L470.5 10.5" stroke="#8AA9DF" stroke-width="1.3" fill="none"/><polygon points="476.0,10.5 470.0,14.2 470.0,6.8" fill="#8AA9DF"/><rect x="0.0" y="128.0" width="88.0" height="110.0" rx="8" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1"/><text x="8.0" y="153.0" font-family="Inter" font-size="20" font-weight="700" fill="#16315C" text-anchor="start">A</text><text x="8.0" y="168.0" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">Assintomática</text><text x="8.0" y="182.8" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">embolia achada por</text><text x="8.0" y="192.7" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">acaso, em exame</text><text x="8.0" y="202.6" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">pedido por outro</text><text x="8.0" y="212.5" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">motivo</text><rect x="97.5" y="106.0" width="88.0" height="132.0" rx="8" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1.1"/><text x="105.5" y="131.0" font-family="Inter" font-size="20" font-weight="700" fill="#16315C" text-anchor="start">B</text><text x="177.5" y="130.0" font-family="Inter" font-size="7" font-weight="600" fill="#0B5BD3" text-anchor="end">B1 · B2</text><text x="105.5" y="146.0" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">Sintomática,</text><text x="105.5" y="156.3" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">baixa gravidade</text><text x="105.5" y="171.1" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">PESI simplificado</text><text x="105.5" y="181.0" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">igual a zero; o</text><text x="105.5" y="190.9" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">número depende</text><text x="105.5" y="200.8" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">de ser</text><text x="105.5" y="210.7" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">subsegmentar ou</text><text x="105.5" y="220.6" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">não</text><rect x="195.0" y="80.0" width="88.0" height="158.0" rx="8" fill="#DCE8FD" stroke="#C3D8F8" stroke-width="1.1"/><text x="203.0" y="105.0" font-family="Inter" font-size="20" font-weight="700" fill="#16315C" text-anchor="start">C</text><text x="275.0" y="104.0" font-family="Inter" font-size="7" font-weight="600" fill="#0B5BD3" text-anchor="end">C1 · C2 · C3</text><text x="203.0" y="120.0" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">PESI simplificado</text><text x="203.0" y="130.3" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">de 1 ou mais</text><text x="203.0" y="145.1" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">C1: ventrículo</text><text x="203.0" y="155.0" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">direito e</text><text x="203.0" y="164.9" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">biomarcadores</text><text x="203.0" y="174.8" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">normais. C2: um</text><text x="203.0" y="184.7" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">alterado. C3: os</text><text x="203.0" y="194.6" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">dois alterados</text><rect x="292.5" y="54.0" width="88.0" height="184.0" rx="8" fill="#CFE0FB" stroke="#C3D8F8" stroke-width="1.1"/><text x="300.5" y="79.0" font-family="Inter" font-size="20" font-weight="700" fill="#16315C" text-anchor="start">D</text><text x="372.5" y="78.0" font-family="Inter" font-size="7" font-weight="600" fill="#0B5BD3" text-anchor="end">D1 · D2</text><text x="300.5" y="94.0" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">Falência</text><text x="300.5" y="104.3" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">começando</text><text x="300.5" y="119.1" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">hipotensão</text><text x="300.5" y="129.0" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">transitória ou</text><text x="300.5" y="138.9" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">choque</text><text x="300.5" y="148.8" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">normotensivo</text><text x="300.5" y="158.7" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">(pressão normal,</text><text x="300.5" y="168.6" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">perfusão ruim)</text><rect x="390.0" y="30.0" width="88.0" height="208.0" rx="8" fill="#C3D8F8" stroke="#C3D8F8" stroke-width="1.1"/><text x="398.0" y="55.0" font-family="Inter" font-size="20" font-weight="700" fill="#16315C" text-anchor="start">E</text><text x="470.0" y="54.0" font-family="Inter" font-size="7" font-weight="600" fill="#0B5BD3" text-anchor="end">E1 · E2</text><text x="398.0" y="70.0" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">Falência</text><text x="398.0" y="80.3" font-family="Inter" font-size="8.4" font-weight="600" fill="#16315C" text-anchor="start">instalada</text><text x="398.0" y="95.1" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">hipotensão</text><text x="398.0" y="105.0" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">persistente; choque</text><text x="398.0" y="114.9" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">refratário ou parada</text><text x="398.0" y="124.8" font-family="Inter" font-size="7.6" font-weight="400" fill="#1F2933" text-anchor="start">cardiorrespiratória</text></svg>