<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="212pt" viewBox="0 0 478 212"><rect width="478" height="212" rx="12" fill="#F5F8FF"/><rect x="10" y="6" width="458" height="34" rx="9" fill="#FFFFFF" stroke="#C3D8F8"/><text x="239" y="21" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#16315C">10.521 pessoas</text><text x="239" y="34" text-anchor="middle" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933">entraram na fase inicial de tolerabilidade</text><path d="M239 40v4" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="236,43 242,43 239,47" fill="#8AA9DF"/><rect x="10" y="48" width="458" height="34" rx="9" fill="#FFFFFF" stroke="#C3D8F8"/><text x="239" y="63" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#16315C">10.513 receberam enalapril</text><text x="239" y="76" text-anchor="middle" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933">8 receberam apenas sacubitril/valsartana</text><path d="M239 82v4" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="236,85 242,85 239,89" fill="#8AA9DF"/><rect x="10" y="90" width="458" height="34" rx="9" fill="#FFFFFF" stroke="#C3D8F8"/><text x="239" y="105" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#16315C">9.419 receberam sacubitril/valsartana</text><text x="239" y="118" text-anchor="middle" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933">após a etapa com enalapril</text><path d="M239 124v4" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="236,127 242,127 239,131" fill="#8AA9DF"/><rect x="10" y="132" width="458" height="34" rx="9" fill="#FFFFFF" stroke="#C3D8F8"/><text x="239" y="147" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#16315C">8.442 foram sorteadas</text><text x="239" y="160" text-anchor="middle" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933">43 excluídas por randomização inválida ou falhas dos centros</text><path d="M239 166v4" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="236,169 242,169 239,173" fill="#8AA9DF"/><rect x="10" y="174" width="458" height="34" rx="9" fill="#FFFFFF" stroke="#C3D8F8"/><text x="239" y="189" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#16315C">8.399 na análise</text><text x="239" y="202" text-anchor="middle" font-family="Inter" font-size="7" font-weight="400" fill="#1F2933">4.187: sacubitril/valsartana; 4.212: enalapril</text></svg>