<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="208pt" viewBox="0 0 478 208"><rect width="478" height="208" rx="12" fill="#F5F8FF"/><rect x="8" y="8" width="225" height="38" rx="9" fill="#FFFFFF" stroke="#C3D8F8"/><text x="120.5" y="23" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#16315C">1. Pergunta</text><text x="120.5" y="38" text-anchor="middle" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933">Qual população, comparação e desfecho?</text><path d="M120.5 46v7" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="117.5,52 123.5,52 120.5,56" fill="#8AA9DF"/><rect x="8" y="58" width="225" height="38" rx="9" fill="#FFFFFF" stroke="#C3D8F8"/><text x="120.5" y="73" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#16315C">2. Busca</text><text x="120.5" y="88" text-anchor="middle" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933">Onde e até quando procurar estudos?</text><path d="M120.5 96v7" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="117.5,102 123.5,102 120.5,106" fill="#8AA9DF"/><rect x="8" y="108" width="225" height="38" rx="9" fill="#FFFFFF" stroke="#C3D8F8"/><text x="120.5" y="123" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#16315C">3. Triagem</text><text x="120.5" y="138" text-anchor="middle" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933">Quais trabalhos cumprem os critérios?</text><path d="M120.5 146v7" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="117.5,152 123.5,152 120.5,156" fill="#8AA9DF"/><rect x="8" y="158" width="225" height="38" rx="9" fill="#FFFFFF" stroke="#C3D8F8"/><text x="120.5" y="173" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#16315C">4. Extração</text><text x="120.5" y="188" text-anchor="middle" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933">Quais dados e medidas entram?</text><rect x="245" y="8" width="225" height="38" rx="9" fill="#FFFFFF" stroke="#C3D8F8"/><text x="357.5" y="23" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#16315C">5. Análise</text><text x="357.5" y="38" text-anchor="middle" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933">Como combinar as estimativas?</text><path d="M357.5 46v7" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="354.5,52 360.5,52 357.5,56" fill="#8AA9DF"/><rect x="245" y="58" width="225" height="38" rx="9" fill="#FFFFFF" stroke="#C3D8F8"/><text x="357.5" y="73" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#16315C">6. Heterogeneidade</text><text x="357.5" y="88" text-anchor="middle" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933">Quanto os resultados variam?</text><path d="M357.5 96v7" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="354.5,102 360.5,102 357.5,106" fill="#8AA9DF"/><rect x="245" y="108" width="225" height="38" rx="9" fill="#FFFFFF" stroke="#C3D8F8"/><text x="357.5" y="123" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#16315C">7. Gráfico de floresta</text><text x="357.5" y="138" text-anchor="middle" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933">Qual é o efeito e sua incerteza?</text><path d="M357.5 146v7" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="354.5,152 360.5,152 357.5,156" fill="#8AA9DF"/><rect x="245" y="158" width="225" height="38" rx="9" fill="#FFFFFF" stroke="#C3D8F8"/><text x="357.5" y="173" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#16315C">8. Viés de publicação</text><text x="357.5" y="188" text-anchor="middle" font-family="Inter" font-size="7.2" font-weight="400" fill="#1F2933">Quais resultados podem ter ficado ausentes?</text></svg>