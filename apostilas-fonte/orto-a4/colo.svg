<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="270pt" viewBox="0 0 478 270"><rect x="0.0" y="0.0" width="478.0" height="38.7" rx="8" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><text x="239.0" y="16.7" font-family="Inter" font-weight="600" font-size="9.2" fill="#16315C" text-anchor="middle">Fratura do colo do fêmur no idoso: operar sempre</text><text x="239.0" y="29.7" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="middle">Sem cirurgia, o idoso fica na cama, complica e a mortalidade chega a 50% no primeiro ano.</text><line x1="239.0" y1="39.7" x2="239.0" y2="48.7" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="235.0,47.7 243.0,47.7 239.0,53.7" fill="#8AA9DF"/><text x="239.0" y="64.7" font-family="Inter" font-weight="600" font-size="8.4" fill="#0B5BD3" text-anchor="middle">O que decide: idade biológica e demanda funcional</text><line x1="76.3" y1="68.7" x2="76.3" y2="75.7" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="72.3,74.7 80.3,74.7 76.3,80.7" fill="#8AA9DF"/><rect x="0.0" y="81.7" width="152.7" height="67.3" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="7.0" y="96.7" font-family="Inter" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Ativo, lúcido e independente</text><text x="7.0" y="108.6" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Idoso pela idade, jovem pela biologia.</text><line x1="76.3" y1="150.0" x2="76.3" y2="159.0" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="72.3,158.0 80.3,158.0 76.3,164.0" fill="#8AA9DF"/><rect x="0.0" y="165.0" width="152.7" height="56.9" rx="8" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1.4"/><text x="7.0" y="180.3" font-family="Inter" font-weight="600" font-size="8.8" fill="#16315C" text-anchor="start">Artroplastia total do quadril</text><text x="7.0" y="192.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Troca a cabeça do fêmur e o</text><text x="7.0" y="203.3" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">acetábulo. Funciona melhor a longo</text><text x="7.0" y="213.7" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">prazo.</text><line x1="239.0" y1="68.7" x2="239.0" y2="75.7" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="235.0,74.7 243.0,74.7 239.0,80.7" fill="#8AA9DF"/><rect x="162.7" y="81.7" width="152.7" height="67.3" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="169.7" y="96.7" font-family="Inter" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Frágil, baixa demanda</text><text x="169.7" y="108.6" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Anda pouco, só dentro de casa;</text><text x="169.7" y="119.1" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">sequela grave de acidente vascular</text><text x="169.7" y="129.6" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">cerebral ou demência.</text><line x1="239.0" y1="150.0" x2="239.0" y2="159.0" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="235.0,158.0 243.0,158.0 239.0,164.0" fill="#8AA9DF"/><rect x="162.7" y="165.0" width="152.7" height="56.9" rx="8" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1.4"/><text x="169.7" y="180.3" font-family="Inter" font-weight="600" font-size="8.8" fill="#16315C" text-anchor="start">Hemiartroplastia</text><text x="169.7" y="192.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Troca só a cabeça do fêmur. Mais</text><text x="169.7" y="203.3" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">rápida, sangra menos.</text><line x1="401.7" y1="68.7" x2="401.7" y2="75.7" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="397.7,74.7 405.7,74.7 401.7,80.7" fill="#8AA9DF"/><rect x="325.3" y="81.7" width="152.7" height="67.3" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="332.3" y="96.7" font-family="Inter" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Menos de 60 anos ou fratura sem</text><text x="332.3" y="107.6" font-family="Inter" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">desvio</text><text x="332.3" y="119.5" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Também o idoso de 60 a 65 anos</text><text x="332.3" y="130.0" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">muito hígido com fratura não</text><text x="332.3" y="140.5" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">desviada.</text><line x1="401.7" y1="150.0" x2="401.7" y2="159.0" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="397.7,158.0 405.7,158.0 401.7,164.0" fill="#8AA9DF"/><rect x="325.3" y="165.0" width="152.7" height="56.9" rx="8" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1.4"/><text x="332.3" y="180.3" font-family="Inter" font-weight="600" font-size="8.8" fill="#16315C" text-anchor="start">Parafusos canulados</text><text x="332.3" y="192.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Fixação. No idoso com desvio: risco</text><text x="332.3" y="203.3" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">de necrose da cabeça e de nova</text><text x="332.3" y="213.7" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">cirurgia.</text><rect x="0.0" y="233.8" width="478.0" height="35.0" rx="7" fill="#FFFFFF" stroke="#B9C3D3" stroke-width="1" stroke-dasharray="3 2.5"/><text x="239.0" y="248.6" font-family="Inter" font-weight="600" font-size="8.2" fill="#6C6C70" text-anchor="middle">Cortadas de cara: tração cutânea e gesso pelvipodálico</text><text x="239.0" y="260.3" font-family="Inter" font-weight="400" font-size="7.5" fill="#6C6C70" text-anchor="middle">São tratamentos conservadores (o gesso é da criança).</text></svg>