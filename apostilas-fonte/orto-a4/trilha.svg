<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="115pt" viewBox="0 0 478 115"><line x1="9.5" y1="13.0" x2="9.5" y2="97.6" stroke="#C3D8F8" stroke-width="3"/><circle cx="9.5" cy="13.0" r="8.5" fill="#16315C"/><text x="9.5" y="16.0" font-family="Inter" font-weight="600" font-size="8.4" fill="#FFFFFF" text-anchor="middle">1</text><text x="25.0" y="15.5" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="start">Método</text><text x="25.0" y="27.0" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Dado-chave, cortar absurdas, cuidar do paciente.</text><circle cx="9.5" cy="41.2" r="8.5" fill="#0B5BD3"/><text x="9.5" y="44.2" font-family="Inter" font-weight="600" font-size="8.4" fill="#FFFFFF" text-anchor="middle">2</text><text x="25.0" y="43.7" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="start">Ferida e fratura exposta</text><text x="25.0" y="55.2" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Imobilizar com curativo; tétano; lidocaína.</text><circle cx="9.5" cy="69.4" r="8.5" fill="#0B5BD3"/><text x="9.5" y="72.4" font-family="Inter" font-weight="600" font-size="8.4" fill="#FFFFFF" text-anchor="middle">3</text><text x="25.0" y="71.9" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="start">Pelve e choque</text><text x="25.0" y="83.4" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Livro aberto e hipotensão: estabilizar a pelve.</text><circle cx="9.5" cy="97.6" r="8.5" fill="#0B5BD3"/><text x="9.5" y="100.6" font-family="Inter" font-weight="600" font-size="8.4" fill="#FFFFFF" text-anchor="middle">4</text><text x="25.0" y="100.1" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="start">Síndrome compartimental</text><text x="25.0" y="111.6" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Dor desproporcional e ao esticar os dedos.</text><line x1="257.5" y1="13.0" x2="257.5" y2="97.6" stroke="#C3D8F8" stroke-width="3"/><circle cx="257.5" cy="13.0" r="8.5" fill="#0B5BD3"/><text x="257.5" y="16.0" font-family="Inter" font-weight="600" font-size="8.4" fill="#FFFFFF" text-anchor="middle">5</text><text x="273.0" y="15.5" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="start">Fêmur da criança</text><text x="273.0" y="27.0" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Aos 3 anos, gesso da pelve ao pé: 6 a 8 semanas.</text><circle cx="257.5" cy="41.2" r="8.5" fill="#0B5BD3"/><text x="257.5" y="44.2" font-family="Inter" font-weight="600" font-size="8.4" fill="#FFFFFF" text-anchor="middle">6</text><text x="273.0" y="43.7" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="start">Fêmur do idoso</text><text x="273.0" y="55.2" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Perna curta e rodada para fora; operar sempre.</text><circle cx="257.5" cy="69.4" r="8.5" fill="#0B5BD3"/><text x="257.5" y="72.4" font-family="Inter" font-weight="600" font-size="8.4" fill="#FFFFFF" text-anchor="middle">7</text><text x="273.0" y="71.9" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="start">Osteoporose</text><text x="273.0" y="83.4" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Bisfosfonato e, acima de tudo, estilo de vida.</text><circle cx="257.5" cy="97.6" r="8.5" fill="#0B5BD3"/><text x="257.5" y="100.6" font-family="Inter" font-weight="600" font-size="8.4" fill="#FFFFFF" text-anchor="middle">8</text><text x="273.0" y="100.1" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="start">Unidade Básica de Saúde</text><text x="273.0" y="111.6" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Lombalgia sem imagem; canabidiol: informar.</text></svg>