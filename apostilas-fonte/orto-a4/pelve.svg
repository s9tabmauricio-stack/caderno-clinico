<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="219pt" viewBox="0 0 478 219"><text x="0.0" y="9.0" font-family="Inter" font-weight="600" font-size="7.2" fill="#6C6C70" text-anchor="start">O CAMINHO DO CASO</text><text x="314.0" y="9.0" font-family="Inter" font-weight="600" font-size="7.2" fill="#6C6C70" text-anchor="start">FORA DE HORA</text><rect x="0.0" y="16.0" width="300.0" height="35.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="7.0" y="30.9" font-family="Inter" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Atropelamento aos 22 anos: trauma de alta energia</text><text x="7.0" y="42.7" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Bacia instável, hematoma no escroto, pressão 80 por 60, pulso 120.</text><line x1="150.0" y1="52.2" x2="150.0" y2="59.2" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="146.0,58.2 154.0,58.2 150.0,64.2" fill="#8AA9DF"/><rect x="0.0" y="65.2" width="300.0" height="35.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="7.0" y="80.1" font-family="Inter" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Ultrassom FAST: sem líquido livre no abdome</text><text x="7.0" y="91.9" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">O sangue não está dentro da barriga.</text><line x1="150.0" y1="101.5" x2="150.0" y2="108.5" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="146.0,107.5 154.0,107.5 150.0,113.5" fill="#8AA9DF"/><rect x="0.0" y="114.5" width="300.0" height="35.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="7.0" y="129.4" font-family="Inter" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Radiografia: sínfise aberta, pelve em livro aberto</text><text x="7.0" y="141.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Cinta pélvica aplicada: fecha o anel.</text><line x1="150.0" y1="150.7" x2="150.0" y2="164.7" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="146.0,163.7 154.0,163.7 150.0,169.7" fill="#8AA9DF"/><text x="158.0" y="163.2" font-family="Inter" font-weight="500" font-size="7.6" fill="#0B5BD3" text-anchor="start">continua hipotenso</text><rect x="0.0" y="170.7" width="300.0" height="46.2" rx="8" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1.6"/><text x="7.0" y="186.0" font-family="Inter" font-weight="600" font-size="8.7" fill="#16315C" text-anchor="start">Estabilização cirúrgica da pelve</text><text x="7.0" y="198.3" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Fixador externo: rápido, com sedação leve ou anestesia local; o plexo venoso</text><text x="7.0" y="208.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">para de sangrar. Se nada der certo, depois: angiografia com embolização.</text><rect x="314.0" y="60.2" width="164.0" height="45.4" rx="7" fill="#FFFFFF" stroke="#B9C3D3" stroke-width="1" stroke-dasharray="3 2.5"/><text x="321.0" y="75.0" font-family="Inter" font-weight="600" font-size="8.2" fill="#6C6C70" text-anchor="start">Laparotomia exploradora</text><text x="321.0" y="86.6" font-family="Inter" font-weight="400" font-size="7.5" fill="#6C6C70" text-anchor="start">O FAST já afastou sangue na barriga; e é</text><text x="321.0" y="97.0" font-family="Inter" font-weight="400" font-size="7.5" fill="#6C6C70" text-anchor="start">campo da cirurgia geral.</text><line x1="302" y1="82.9" x2="312" y2="82.9" stroke="#B9C3D3" stroke-width="1" stroke-dasharray="2 2"/><rect x="314.0" y="114.6" width="164.0" height="35.0" rx="7" fill="#FFFFFF" stroke="#B9C3D3" stroke-width="1" stroke-dasharray="3 2.5"/><text x="321.0" y="129.4" font-family="Inter" font-weight="600" font-size="8.2" fill="#6C6C70" text-anchor="start">Tomografia de abdome e pelve</text><text x="321.0" y="141.0" font-family="Inter" font-weight="400" font-size="7.5" fill="#6C6C70" text-anchor="start">Demora, e o paciente está instável.</text><line x1="302" y1="132.1" x2="312" y2="132.1" stroke="#B9C3D3" stroke-width="1" stroke-dasharray="2 2"/><rect x="314.0" y="171.2" width="164.0" height="45.4" rx="7" fill="#FFFFFF" stroke="#B9C3D3" stroke-width="1" stroke-dasharray="3 2.5"/><text x="321.0" y="185.9" font-family="Inter" font-weight="600" font-size="8.2" fill="#6C6C70" text-anchor="start">Angiografia agora</text><text x="321.0" y="197.6" font-family="Inter" font-weight="400" font-size="7.5" fill="#6C6C70" text-anchor="start">Demora e exige hospital terciário: fica</text><text x="321.0" y="208.0" font-family="Inter" font-weight="400" font-size="7.5" fill="#6C6C70" text-anchor="start">para depois.</text><line x1="302" y1="193.8" x2="312" y2="193.8" stroke="#B9C3D3" stroke-width="1" stroke-dasharray="2 2"/></svg>