<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="158pt" viewBox="0 0 478 158"><rect x="0.0" y="4.0" width="106.0" height="59.8" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="13.0" cy="17.0" r="8" fill="#0B5BD3"/><text x="13.0" y="20.0" font-family="Inter" font-weight="700" font-size="8.2" fill="#FFFFFF" text-anchor="middle">1</text><text x="25.0" y="20.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">A placa</text><text x="7.0" y="34.0" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">uma doença do corpo</text><text x="7.0" y="44.4" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">inteiro</text><rect x="124.0" y="4.0" width="106.0" height="59.8" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="137.0" cy="17.0" r="8" fill="#0B5BD3"/><text x="137.0" y="20.0" font-family="Inter" font-weight="700" font-size="8.2" fill="#FFFFFF" text-anchor="middle">2</text><text x="149.0" y="20.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Onde ela se</text><text x="149.0" y="31.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">instala</text><text x="131.0" y="45.0" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">aortoilíaca,</text><text x="131.0" y="55.4" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">femoropoplítea e distal</text><rect x="248.0" y="4.0" width="106.0" height="59.8" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="261.0" cy="17.0" r="8" fill="#0B5BD3"/><text x="261.0" y="20.0" font-family="Inter" font-weight="700" font-size="8.2" fill="#FFFFFF" text-anchor="middle">3</text><text x="273.0" y="20.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Claudicação e</text><text x="273.0" y="31.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">evolução</text><text x="255.0" y="45.0" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">da dor ao caminhar até a</text><text x="255.0" y="55.4" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">gangrena</text><rect x="372.0" y="4.0" width="106.0" height="59.8" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="385.0" cy="17.0" r="8" fill="#0B5BD3"/><text x="385.0" y="20.0" font-family="Inter" font-weight="700" font-size="8.2" fill="#FFFFFF" text-anchor="middle">4</text><text x="397.0" y="20.0" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Exame e índice</text><text x="379.0" y="34.0" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">pulsos, Doppler e índice</text><text x="379.0" y="44.4" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">tornozelo-braquial</text><rect x="0.0" y="93.8" width="106.0" height="59.8" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="13.0" cy="106.8" r="8" fill="#0B5BD3"/><text x="13.0" y="109.8" font-family="Inter" font-weight="700" font-size="8.2" fill="#FFFFFF" text-anchor="middle">5</text><text x="25.0" y="109.8" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Exames de</text><text x="25.0" y="120.8" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">imagem</text><text x="7.0" y="134.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">só para quem vai a</text><text x="7.0" y="145.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">procedimento</text><rect x="124.0" y="93.8" width="106.0" height="59.8" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="137.0" cy="106.8" r="8" fill="#0B5BD3"/><text x="137.0" y="109.8" font-family="Inter" font-weight="700" font-size="8.2" fill="#FFFFFF" text-anchor="middle">6</text><text x="149.0" y="109.8" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Mudança de vida</text><text x="131.0" y="123.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">caminhada, cigarro, dieta</text><text x="131.0" y="134.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">e metas</text><rect x="248.0" y="93.8" width="106.0" height="59.8" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="261.0" cy="106.8" r="8" fill="#0B5BD3"/><text x="261.0" y="109.8" font-family="Inter" font-weight="700" font-size="8.2" fill="#FFFFFF" text-anchor="middle">7</text><text x="273.0" y="109.8" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Remédios</text><text x="255.0" y="123.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">as três drogas e a</text><text x="255.0" y="134.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">escada do colesterol</text><rect x="372.0" y="93.8" width="106.0" height="59.8" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="385.0" cy="106.8" r="8" fill="#0B5BD3"/><text x="385.0" y="109.8" font-family="Inter" font-weight="700" font-size="8.2" fill="#FFFFFF" text-anchor="middle">8</text><text x="397.0" y="109.8" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Cirurgia</text><text x="379.0" y="123.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">quando operar, TASC,</text><text x="379.0" y="134.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">WIfI e amputação</