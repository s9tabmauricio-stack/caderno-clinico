<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="370pt" viewBox="0 0 478 370"><rect x="157.0" y="6.0" width="150.0" height="34.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="232.0" y="20.2" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="middle">Aorta</text><text x="232.0" y="34.7" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="middle">bifurca na altura do umbigo</text><rect x="157.0" y="55.4" width="150.0" height="21.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="232.0" y="69.6" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="middle">Ilíaca comum</text><rect x="157.0" y="91.6" width="150.0" height="21.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="232.0" y="105.7" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="middle">Ilíaca externa</text><rect x="157.0" y="127.8" width="150.0" height="34.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="232.0" y="141.9" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="middle">Femoral comum</text><text x="232.0" y="156.5" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="middle">depois do ligamento inguinal</text><rect x="157.0" y="177.1" width="150.0" height="21.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="232.0" y="191.3" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="middle">Femoral superficial</text><rect x="157.0" y="213.3" width="150.0" height="44.6" rx="7" fill="#F5F8FF" stroke="#0B5BD3" stroke-width="1.6"/><text x="232.0" y="227.5" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="middle">Canal dos adutores</text><text x="232.0" y="242.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="middle">a artéria do