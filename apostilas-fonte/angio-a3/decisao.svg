<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="335pt" viewBox="0 0 478 335"><rect x="104.0" y="4.0" width="270.0" height="36.9" rx="7" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1.4"/><text x="239.0" y="19.2" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="middle">Paciente com doença arterial obstrutiva periférica</text><text x="239.0" y="33.7" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="middle">A pergunta que decide: o sintoma é importante?</text><rect x="0.0" y="70.9" width="160.0" height="58.5" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="7.0" y="86.1" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Sem sintoma importante</text><text x="7.0" y="100.7" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Sem sintoma, pouco sintoma ou</text><text x="7.0" y="111.4" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">claudicação que não limita (andar 200</text><text x="7.0" y="122.2" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">metros não é limitante)</text><rect x="196.0" y="70.9" width="282.0" height="58.5" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="203.0" y="86.1" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Sintoma importante</text><text x="203.0" y="100.7" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Dor em repouso, lesão trófica ou claudicação limitante: não chega ao</text><text x="203.0" y="111.4" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">portão, não consegue trabalhar</text><line x1="144.0" y1="41.9" x2="85.0" y2="67.7" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="80.0,69.9 83.8,65.0 86.3,70.5" fill="#8AA9DF"/><line x1="334.0" y1="41.9" x2="336.4" y2="64.5" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="337.0,69.9 333.4,64.8 339.4,64.2" fill="#8AA9DF"/><rect x="94.8" y="48.9" width="22.4" height="11" rx="5.5" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="0.8"/><text x="106.0" y="57.1" font-family="Inter" font-weight="600" font-size="7.4" fill="#0B5BD3" text-anchor="middle">Não</text><rect x="330.8" y="48.9" width="21.4" height="11" rx="5.5" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="0.8"/><text x="341.5" y="57.1" font-family="Inter" font-weight="600" font-size="7.4" fill="#0B5BD3" text-anchor="middle">Sim</text><rect x="0.0" y="145.4" width="160.0" height="58.5" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="7.0" y="160.6" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Tratamento clínico</text><text x="7.0" y="175.2" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Caminhada todos os dias, parar de</text><text x="7.0" y="185.9" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">fumar, dieta, os três remédios e o LDL</text><text x="7.0" y="196.7" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">na meta.</text><line x1="80.0" y1="130.4" x2="80.0" y2="138.9" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="80.0,144.4 77.0,138.9 83.0,138.9" fill="#8AA9DF"/><rect x="0.0" y="219.9" width="160.0" height="58.5" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="7.0" y="235.1" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Melhorou?</text><text x="7.0" y="249.6" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Andava 200 metros e passou a andar</text><text x="7.0" y="260.4" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">400: segue no tratamento clínico, sem</text><text x="7.0" y="271.2" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">operar.</text><line x1="80.0" y1="204.9" x2="80.0" y2="213.4" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="80.0,218.9 77.0,213.4 83.0,213.4" fill="#8AA9DF"/><rect x="196.0" y="145.4" width="282.0" height="36.9" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="203.0" y="160.6" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Classificação WIfI</text><text x="203.0" y="175.2" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Ferida profunda, isquemia crítica e infecção com sepse?</text><line x1="337.0" y1="130.4" x2="337.0" y2="138.9" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="337.0,144.4 334.0,138.9 340.0,138.9" fill="#8AA9DF"/><rect x="196.0" y="208.4" width="80.0" height="47.7" rx="7" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1.4"/><text x="203.0" y="223.5" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Amputação</text><text x="203.0" y="238.1" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">salva a vida do</text><text x="203.0" y="248.9" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">paciente</text><rect x="288.0" y="208.4" width="190.0" height="47.7" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="295.0" y="223.5" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Classificação TASC</text><text x="295.0" y="238.1" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">decide o caminho da cirurgia</text><line x1="307.0" y1="183.4" x2="241.2" y2="205.6" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="236.0,207.4 240.2,202.7 242.2,208.5" fill="#8AA9DF"/><line x1="367.0" y1="183.4" x2="379.9" y2="202.8" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="383.0,207.4 377.4,204.5 382.5,201.1" fill="#8AA9DF"/><rect x="247.3" y="187.4" width="21.4" height="11" rx="5.5" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="0.8"/><text x="258.0" y="195.6" font-family="Inter" font-weight="600" font-size="7.4" fill="#0B5BD3" text-anchor="middle">Sim</text><rect x="369.8" y="187.4" width="22.4" height="11" rx="5.5" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="0.8"/><text x="381.0" y="195.6" font-family="Inter" font-weight="600" font-size="7.4" fill="#0B5BD3" text-anchor="middle">Não</text><rect x="288.0" y="274.1" width="91.0" height="56.8" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="295.0" y="289.2" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">A e B: lesão curta</text><text x="295.0" y="303.8" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">endovascular, por</text><text x="295.0" y="314.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">dentro do vaso</text><line x1="383.0" y1="257.1" x2="338.7" y2="271.4" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="333.5,273.1 337.8,268.5 339.7,274.3" fill="#8AA9DF"/><rect x="387.0" y="274.1" width="91.0" height="56.8" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="394.0" y="289.2" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">C e D: lesão longa</text><text x="394.0" y="303.8" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">cirurgia aberta:</text><text x="394.0" y="314.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">ponte, de preferência</text><text x="394.0" y="324.2" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">com safena</text><line x1="383.0" y1="257.1" x2="427.3" y2="271.4" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="432.5,273.1 426.3,274.3 428.2,268.5" fill="#8AA9DF"/><line x1="161.0" y1="174.7" x2="189.0" y2="174.7" stroke="#8AA9DF" stroke-width="1.3" stroke-dasharray="3 2.5"/><line x1="188.0" y1="174.7" x2="189.5" y2="174.7" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="195.0,174.7 189.5,177.7 189.5,171.6" fill="#8AA9DF"/><text x="178.0" y="170.7" font-family="Inter" font-weight="600" font-size="7" fill="#0B5BD3" text-anchor="middle">piorou</text></svg>