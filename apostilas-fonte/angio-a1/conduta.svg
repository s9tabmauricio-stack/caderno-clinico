<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="248pt" viewBox="0 0 478 248"><rect x="2.0" y="2.0" width="474.0" height="34.0" rx="9" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1"/><text x="239.0" y="17.1" font-family="Inter SemiBold" font-size="9.6" fill="#16315C" text-anchor="middle">Pé diabético com úlcera ou infecção</text><text x="239.0" y="29.7" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">olhar a cor e a temperatura, palpar os pulsos e medir o índice tornozelo-braquial</text><rect x="2.0" y="58.0" width="151.3" height="40.0" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="77.7" y="76.0" font-family="Inter SemiBold" font-size="9.2" fill="#16315C" text-anchor="middle">Boa perfusão</text><text x="77.7" y="88.1" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">tem pulso, ou índice de 0,9 ou mais</text><rect x="163.3" y="58.0" width="312.7" height="40.0" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="319.7" y="76.0" font-family="Inter SemiBold" font-size="9.2" fill="#16315C" text-anchor="middle">Comprometimento arterial importante</text><text x="319.7" y="88.1" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">sem pulso, ou índice abaixo de 0,9</text><line x1="199.0" y1="37.0" x2="83.1" y2="56.1" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="77.7,57.0 82.6,52.9 83.6,59.3" fill="#8AA9DF"/><line x1="279.0" y1="37.0" x2="314.7" y2="54.6" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="319.7,57.0 313.3,57.4 316.1,51.7" fill="#8AA9DF"/><rect x="163.3" y="120.0" width="151.3" height="46.0" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="239.0" y="136.0" font-family="Inter SemiBold" font-size="9.2" fill="#16315C" text-anchor="middle">Claudicação intermitente</text><text x="239.0" y="148.1" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">dor ao andar, sem risco iminente</text><text x="239.0" y="158.1" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">para a perna</text><rect x="324.7" y="120.0" width="151.3" height="46.0" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="400.3" y="136.0" font-family="Inter SemiBold" font-size="9.2" fill="#16315C" text-anchor="middle">Dor isquêmica de repouso</text><text x="400.3" y="148.1" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">dói parado; depois do banho a</text><text x="400.3" y="158.1" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">perna esfria e empalidece</text><line x1="289.7" y1="99.0" x2="244.1" y2="117.0" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="239.0,119.0 242.9,114.0 245.3,120.0" fill="#8AA9DF"/><line x1="349.7" y1="99.0" x2="395.2" y2="117.0" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="400.3,119.0 394.0,120.0 396.4,114.0" fill="#8AA9DF"/><rect x="2.0" y="188.0" width="151.3" height="58.0" rx="9" fill="#E7F7EC" stroke="#BFE5CB" stroke-width="1.1"/><text x="77.7" y="215.0" font-family="Inter SemiBold" font-size="9.2" fill="#1E7A34" text-anchor="middle">Tratamento habitual</text><text x="77.7" y="227.1" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">cuidar da úlcera e tratar a infecção</text><rect x="163.3" y="188.0" width="151.3" height="58.0" rx="9" fill="#E7F7EC" stroke="#BFE5CB" stroke-width="1.1"/><text x="239.0" y="204.2" font-family="Inter SemiBold" font-size="9.2" fill="#1E7A34" text-anchor="middle">Ambulatório de cirurgia</text><text x="239.0" y="215.7" font-family="Inter SemiBold" font-size="9.2" fill="#1E7A34" text-anchor="middle">vascular</text><text x="239.0" y="227.8" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">encaminhar para acompanhar e</text><text x="239.0" y="237.8" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">avaliar</text><rect x="324.7" y="188.0" width="151.3" height="58.0" rx="9" fill="#E7F7EC" stroke="#BFE5CB" stroke-width="1.1"/><text x="400.3" y="210.0" font-family="Inter SemiBold" font-size="9.2" fill="#1E7A34" text-anchor="middle">Internar com urgência</text><text x="400.3" y="222.1" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">revascularizar, desbridar a necrose</text><text x="400.3" y="232.1" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">e amputar o que não for viável</text><line x1="77.7" y1="99.0" x2="77.7" y2="181.5" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="77.7,187.0 74.5,181.5 80.9,181.5" fill="#8AA9DF"/><line x1="239.0" y1="167.0" x2="239.0" y2="181.5" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="239.0,187.0 235.8,181.5 242.2,181.5" fill="#8AA9DF"/><line x1="400.3" y1="167.0" x2="400.3" y2="181.5" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="400.3,187.0 397.1,181.5 403.5,181.5" fill="#8AA9DF"/></svg>