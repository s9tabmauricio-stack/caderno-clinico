<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="300pt" viewBox="0 0 478 300"><rect x="2.0" y="2.0" width="112.5" height="32.0" rx="9" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1"/><text x="58.2" y="16.2" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="middle">Neuropatia</text><text x="58.2" y="28.6" font-family="Inter" font-size="7.3" fill="#4A4A4F" text-anchor="middle">sensitiva e autonômica</text><line x1="58.2" y1="35.0" x2="58.2" y2="41.5" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="58.2,47.0 55.0,41.5 61.5,41.5" fill="#8AA9DF"/><rect x="2.0" y="48.0" width="112.5" height="47.3" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="58.2" y="63.5" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">Não sente dor, calor</text><text x="58.2" y="73.9" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">nem frio; o pé não sua,</text><text x="58.2" y="84.4" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">resseca e racha</text><line x1="58.2" y1="96.3" x2="58.2" y2="102.8" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="58.2,108.3 55.0,102.8 61.5,102.8" fill="#8AA9DF"/><rect x="2.0" y="109.3" width="112.5" height="47.3" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="58.2" y="124.8" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">Machuca, não dói e</text><text x="58.2" y="135.2" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">continua pisando em</text><text x="58.2" y="145.6" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">cima</text><rect x="122.5" y="2.0" width="112.5" height="32.0" rx="9" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1"/><text x="178.8" y="16.2" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="middle">Deformidade</text><text x="178.8" y="28.6" font-family="Inter" font-size="7.3" fill="#4A4A4F" text-anchor="middle">da neuropatia motora</text><line x1="178.8" y1="35.0" x2="178.8" y2="41.5" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="178.8,47.0 175.6,41.5 181.9,41.5" fill="#8AA9DF"/><rect x="122.5" y="48.0" width="112.5" height="47.3" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="178.8" y="63.5" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">Dedos em garra e em</text><text x="178.8" y="73.9" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">martelo, poucos pontos</text><text x="178.8" y="84.4" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">de apoio</text><line x1="178.8" y1="96.3" x2="178.8" y2="102.8" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="178.8,108.3 175.6,102.8 181.9,102.8" fill="#8AA9DF"/><rect x="122.5" y="109.3" width="112.5" height="47.3" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="178.8" y="124.8" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">Calo nos pontos de</text><text x="178.8" y="135.2" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">pressão; embaixo dele,</text><text x="178.8" y="145.6" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">a úlcera afunda</text><rect x="243.0" y="2.0" width="112.5" height="32.0" rx="9" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1"/><text x="299.2" y="16.2" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="middle">Doença arterial</text><text x="299.2" y="28.6" font-family="Inter" font-size="7.3" fill="#4A4A4F" text-anchor="middle">aterosclerose acelerada</text><line x1="299.2" y1="35.0" x2="299.2" y2="41.5" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="299.2,47.0 296.1,41.5 302.4,41.5" fill="#8AA9DF"/><rect x="243.0" y="48.0" width="112.5" height="47.3" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="299.2" y="63.5" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">Doença distal, muitas</text><text x="299.2" y="73.9" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">vezes sem queixa de</text><text x="299.2" y="84.4" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">claudicação</text><line x1="299.2" y1="96.3" x2="299.2" y2="102.8" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="299.2,108.3 296.1,102.8 302.4,102.8" fill="#8AA9DF"/><rect x="243.0" y="109.3" width="112.5" height="47.3" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="299.2" y="124.8" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">Sem oxigênio nem</text><text x="299.2" y="135.2" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">antibiótico, a ferida não</text><text x="299.2" y="145.6" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">fecha</text><rect x="363.5" y="2.0" width="112.5" height="32.0" rx="9" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1"/><text x="419.8" y="16.2" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="middle">Infecção</text><text x="419.8" y="28.6" font-family="Inter" font-size="7.3" fill="#4A4A4F" text-anchor="middle">germes da própria pele</text><line x1="419.8" y1="35.0" x2="419.8" y2="41.5" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="419.8,47.0 416.6,41.5 422.9,41.5" fill="#8AA9DF"/><rect x="363.5" y="48.0" width="112.5" height="47.3" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="419.8" y="63.5" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">Entra pela ferida, desce</text><text x="419.8" y="73.9" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">aos tendões e chega ao</text><text x="419.8" y="84.4" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">osso</text><line x1="419.8" y1="96.3" x2="419.8" y2="102.8" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="419.8,108.3 416.6,102.8 422.9,102.8" fill="#8AA9DF"/><rect x="363.5" y="109.3" width="112.5" height="47.3" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="419.8" y="130.0" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">Osteomielite e sepse: o</text><text x="419.8" y="140.4" font-family="Inter" font-size="7.9" fill="#1F2933" text-anchor="middle">foco precisa sair</text><line x1="58.2" y1="157.6" x2="170.3" y2="174.7" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="175.7,175.6 169.8,177.9 170.8,171.6" fill="#8AA9DF"/><line x1="178.8" y1="157.6" x2="212.9" y2="173.3" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="217.9,175.6 211.6,176.2 214.3,170.4" fill="#8AA9DF"/><line x1="299.2" y1="157.6" x2="265.1" y2="173.3" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="260.1,175.6 263.7,170.4 266.4,176.2" fill="#8AA9DF"/><line x1="419.8" y1="157.6" x2="307.7" y2="174.7" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="302.3,175.6 307.2,171.6 308.2,177.9" fill="#8AA9DF"/><rect x="2.0" y="176.6" width="474.0" height="34.0" rx="9" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1.1"/><text x="239.0" y="191.7" font-family="Inter SemiBold" font-size="9.6" fill="#16315C" text-anchor="middle">Úlcera que não cicatriza e infecciona</text><text x="239.0" y="204.3" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">as quatro frentes se somam no mesmo pé</text><line x1="239.0" y1="211.6" x2="239.0" y2="218.1" stroke="#8AA9DF" stroke-width="1.5"/><polygon points="239.0,223.6 235.8,218.1 242.2,218.1" fill="#8AA9DF"/><rect x="2.0" y="224.6" width="474.0" height="30.0" rx="9" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1.1"/><text x="239.0" y="237.7" font-family="Inter SemiBold" font-size="9.6" fill="#16315C" text-anchor="middle">Amputação</text><text x="239.0" y="250.3" font-family="Inter" font-size="7.6" fill="#4A4A4F" text-anchor="middle">cerca de 1 milhão de pessoas com diabetes por ano no mundo</text><rect x="2.0" y="264.6" width="474.0" height="34.0" rx="9" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1.1" stroke-dasharray="3 2.5"/><text x="239.0" y="278.1" font-family="Inter SemiBold" font-size="8.4" fill="#16315C" text-anchor="middle">O que freia cada frente</text><text x="239.0" y="290.6" font-family="Inter" font-size="7.5" fill="#4A4A4F" text-anchor="middle">controle da glicemia · autoexame diário · palmilha e calçado sob medida · revascularizar a isquemia · tratar cedo a infecção</text></svg>