<svg xmlns="http://www.w3.org/2000/svg" width="478" height="162" viewBox="0 0 478 162"><rect x="0.5" y="1.0" width="106.5" height="66.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="15.5" cy="16.5" r="7.5" fill="#16315C"/><text x="15.5" y="19.4" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">1</text><text x="28.0" y="19.5" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="start">Os casos</text><text x="8.0" y="35.0" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Infecção de pele que</text><text x="8.0" y="45.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">mutilou e matou gente</text><text x="8.0" y="55.4" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">saudável</text><polyline points="109.5,34.3 120.5,34.3" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="118.0,30.8 118.0,37.8 122.5,34.3" fill="#8AA9DF"/><rect x="124.0" y="1.0" width="106.5" height="66.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="139.0" cy="16.5" r="7.5" fill="#16315C"/><text x="139.0" y="19.4" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">2</text><text x="151.5" y="19.5" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="start">Os três nomes</text><text x="131.5" y="35.0" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Linfangite, erisipela e</text><text x="131.5" y="45.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">celulite; 90% nas pernas</text><polyline points="233.0,34.3 244.0,34.3" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="241.4,30.8 241.4,37.8 246.0,34.3" fill="#8AA9DF"/><rect x="247.5" y="1.0" width="106.5" height="66.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="262.5" cy="16.5" r="7.5" fill="#16315C"/><text x="262.5" y="19.4" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">3</text><text x="275.0" y="19.5" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="start">O germe</text><text x="255.0" y="35.0" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Na erisipela clássica, o</text><text x="255.0" y="45.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">estreptococo do grupo A</text><polyline points="356.5,34.3 367.5,34.3" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="364.9,30.8 364.9,37.8 369.5,34.3" fill="#8AA9DF"/><rect x="371.0" y="1.0" width="106.5" height="66.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="386.0" cy="16.5" r="7.5" fill="#16315C"/><text x="386.0" y="19.4" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">4</text><text x="398.5" y="19.5" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="start">A cilada</text><text x="378.5" y="35.0" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Febre sem foco:</text><text x="378.5" y="45.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">examinar as pernas</text><text x="378.5" y="55.4" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">antes de liberar</text><rect x="0.5" y="93.6" width="106.5" height="66.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="15.5" cy="109.1" r="7.5" fill="#16315C"/><text x="15.5" y="112.0" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">5</text><text x="28.0" y="112.1" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="start">O exame</text><text x="8.0" y="127.6" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Gânglio de Chomel,</text><text x="8.0" y="137.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">porta de entrada,</text><text x="8.0" y="148.0" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">tromboflebite, exames</text><polyline points="109.5,126.9 120.5,126.9" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="118.0,123.4 118.0,130.4 122.5,126.9" fill="#8AA9DF"/><rect x="124.0" y="93.6" width="106.5" height="66.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="139.0" cy="109.1" r="7.5" fill="#16315C"/><text x="139.0" y="112.0" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">6</text><text x="151.5" y="112.1" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="start">Complicações</text><text x="131.5" y="127.6" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Necrose da pele, fasciíte,</text><text x="131.5" y="137.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">sepse, linfedema</text><polyline points="233.0,126.9 244.0,126.9" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="241.4,123.4 241.4,130.4 246.0,126.9" fill="#8AA9DF"/><rect x="247.5" y="93.6" width="106.5" height="66.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="262.5" cy="109.1" r="7.5" fill="#16315C"/><text x="262.5" y="112.0" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">7</text><text x="275.0" y="112.1" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="start">Tratamento</text><text x="255.0" y="127.6" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Do leve ao grave;</text><text x="255.0" y="137.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">corticoide só depois</text><polyline points="356.5,126.9 367.5,126.9" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="364.9,123.4 364.9,130.4 369.5,126.9" fill="#8AA9DF"/><rect x="371.0" y="93.6" width="106.5" height="66.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="386.0" cy="109.1" r="7.5" fill="#16315C"/><text x="386.0" y="112.0" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF" text-anchor="middle">8</text><text x="398.5" y="112.1" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="start">Prevenção</text><text x="378.5" y="127.6" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">Fechar as portas de</text><text x="378.5" y="137.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="start">entrada: pés e sapatos</text><polyline points="424.2,68.6 424.2,80.6 53.8,80.6 53.8,87.6" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="50.2,88.0 57.2,88.0 53.8,92.6" fill="#8AA9DF"/></svg>