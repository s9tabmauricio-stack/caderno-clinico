<svg xmlns="http://www.w3.org/2000/svg" width="478" height="275" viewBox="0 0 478 275"><rect x="0.5" y="0.5" width="477.0" height="26.0" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><text x="239.0" y="17.0" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="middle">Erisipela: como o paciente está?</text><polyline points="75.7,27.0 75.7,39.0" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="72.2,38.5 79.2,38.5 75.7,43.0" fill="#8AA9DF"/><rect x="0.5" y="44.0" width="150.3" height="22.0" rx="7" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1"/><text x="75.7" y="58.5" font-family="Inter" font-weight="600" font-size="9.2" fill="#16315C" text-anchor="middle">Leve</text><polyline points="75.7,67.0 75.7,75.0" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="72.2,74.5 79.2,74.5 75.7,79.0" fill="#8AA9DF"/><rect x="0.5" y="80.0" width="150.3" height="22.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="8.0" y="94.0" font-family="Inter" font-weight="600" font-size="7.9" fill="#16315C" text-anchor="start">Trata em casa</text><polyline points="75.7,103.4 75.7,111.4" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="72.2,110.9 79.2,110.9 75.7,115.4" fill="#8AA9DF"/><rect x="0.5" y="116.4" width="150.3" height="43.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="8.0" y="130.4" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">Amoxicilina com clavulanato, ou</text><text x="8.0" y="140.8" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">cefalexina (cefalosporina de</text><text x="8.0" y="151.2" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">primeira geração)</text><polyline points="75.7,160.6 75.7,168.6" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="72.2,168.1 79.2,168.1 75.7,172.6" fill="#8AA9DF"/><rect x="0.5" y="173.6" width="150.3" height="43.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="8.0" y="187.6" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">A maior parte das erisipelas se</text><text x="8.0" y="198.0" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">resolve com antibiótico simples</text><polyline points="239.0,27.0 239.0,39.0" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="235.5,38.5 242.5,38.5 239.0,43.0" fill="#8AA9DF"/><rect x="163.8" y="44.0" width="150.3" height="22.0" rx="7" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1"/><text x="239.0" y="58.5" font-family="Inter" font-weight="600" font-size="9.2" fill="#16315C" text-anchor="middle">Moderado</text><polyline points="239.0,67.0 239.0,75.0" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="235.5,74.5 242.5,74.5 239.0,79.0" fill="#8AA9DF"/><rect x="163.8" y="80.0" width="150.3" height="32.8" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="171.3" y="94.0" font-family="Inter" font-weight="600" font-size="7.9" fill="#16315C" text-anchor="start">Interna na unidade de pronto</text><text x="171.3" y="104.4" font-family="Inter" font-weight="600" font-size="7.9" fill="#16315C" text-anchor="start">atendimento</text><polyline points="239.0,113.8 239.0,121.8" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="235.5,121.2 242.5,121.2 239.0,125.8" fill="#8AA9DF"/><rect x="163.8" y="126.8" width="150.3" height="43.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="171.3" y="140.8" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">Penicilina cristalina, 2 a 4 milhões</text><text x="171.3" y="151.2" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">de unidades de 4 em 4 horas, ou</text><text x="171.3" y="161.6" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">oxacilina</text><polyline points="239.0,171.0 239.0,179.0" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="235.5,178.4 242.5,178.4 239.0,183.0" fill="#8AA9DF"/><rect x="163.8" y="184.0" width="150.3" height="32.8" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="171.3" y="198.0" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">Evoluiu mal? Amplia o espectro,</text><text x="171.3" y="208.4" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">como no grave</text><polyline points="402.3,27.0 402.3,39.0" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="398.8,38.5 405.8,38.5 402.3,43.0" fill="#8AA9DF"/><rect x="327.2" y="44.0" width="150.3" height="22.0" rx="7" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1"/><text x="402.3" y="58.5" font-family="Inter" font-weight="600" font-size="9.2" fill="#16315C" text-anchor="middle">Grave</text><polyline points="402.3,67.0 402.3,75.0" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="398.8,74.5 405.8,74.5 402.3,79.0" fill="#8AA9DF"/><rect x="327.2" y="80.0" width="150.3" height="22.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="334.7" y="94.0" font-family="Inter" font-weight="600" font-size="7.9" fill="#16315C" text-anchor="start">Amplia o espectro</text><polyline points="402.3,103.4 402.3,111.4" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="398.8,110.9 405.8,110.9 402.3,115.4" fill="#8AA9DF"/><rect x="327.2" y="116.4" width="150.3" height="32.8" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="334.7" y="130.4" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">Ceftriaxona ou ciprofloxacino, com</text><text x="334.7" y="140.8" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">clindamicina</text><polyline points="402.3,150.2 402.3,158.2" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="398.8,157.6 405.8,157.6 402.3,162.2" fill="#8AA9DF"/><rect x="327.2" y="163.2" width="150.3" height="53.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="334.7" y="177.2" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">Sem melhora: piperacilina com</text><text x="334.7" y="187.6" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">tazobactam; acima dela,</text><text x="334.7" y="198.0" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">vancomicina ou linezolida</text><polyline points="75.7,217.8 75.7,225.8" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="72.2,225.2 79.2,225.2 75.7,229.8" fill="#8AA9DF"/><polyline points="239.0,217.8 239.0,225.8" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="235.5,225.2 242.5,225.2 239.0,229.8" fill="#8AA9DF"/><polyline points="402.3,217.8 402.3,225.8" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="398.8,225.2 405.8,225.2 402.3,229.8" fill="#8AA9DF"/><rect x="0.5" y="230.8" width="477.0" height="42.8" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><text x="10.0" y="244.8" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Depois do antibiótico</text><text x="10.0" y="256.8" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">Infecção controlada, mas a perna segue vermelha, inchada e dolorida: corticoide. Depois, tratar a micose e a frieira</text><text x="10.0" y="267.2" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">(fluconazol).</text></svg>