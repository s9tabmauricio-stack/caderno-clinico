<svg xmlns="http://www.w3.org/2000/svg" width="478" height="255" viewBox="0 0 478 255"><rect x="26" y="10" width="158" height="14" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1"/><text x="33.0" y="19.8" font-family="Inter" font-weight="500" font-size="7.4" fill="#16315C" text-anchor="start">Epiderme</text><rect x="26" y="24" width="158" height="46" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><ellipse cx="122" cy="36" rx="5" ry="3.2" fill="#FFFFFF" stroke="#8AA9DF" stroke-width="1"/><ellipse cx="140" cy="40" rx="5" ry="3.2" fill="#FFFFFF" stroke="#8AA9DF" stroke-width="1"/><ellipse cx="158" cy="36" rx="5" ry="3.2" fill="#FFFFFF" stroke="#8AA9DF" stroke-width="1"/><ellipse cx="122" cy="60" rx="5" ry="3.2" fill="#FFFFFF" stroke="#8AA9DF" stroke-width="1"/><ellipse cx="140" cy="56" rx="5" ry="3.2" fill="#FFFFFF" stroke="#8AA9DF" stroke-width="1"/><text x="33.0" y="49.8" font-family="Inter" font-weight="500" font-size="7.4" fill="#16315C" text-anchor="start">Derme e linfáticos</text><rect x="26" y="70" width="158" height="50" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="118" cy="83" r="6.5" fill="none" stroke="#C3D8F8" stroke-width="1"/><circle cx="134" cy="83" r="6.5" fill="none" stroke="#C3D8F8" stroke-width="1"/><circle cx="150" cy="83" r="6.5" fill="none" stroke="#C3D8F8" stroke-width="1"/><circle cx="166" cy="83" r="6.5" fill="none" stroke="#C3D8F8" stroke-width="1"/><circle cx="126" cy="105" r="6.5" fill="none" stroke="#C3D8F8" stroke-width="1"/><circle cx="142" cy="105" r="6.5" fill="none" stroke="#C3D8F8" stroke-width="1"/><circle cx="158" cy="105" r="6.5" fill="none" stroke="#C3D8F8" stroke-width="1"/><text x="33.0" y="97.8" font-family="Inter" font-weight="500" font-size="7.4" fill="#16315C" text-anchor="start">Tecido subcutâneo</text><rect x="26" y="120" width="158" height="13" fill="#C3D8F8" stroke="#C3D8F8" stroke-width="1"/><text x="33.0" y="129.3" font-family="Inter" font-weight="500" font-size="7.4" fill="#16315C" text-anchor="start">Fáscia</text><rect x="26" y="133" width="158" height="58" fill="#E8F0FE" stroke="#C3D8F8" stroke-width="1"/><line x1="106" y1="142.7" x2="178" y2="142.7" stroke="#C3D8F8" stroke-width="1"/><line x1="106" y1="152.3" x2="178" y2="152.3" stroke="#C3D8F8" stroke-width="1"/><line x1="106" y1="162.0" x2="178" y2="162.0" stroke="#C3D8F8" stroke-width="1"/><line x1="106" y1="171.7" x2="178" y2="171.7" stroke="#C3D8F8" stroke-width="1"/><line x1="106" y1="181.3" x2="178" y2="181.3" stroke="#C3D8F8" stroke-width="1"/><text x="33.0" y="164.8" font-family="Inter" font-weight="500" font-size="7.4" fill="#16315C" text-anchor="start">Músculo</text><rect x="26.0" y="203.0" width="158.0" height="24.0" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1" stroke-dasharray="3 2"/><text x="33.0" y="217.8" font-family="Inter" font-weight="500" font-size="7.4" fill="#16315C" text-anchor="start">Circulação</text><polyline points="10.0,14.0 10.0,219.0" fill="none" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="6.5,220.4 13.5,220.4 10.0,225.0" fill="#8AA9DF"/><text x="0" y="0" font-family="Inter" font-weight="500" font-size="7.2" fill="#6C6C70" text-anchor="middle" transform="translate(5.5 118.5) rotate(-90)">mais fundo, mais grave</text><rect x="212.0" y="24.1" width="265.0" height="45.8" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="220.0" y="38.1" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Pele: erisipela</text><text x="220.0" y="50.1" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Começa na derme e nos linfáticos. Se a pele necrosa, é a erisipela</text><text x="220.0" y="60.5" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">necrotizante.</text><polyline points="186.0,47.0 204.0,47.0" fill="none" stroke="#8AA9DF" stroke-width="1.1"/><polygon points="205.8,43.8 205.8,50.2 210.0,47.0" fill="#8AA9DF"/><rect x="212.0" y="103.6" width="265.0" height="45.8" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="220.0" y="117.6" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Fáscia: fasciíte necrotizante</text><text x="220.0" y="129.6" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">A fáscia vira uma coisa liquefeita; os capilares trombosam e o corte</text><text x="220.0" y="140.0" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">não sangra.</text><polyline points="186.0,126.5 204.0,126.5" fill="none" stroke="#8AA9DF" stroke-width="1.1"/><polygon points="205.8,123.3 205.8,129.7 210.0,126.5" fill="#8AA9DF"/><rect x="212.0" y="155.4" width="265.0" height="45.8" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="220.0" y="169.4" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Músculo</text><text x="220.0" y="181.4" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">No caso da jovem de 20 anos, o músculo estava liquefeito: ela</text><text x="220.0" y="191.8" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">perdeu o compartimento anterior da perna.</text><polyline points="186.0,162.0 204.0,163.4" fill="none" stroke="#8AA9DF" stroke-width="1.1"/><polygon points="205.8,160.2 205.8,166.6 210.0,163.4" fill="#8AA9DF"/><rect x="212.0" y="207.2" width="265.0" height="45.8" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="220.0" y="221.2" font-family="Inter" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="start">Circulação: sepse</text><text x="220.0" y="233.2" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Na fasciíte, chega rápido, conforme a imunidade do paciente: na</text><text x="220.0" y="243.6" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">jovem, em 24 a 48 horas.</text><polyline points="186.0,215.0 204.0,215.2" fill="none" stroke="#8AA9DF" stroke-width="1.1"/><polygon points="205.8,212.0 205.8,218.4 210.0,215.2" fill="#8AA9DF"/></svg>