<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="211pt" viewBox="0 0 478 211"><rect x="0.0" y="0.0" width="478.0" height="25.1" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><text x="239.0" y="15.0" font-family="Inter SemiBold" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="middle" >Politraumatizado: considere lesão cervical em todos. Colar cervical (e prancha) até examinar.</text><line x1="76.3" y1="25.1" x2="76.3" y2="36.1" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="76.3,41.1 73.3,36.1 79.3,36.1" fill="#8AA9DF"/><rect x="0.0" y="41.1" width="152.7" height="35.1" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="76.3" y="55.7" font-family="Inter SemiBold" font-weight="600" font-size="8" fill="#1F2933" text-anchor="middle" >Acordado e orientado, sem dor à</text><text x="76.3" y="66.2" font-family="Inter SemiBold" font-weight="600" font-size="8" fill="#1F2933" text-anchor="middle" >palpação e sem déficit neurológico</text><line x1="239.0" y1="25.1" x2="239.0" y2="36.1" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="239.0,41.1 236.0,36.1 242.0,36.1" fill="#8AA9DF"/><rect x="162.7" y="41.1" width="152.7" height="35.1" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="239.0" y="55.7" font-family="Inter SemiBold" font-weight="600" font-size="8" fill="#1F2933" text-anchor="middle" >Confuso ou desorientado</text><line x1="401.7" y1="25.1" x2="401.7" y2="36.1" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="401.7,41.1 398.7,36.1 404.7,36.1" fill="#8AA9DF"/><rect x="325.3" y="41.1" width="152.7" height="35.1" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="401.7" y="55.7" font-family="Inter SemiBold" font-weight="600" font-size="8" fill="#1F2933" text-anchor="middle" >Dor cervical ou sintoma</text><text x="401.7" y="66.2" font-family="Inter SemiBold" font-weight="600" font-size="8" fill="#1F2933" text-anchor="middle" >neurológico</text><line x1="76.3" y1="76.2" x2="76.3" y2="87.2" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="76.3,92.2 73.3,87.2 79.3,87.2" fill="#8AA9DF"/><rect x="0.0" y="92.2" width="152.7" height="75.7" rx="7" fill="#E7F7EC" stroke="#BFE5CB" stroke-width="1"/><text x="76.3" y="127.1" font-family="Inter SemiBold" font-weight="600" font-size="8" fill="#1E7A34" text-anchor="middle" >Tira o colar e a prancha, com</text><text x="76.3" y="137.6" font-family="Inter SemiBold" font-weight="600" font-size="8" fill="#1E7A34" text-anchor="middle" >movimentação em bloco</text><line x1="239.0" y1="76.2" x2="239.0" y2="87.2" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="239.0,92.2 236.0,87.2 242.0,87.2" fill="#8AA9DF"/><rect x="162.7" y="92.2" width="152.7" height="35.1" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><line x1="239.0" y1="127.3" x2="239.0" y2="138.3" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="239.0,143.3 236.0,138.3 242.0,138.3" fill="#8AA9DF"/><text x="239.0" y="106.8" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="middle" >Exame de imagem mantendo o colar</text><line x1="401.7" y1="76.2" x2="401.7" y2="87.2" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="401.7,92.2 398.7,87.2 404.7,87.2" fill="#8AA9DF"/><rect x="325.3" y="92.2" width="152.7" height="35.1" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><line x1="401.7" y1="127.3" x2="401.7" y2="138.3" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="401.7,143.3 398.7,138.3 404.7,138.3" fill="#8AA9DF"/><text x="401.7" y="106.8" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="middle" >Tomografia direto</text><rect x="162.7" y="143.3" width="315.3" height="24.6" rx="7" fill="#E7F7EC" stroke="#BFE5CB" stroke-width="1"/><text x="320.3" y="157.9" font-family="Inter SemiBold" font-weight="600" font-size="8" fill="#1E7A34" text-anchor="middle" >Tomografia normal e Glasgow 15: tira o colar, mesmo com dor</text><rect x="0.0" y="177.9" width="478.0" height="32.6" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1" stroke-dasharray="3 2"/><text x="239.0" y="191.3" font-family="Inter" font-weight="400" font-size="7.8" fill="#6C6C70" text-anchor="middle" >Na dúvida, mantenha o colar. Tomografia normal e sintoma que persiste: ressonância (controversa no início) ou colar e</text><text x="239.0" y="201.6" font-family="Inter" font-weight="400" font-size="7.8" fill="#6C6C70" text-anchor="middle" >reavaliação.</text></svg>