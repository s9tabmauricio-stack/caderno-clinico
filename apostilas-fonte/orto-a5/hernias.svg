<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="168pt" viewBox="0 0 478 168"><ellipse cx="59.75" cy="92" rx="17" ry="11" fill="#F5F8FF" stroke="#8AA9DF" stroke-width="1.2"/><ellipse cx="59.75" cy="42" rx="44" ry="30" fill="#C3D8F8" stroke="#16315C" stroke-width="1.2"/><ellipse cx="59.75" cy="42" rx="19" ry="12" fill="#0B5BD3"/><text x="59.8" y="124.0" font-family="Inter SemiBold" font-weight="600" font-size="9" fill="#16315C" text-anchor="middle" >Disco normal</text><text x="59.8" y="136.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle" >Núcleo no centro, ânulo</text><text x="59.8" y="146.3" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle" >inteiro.</text><ellipse cx="179.25" cy="92" rx="17" ry="11" fill="#F5F8FF" stroke="#8AA9DF" stroke-width="1.2"/><ellipse cx="179.25" cy="64" rx="22" ry="14" fill="#C3D8F8" stroke="#16315C" stroke-width="1.2"/><ellipse cx="179.25" cy="42" rx="44" ry="30" fill="#C3D8F8" stroke="#16315C" stroke-width="1.2"/><ellipse cx="179.25" cy="64" rx="20.8" ry="12.8" fill="#C3D8F8"/><ellipse cx="179.25" cy="50" rx="19" ry="13" fill="#0B5BD3"/><text x="179.2" y="124.0" font-family="Inter SemiBold" font-weight="600" font-size="9" fill="#16315C" text-anchor="middle" >Protrusa</text><text x="179.2" y="136.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle" >Só abaula: o ânulo não se</text><text x="179.2" y="146.3" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle" >rompe.</text><ellipse cx="298.75" cy="92" rx="17" ry="11" fill="#F5F8FF" stroke="#8AA9DF" stroke-width="1.2"/><ellipse cx="298.75" cy="42" rx="44" ry="30" fill="#C3D8F8" stroke="#16315C" stroke-width="1.2"/><ellipse cx="298.75" cy="46" rx="18" ry="12" fill="#0B5BD3"/><rect x="292.75" y="50" width="12" height="26" fill="#0B5BD3"/><ellipse cx="298.75" cy="78" rx="12" ry="7" fill="#0B5BD3"/><text x="298.8" y="124.0" font-family="Inter SemiBold" font-weight="600" font-size="9" fill="#16315C" text-anchor="middle" >Extrusa</text><text x="298.8" y="136.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle" >O ânulo se rompe e o material</text><text x="298.8" y="146.3" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle" >sai; o corpo pode reabsorver.</text><ellipse cx="418.25" cy="92" rx="17" ry="11" fill="#F5F8FF" stroke="#8AA9DF" stroke-width="1.2"/><ellipse cx="418.25" cy="42" rx="44" ry="30" fill="#C3D8F8" stroke="#16315C" stroke-width="1.2"/><ellipse cx="418.25" cy="44" rx="17" ry="11" fill="#0B5BD3"/><rect x="413.25" y="66" width="10" height="8" fill="#FFFFFF"/><ellipse cx="444.25" cy="88" rx="8" ry="6" fill="#0B5BD3"/><text x="418.2" y="124.0" font-family="Inter SemiBold" font-weight="600" font-size="9" fill="#16315C" text-anchor="middle" >Sequestrada</text><text x="418.2" y="136.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle" >Um fragmento solta e migra</text><text x="418.2" y="146.3" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle" >para longe do disco.</text><text x="4.0" y="96.0" font-family="Inter" font-weight="400" font-size="6.8" fill="#6C6C70" text-anchor="start" >canal</text><text x="4.0" y="9.0" font-family="Inter" font-weight="400" font-size="6.8" fill="#6C6C70" text-anchor="start" >frente</text></svg>