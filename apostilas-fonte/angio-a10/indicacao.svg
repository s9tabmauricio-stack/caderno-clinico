220.2,68.0" fill="#8AA9DF"/><text x="217.2" y="99.0" font-family="Inter SemiBold" font-size="8.6" fill="#0B5BD3" text-anchor="middle">Mais de 2 cm</text><text x="217.2" y="111.5" font-family="Inter" font-size="7.6" fill="#3A3A3C" text-anchor="middle">de diâmetro</text><rect x="273.3" y="74.0" width="98.3" height="54.0" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><line x1="322.5" y1="66.0" x2="322.5" y2="68.0" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="322.5,73.0 319.5,68.0 325.5,68.0" fill="#8AA9DF"/><text x="322.5" y="89.0" font-family="Inter SemiBold" font-size="8.6" fill="#0B5BD3" text-anchor="middle">Trombo mural</text><text x="322.5" y="101.5" font-family="Inter" font-size="7.6" fill="#3A3A3C" text-anchor="middle">com qualquer diâmetro</text><text x="322.5" y="111.5" font-family="Inter" font-size="7.6" fill="#3A3A3C" text-anchor="middle">(só vale para a</text><text x="322.5" y="121.5" font-family="Inter" font-size="7.6" fill="#3A3A3C" text-anchor="middle">poplítea)</text><rect x="378.7" y="74.0" width="98.3" height="54.0" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><line x1="427.8" y1="66.0" x2="427.8" y2="68.0" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="427.8,73.0 424.8,68.0 430.8,68.0" fill="#8AA9DF"/><text x="427.8" y="94.0" font-family="Inter SemiBold" font-size="8.6" fill="#0B5BD3" text-anchor="middle">Saída ruim</text><text x="427.8" y="106.5" font-family="Inter" font-size="7.6" fill="#3A3A3C" text-anchor="middle">poucas artérias abaixo</text><text x="427.8" y="116.5" font-family="Inter" font-size="7.6" fill="#3A3A3C" text-anchor="middle">do joelho</text><line x1="76.0" y1="128.0" x2="76.0" y2="140.0" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="76.0,145.0 73.0,140.0 79.0,140.0" fill="#8AA9DF"/><rect x="1.0" y="146.0" width="150.0" height="40.0" rx="9" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1.2"/><text x="76.0" y="162.0" font-family="Inter SemiBold" font-size="9.4" fill="#0B5BD3" text-anchor=