<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="334pt" viewBox="0 0 478 334"><rect x="1.0" y="4.0" width="147.3" height="22.0" rx="11" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><text x="74.7" y="18.8" font-family="Inter SemiBold" font-size="8.8" fill="#16315C" text-anchor="middle">Aneurisma de poplítea</text><line x1="150.3" y1="15.0" x2="158.3" y2="15.0" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="163.3,15.0 158.3,18.0 158.3,12.0" fill="#8AA9DF"/><rect x="1.0" y="34.0" width="147.3" height="64.0" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="16.0" cy="60.0" r="8.5" fill="#0B5BD3"/><text x="16.0" y="62.9" font-family="Inter SemiBold" font-size="8" fill="#FFFFFF" text-anchor="middle">1</text><text x="31.0" y="63.2" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="start">Poplítea × aorta</text><text x="31.0" y="76.2" font-family="Inter" font-size="8.2" fill="#4F5B70" text-anchor="start">trombosa em vez de romper</text><line x1="74.7" y1="100.0" x2="74.7" y2="105.0" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="74.7,110.0 71.7,105.0 77.7,105.0" fill="#8AA9DF"/><rect x="1.0" y="112.0" width="147.3" height="64.0" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="16.0" cy="132.6" r="8.5" fill="#0B5BD3"/><text x="16.0" y="135.5" font-family="Inter SemiBold" font-size="8" fill="#FFFFFF" text-anchor="middle">2</text><text x="31.0" y="135.8" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="start">Clínica e exames</text><text x="31.0" y="148.8" font-family="Inter" font-size="8.2" fill="#4F5B70" text-anchor="start">massa pulsátil, dedo azul,</text><text x="31.0" y="159.8" font-family="Inter" font-size="8.2" fill="#4F5B70" text-anchor="start">Doppler</text><line x1="74.7" y1="178.0" x2="74.7" y2="183.0" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="74.7,188.0 71.7,183.0 77.7,183.0" fill="#8AA9DF"/><rect x="1.0" y="190.0" width="147.3" height="64.0" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="16.0" cy="210.6" r="8.5" fill="#0B5BD3"/><text x="16.0" y="213.5" font-family="Inter SemiBold" font-size="8" fill="#FFFFFF" text-anchor="middle">3</text><text x="31.0" y="213.8" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="start">Quando operar</text><text x="31.0" y="226.8" font-family="Inter" font-size="8.2" fill="#4F5B70" text-anchor="start">sintoma, mais de 2 cm,</text><text x="31.0" y="237.8" font-family="Inter" font-size="8.2" fill="#4F5B70" text-anchor="start">trombo mural</text><line x1="74.7" y1="256.0" x2="74.7" y2="261.0" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="74.7,266.0 71.7,261.0 77.7,261.0" fill="#8AA9DF"/><rect x="1.0" y="268.0" width="147.3" height="64.0" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="16.0" cy="288.6" r="8.5" fill="#0B5BD3"/><text x="16.0" y="291.4" font-family="Inter SemiBold" font-size="8" fill="#FFFFFF" text-anchor="middle">4</text><text x="31.0" y="291.8" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="start">Como operar</text><text x="31.0" y="304.8" font-family="Inter" font-size="8.2" fill="#4F5B70" text-anchor="start">ponte com safena ou</text><text x="31.0" y="315.8" font-family="Inter" font-size="8.2" fill="#4F5B70" text-anchor="start">endoprótese</text><rect x="165.3" y="4.0" width="147.3" height="22.0" rx="11" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><text x="239.0" y="18.8" font-family="Inter SemiBold" font-size="8.8" fill="#16315C" text-anchor="middle">Hipertensão renovascular</text><line x1="314.7" y1="15.0" x2="322.7" y2="15.0" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="327.7,15.0 322.7,18.0 322.7,12.0" fill="#8AA9DF"/><rect x="165.3" y="34.0" width="147.3" height="142.0" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="180.3" cy="93.5" r="8.5" fill="#0B5BD3"/><text x="180.3" y="96.5" font-family="Inter SemiBold" font-size="8" fill="#FFFFFF" text-anchor="middle">5</text><text x="195.3" y="96.8" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="start">Suspeita e causas</text><text x="195.3" y="109.8" font-family="Inter" font-size="8.2" fill="#4F5B70" text-anchor="start">jovem hipertenso;</text><text x="195.3" y="120.8" font-family="Inter" font-size="8.2" fill="#4F5B70" text-anchor="start">aterosclerose ou displasia</text><line x1="239.0" y1="178.0" x2="239.0" y2="183.0" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="239.0,188.0 236.0,183.0 242.0,183.0" fill="#8AA9DF"/><rect x="165.3" y="190.0" width="147.3" height="142.0" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="180.3" cy="249.6" r="8.5" fill="#0B5BD3"/><text x="180.3" y="252.5" font-family="Inter SemiBold" font-size="8" fill="#FFFFFF" text-anchor="middle">6</text><text x="195.3" y="252.8" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="start">Exames e conduta</text><text x="195.3" y="265.8" font-family="Inter" font-size="8.2" fill="#4F5B70" text-anchor="start">Doppler; balão com ou sem</text><text x="195.3" y="276.8" font-family="Inter" font-size="8.2" fill="#4F5B70" text-anchor="start">stent</text><rect x="329.7" y="4.0" width="147.3" height="22.0" rx="11" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><text x="403.3" y="18.8" font-family="Inter SemiBold" font-size="8.8" fill="#16315C" text-anchor="middle">Isquemia intestinal</text><rect x="329.7" y="34.0" width="147.3" height="90.0" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="344.7" cy="67.5" r="8.5" fill="#0B5BD3"/><text x="344.7" y="70.5" font-family="Inter SemiBold" font-size="8" fill="#FFFFFF" text-anchor="middle">7</text><text x="359.7" y="70.8" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="start">Isquemia aguda</text><text x="359.7" y="83.8" font-family="Inter" font-size="8.2" fill="#4F5B70" text-anchor="start">êmbolo ou trombo; o tempo</text><text x="359.7" y="94.8" font-family="Inter" font-size="8.2" fill="#4F5B70" text-anchor="start">decide</text><line x1="403.3" y1="126.0" x2="403.3" y2="131.0" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="403.3,136.0 400.3,131.0 406.3,131.0" fill="#8AA9DF"/><rect x="329.7" y="138.0" width="147.3" height="90.0" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="344.7" cy="177.1" r="8.5" fill="#0B5BD3"/><text x="344.7" y="180.0" font-family="Inter SemiBold" font-size="8" fill="#FFFFFF" text-anchor="middle">8</text><text x="359.7" y="180.2" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="start">Trombose venosa</text><text x="359.7" y="193.2" font-family="Inter" font-size="8.2" fill="#4F5B70" text-anchor="start">anticoagulante</text><line x1="403.3" y1="230.0" x2="403.3" y2="235.0" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="403.3,240.0 400.3,235.0 406.3,235.0" fill="#8AA9DF"/><rect x="329.7" y="242.0" width="147.3" height="90.0" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="344.7" cy="275.6" r="8.5" fill="#0B5BD3"/><text x="344.7" y="278.4" font-family="Inter SemiBold" font-size="8" fill="#FFFFFF" text-anchor="middle">9</text><text x="359.7" y="278.8" font-family="Inter SemiBold" font-size="9.4" fill="#16315C" text-anchor="start">Isquemia crônica</text><text x="359.7" y="291.8" font-family="Inter" font-size="8.2" fill="#4F5B70" text-anchor="start">come, dói: claudicação</text><text x="359.7" y="302.8" font-family="Inter" font-size="8.2" fill="#4F5B70" text-anchor="start">intestinal</text></svg>