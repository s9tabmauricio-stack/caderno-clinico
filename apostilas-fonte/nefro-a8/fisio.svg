<text x="239.0" y="16.8" font-family="Inter" font-size="8.8" font-weight="600" fill="#16315C" text-anchor="middle">Glicose em excesso filtrada pelo glomérulo</text>
<polyline points="239.0,26.6 239.0,36.6" fill="none" stroke="#8AA9DF" stroke-width="1.6"/>
<polyline points="110.0,36.6 368.0,36.6" fill="none" stroke="#8AA9DF" stroke-width="1.6"/>
<line x1="110.0" y1="36.6" x2="110.0" y2="45.6" stroke="#8AA9DF" stroke-width="1.6"/>
<polygon points="106.0,44.6 114.0,44.6 110.0,50.6" fill="#8AA9DF"/>
<line x1="368.0" y1="36.6" x2="368.0" y2="45.6" stroke="#8AA9DF" stroke-width="1.6"/>
<polygon points="364.0,44.6 372.0,44.6 368.0,50.6" fill="#8AA9DF"/>
<rect x="0.0" y="51.6" width="220.0" height="35.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="110.0" y="65.4" font-family="Inter" font-size="8.8" font-weight="600" fill="#16315C" text-anchor="middle">Glomérulo inflamado</text>
<text x="110.0" y="78.8" font-family="Inter" font-size="8.4" font-weight="400" fill="#1F2933" text-anchor="middle">pelos polióis e pela própria glicose</text>
<rect x="258.0" y="51.6" width="220.0" height="35.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="368.0" y="65.4" font-family="Inter" font-size="8.8" font-weight="600" fill="#16315C" text-anchor="middle">Arteríolas do glomérulo lesadas</text>
<text x="368.0" y="78.8" font-family="Inter" font-size="8.4" font-weight="400" fill="#1F2933" text-anchor="middle">o açúcar lesa a parede dos vasos pequenos</text>
<line x1="110.0" y1="87.7" x2="110.0" y2="93.7" stroke="#8AA9DF" stroke-width="1.6"/>
<polygon points="106.0,92.7 114.0,92.7 110.0,98.7" fill="#8AA9DF"/>
<line x1="368.0" y1="87.7" x2="368.0" y2="93.7" stroke="#8AA9DF" stroke-width="1.6"/>
<polygon points="364.0,92.7 372.0,92.7 368.0,98.7" fill="#8AA9DF"/>
<rect x="0.0" y="99.7" width="220.0" height="35.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="110.0" y="113.5" font-family="Inter" font-size="8.8" font-weight="600" fill="#16315C" text-anchor="middle">Os podócitos se abrem</text>
<text x="110.0" y="126.8" font-family="Inter" font-size="8.4" font-weight="400" fill="#1F2933" text-anchor="middle">os poros do filtro ficam maiores</text>
<rect x="258.0" y="99.7" width="220.0" height="35.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="368.0" y="113.5" font-family="Inter" font-size="8.8" font-weight="600" fill="#16315C" text-anchor="middle">Esclerose glomerular</text>
<text x="368.0" y="126.8" font-family="Inter" font-size="8.4" font-weight="400" fill="#1F2933" text-anchor="middle">o glomérulo endurece e cicatriza</text>
<line x1="110.0" y1="135.7" x2="110.0" y2="141.7" stroke="#8AA9DF" stroke-width="1.6"/>
<polygon points="106.0,140.7 114.0,140.7 110.0,146.7" fill="#8AA9DF"/>
<line x1="368.0" y1="135.7" x2="368.0" y2="141.7" stroke="#8AA9DF" stroke-width="1.6"/>
<polygon points="364.0,140.7 372.0,140.7 368.0,146.7" fill="#8AA9DF"/>
<rect x="0.0" y="147.7" width="220.0" height="35.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="110.0" y="161.5" font-family="Inter" font-size="8.8" font-weight="600" fill="#16315C" text-anchor="middle">Perda de proteína</text>
<text x="110.0" y="174.9" font-family="Inter" font-size="8.4" font-weight="400" fill="#1F2933" text-anchor="middle">proteinúria (no começo, microalbuminúria)</text>
<rect x="258.0" y="147.7" width="220.0" height="35.0" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="368.0" y="161.5" font-family="Inter" font-size="8.8" font-weight="600" fill="#16315C" text-anchor="middle">Hipertensão</text>
<text x="368.0" y="174.9" font-family="Inter" font-size="8.4" font-weight="400" fill="#1F2933" text-anchor="middle">a pressão arterial sobe</text>
<polyline points="110.0,183.7 110.0,193.7 368.0,193.7 368.0,183.7" fill="none" stroke="#8AA9DF" stroke-width="1.6"/>
<line x1="239.0" y1="193.7" x2="239.0" y2="200.7" stroke="#8AA9DF" stroke-width="1.6"/>
<polygon points="235.0,199.7 243.0,199.7 239.0,205.7" fill="#8AA9DF"/>
<rect x="39.0" y="206.7" width="400.0" height="37.0" rx="8" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/>
<text x="239.0" y="221.5" font-family="Inter" font-size="8.8" font-weight="600" fill="#16315C" text-anchor="middle">Proteinúria e hipertensão juntas</text>
<text x="239.0" y="234.9" font-family="Inter" font-size="8.4" font-weight="400" fill="#1F2933" text-anchor="middle">a doença do diabetes é essencialmente vascular</text>
</svg>
