<text x="113.0" y="115.9" font-family="Inter" font-size="8.8" font-weight="600" fill="#1E7A34" text-anchor="middle">Pode manter o remédio</text>
<text x="113.0" y="129.3" font-family="Inter" font-size="8.4" font-weight="400" fill="#1F2933" text-anchor="middle">e tratar a infecção</text>
