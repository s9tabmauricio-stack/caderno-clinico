<text x="365.0" y="57.4" font-family="Inter" font-size="8.8" font-weight="600" fill="#16315C" text-anchor="middle">Sinais de infecção sistêmica</text>
<text x="365.0" y="70.8" font-family="Inter" font-size="8.4" font-weight="400" fill="#1F2933" text-anchor="middle">febre, taquicardia, enchimento capilar diminuído,</text>
<text x="365.0" y="82.2" font-family="Inter" font-size="8.4" font-weight="400" fill="#1F2933" text-anchor="middle">palidez</text>
