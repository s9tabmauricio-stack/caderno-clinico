<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="126pt" viewBox="0 0 478 126">
<rect x="0.0" y="2.0" width="109.0" height="52.2" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<circle cx="14.0" cy="16.0" r="8" fill="#0B5BD3"/>
<text x="14.0" y="19.2" font-family="Inter" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="27.0" y="19.4" font-family="Inter" font-size="8.8" font-weight="600" fill="#16315C" text-anchor="start">Glomérulo</text>
<text x="7.0" y="34.0" font-family="Inter" font-size="7.8" font-weight="400" fill="#3A3A3C" text-anchor="start">o açúcar abre o filtro e</text>
<text x="7.0" y="44.6" font-family="Inter" font-size="7.8" font-weight="400" fill="#3A3A3C" text-anchor="start">lesa as arteríolas</text>
<rect x="123.0" y="2.0" width="109.0" height="52.2" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<circle cx="137.0" cy="16.0" r="8" fill="#0B5BD3"/>
<text x="137.0" y="19.2" font-family="Inter" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="150.0" y="19.4" font-family="Inter" font-size="8.8" font-weight="600" fill="#16315C" text-anchor="start">Quem adoece</text>
<text x="130.0" y="34.0" font-family="Inter" font-size="7.8" font-weight="400" fill="#3A3A3C" text-anchor="start">epidemia, custo e risco</text>
<text x="130.0" y="44.6" font-family="Inter" font-size="7.8" font-weight="400" fill="#3A3A3C" text-anchor="start">de morte</text>
<rect x="246.0" y="2.0" width="109.0" height="52.2" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<circle cx="260.0" cy="16.0" r="8" fill="#0B5BD3"/>
<text x="260.0" y="19.2" font-family="Inter" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="273.0" y="19.4" font-family="Inter" font-size="8.8" font-weight="600" fill="#16315C" text-anchor="start">Três fases</text>
<text x="253.0" y="34.0" font-family="Inter" font-size="7.8" font-weight="400" fill="#3A3A3C" text-anchor="start">incipiente, clínica e</text>
<text x="253.0" y="44.6" font-family="Inter" font-size="7.8" font-weight="400" fill="#3A3A3C" text-anchor="start">doença renal crônica</text>
<rect x="369.0" y="2.0" width="109.0" height="52.2" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<circle cx="383.0" cy="16.0" r="8" fill="#0B5BD3"/>
<text x="383.0" y="19.2" font-family="Inter" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="396.0" y="19.4" font-family="Inter" font-size="8.8" font-weight="600" fill="#16315C" text-anchor="start">Fatores de risco</text>
<text x="376.0" y="34.0" font-family="Inter" font-size="7.8" font-weight="400" fill="#3A3A3C" text-anchor="start">glicose, pressão,</text>
<text x="376.0" y="44.6" font-family="Inter" font-size="7.8" font-weight="400" fill="#3A3A3C" text-anchor="start">proteína, sal, herança</text>
<rect x="0.0" y="72.2" width="109.0" height="52.2" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<circle cx="14.0" cy="86.2" r="8" fill="#0B5BD3"/>
<text x="14.0" y="89.4" font-family="Inter" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="27.0" y="89.6" font-family="Inter" font-size="8.8" font-weight="600" fill="#16315C" text-anchor="start">Diagnóstico</text>
<text x="7.0" y="104.2" font-family="Inter" font-size="7.8" font-weight="400" fill="#3A3A3C" text-anchor="start">microalbuminúria e o que</text>
<text x="7.0" y="114.8" font-family="Inter" font-size="7.8" font-weight="400" fill="#3A3A3C" text-anchor="start">confunde</text>
<rect x="123.0" y="72.2" width="109.0" height="52.2" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<circle cx="137.0" cy="86.2" r="8" fill="#0B5BD3"/>
<text x="137.0" y="89.4" font-family="Inter" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="150.0" y="89.6" font-family="Inter" font-size="8.8" font-weight="600" fill="#16315C" text-anchor="start">Metas e dieta</text>
<text x="130.0" y="104.2" font-family="Inter" font-size="7.8" font-weight="400" fill="#3A3A3C" text-anchor="start">pressão, cigarro,</text>
<text x="130.0" y="114.8" font-family="Inter" font-size="7.8" font-weight="400" fill="#3A3A3C" text-anchor="start">colesterol, proteína</text>
<rect x="246.0" y="72.2" width="109.0" height="52.2" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<circle cx="260.0" cy="86.2" r="8" fill="#0B5BD3"/>
<text x="260.0" y="89.4" font-family="Inter" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="273.0" y="89.6" font-family="Inter" font-size="8.8" font-weight="600" fill="#16315C" text-anchor="start">Remédios</text>
<text x="253.0" y="104.2" font-family="Inter" font-size="7.8" font-weight="400" fill="#3A3A3C" text-anchor="start">bloqueio da angiotensina,</text>
<text x="253.0" y="114.8" font-family="Inter" font-size="7.8" font-weight="400" fill="#3A3A3C" text-anchor="start">gliflozinas, finerenona</text>
<rect x="369.0" y="72.2" width="109.0" height="52.2" rx="9" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<circle cx="383.0" cy="86.2" r="8" fill="#0B5BD3"/>
<text x="383.0" y="89.4" font-family="Inter" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="396.0" y="89.6" font-family="Inter" font-size="8.8" font-weight="600" fill="#16315C" text-anchor="start">Outras doenças</text>
<text x="376.0" y="104.2" font-family="Inter" font-size="7.8" font-weight="400" fill="#3A3A3C" text-anchor="start">infecção, Candida e</text>
<text x="376.0" y="114.8" font-family="Inter" font-size="7.8" font-weight="400" fill="#3A3A3C" text-anchor="start">bexiga neurogênica</text>
