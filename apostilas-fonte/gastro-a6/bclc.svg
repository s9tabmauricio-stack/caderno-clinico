<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="196pt" viewBox="0 0 478 196"><rect x="0.5" y="1.0" width="111.0" height="65.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="7.0" y="16.3" font-family="Inter SemiBold" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Inicial (0 e A)</text><text x="7.0" y="28.0" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">nódulo único ou até 3</text><text x="7.0" y="38.0" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">nódulos de até 3 cm; função</text><text x="7.0" y="47.9" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">do fígado preservada;</text><text x="7.0" y="57.8" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">paciente ativo</text><line x1="56.0" y1="67.6" x2="56.0" y2="75.4" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="51.8,74.4 60.2,74.4 56.0,79.6" fill="#8AA9DF"/><rect x="0.5" y="80.6" width="111.0" height="76.2" rx="7" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1"/><text x="7.0" y="95.9" font-family="Inter SemiBold" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Ressecção, transplante</text><text x="7.0" y="106.5" font-family="Inter SemiBold" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">ou ablação</text><text x="7.0" y="118.2" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">ressecção só sem</text><text x="7.0" y="128.2" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">hipertensão portal;</text><text x="7.0" y="138.1" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">transplante dentro dos</text><text x="7.0" y="148.0" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">critérios de Milão</text><rect x="0.5" y="162.8" width="111.0" height="32.3" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1" stroke-dasharray="3 2"/><text x="7.0" y="176.8" font-family="Inter" font-weight="400" font-size="7.0" fill="#1F2933" text-anchor="start">Intenção de cura: sobrevida</text><text x="7.0" y="186.4" font-family="Inter" font-weight="400" font-size="7.0" fill="#1F2933" text-anchor="start">em 5 anos de 40 a 70%</text><rect x="122.5" y="1.0" width="111.0" height="65.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="129.0" y="16.3" font-family="Inter SemiBold" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Intermediário (B)</text><text x="129.0" y="28.0" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">vários nódulos; função</text><text x="129.0" y="38.0" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">preservada; paciente ativo</text><line x1="178.0" y1="67.6" x2="178.0" y2="75.4" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="173.8,74.4 182.2,74.4 178.0,79.6" fill="#8AA9DF"/><rect x="122.5" y="80.6" width="111.0" height="76.2" rx="7" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1"/><text x="129.0" y="95.9" font-family="Inter SemiBold" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Quimioembolização</text><text x="129.0" y="107.6" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">quimioterápico injetado pela</text><text x="129.0" y="117.5" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">artéria que nutre o nódulo</text><rect x="122.5" y="162.8" width="111.0" height="32.3" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1" stroke-dasharray="3 2"/><text x="129.0" y="176.8" font-family="Inter" font-weight="400" font-size="7.0" fill="#1F2933" text-anchor="start">Paliativo: sobrevida em 3</text><text x="129.0" y="186.4" font-family="Inter" font-weight="400" font-size="7.0" fill="#1F2933" text-anchor="start">anos de 10 a 40%</text><rect x="244.5" y="1.0" width="111.0" height="65.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="251.0" y="16.3" font-family="Inter SemiBold" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Avançado (C)</text><text x="251.0" y="28.0" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">invasão da veia porta ou</text><text x="251.0" y="38.0" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">doença fora do fígado;</text><text x="251.0" y="47.9" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">função preservada</text><line x1="300.0" y1="67.6" x2="300.0" y2="75.4" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="295.8,74.4 304.2,74.4 300.0,79.6" fill="#8AA9DF"/><rect x="244.5" y="80.6" width="111.0" height="76.2" rx="7" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1"/><text x="251.0" y="95.9" font-family="Inter SemiBold" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Quimioterapia oral</text><text x="251.0" y="107.6" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">sorafenibe</text><rect x="244.5" y="162.8" width="111.0" height="32.3" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1" stroke-dasharray="3 2"/><text x="251.0" y="176.8" font-family="Inter" font-weight="400" font-size="7.0" fill="#1F2933" text-anchor="start">Paliativo: sobrevida em 3</text><text x="251.0" y="186.4" font-family="Inter" font-weight="400" font-size="7.0" fill="#1F2933" text-anchor="start">anos de 10 a 40%</text><rect x="366.5" y="1.0" width="111.0" height="65.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="373.0" y="16.3" font-family="Inter SemiBold" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Terminal (D)</text><text x="373.0" y="28.0" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">fígado em falência ou</text><text x="373.0" y="38.0" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">paciente acamado, sem</text><text x="373.0" y="47.9" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">condições</text><line x1="422.0" y1="67.6" x2="422.0" y2="75.4" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="417.8,74.4 426.2,74.4 422.0,79.6" fill="#8AA9DF"/><rect x="366.5" y="80.6" width="111.0" height="76.2" rx="7" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1"/><text x="373.0" y="95.9" font-family="Inter SemiBold" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Cuidados paliativos</text><text x="373.0" y="107.6" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">controle de sintomas</text><rect x="366.5" y="162.8" width="111.0" height="32.3" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1" stroke-dasharray="3 2"/><text x="373.0" y="176.8" font-family="Inter" font-weight="400" font-size="7.0" fill="#1F2933" text-anchor="start">Sintomático: sobrevida em 1</text><text x="373.0" y="186.4" font-family="Inter" font-weight="400" font-size="7.0" fill="#1F2933" text-anchor="start">ano abaixo de 20%</text></svg>