<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="226pt" viewBox="0 0 478 226"><rect x="59.0" y="0.5" width="360.0" height="40.0" rx="7" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1"/><text x="239.0" y="17.4" font-family="Inter SemiBold" font-weight="600" font-size="9.4" fill="#16315C" text-anchor="middle">Hipertensão portal</text><text x="239.0" y="30.0" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="middle">o fígado endurecido freia o sangue; a pressão na veia porta passa de 12 mmHg</text><rect x="0.0" y="62.0" width="150.0" height="46.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="7.0" y="77.4" font-family="Inter SemiBold" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Capilares do peritônio</text><text x="7.0" y="89.3" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">a pressão alta empurra líquido para</text><text x="7.0" y="99.6" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">fora dos vasos</text><line x1="75.0" y1="109.4" x2="75.0" y2="115.2" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="70.8,114.2 79.2,114.2 75.0,119.4" fill="#8AA9DF"/><rect x="0.0" y="120.4" width="150.0" height="46.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="7.0" y="135.8" font-family="Inter SemiBold" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Líquido no abdome</text><text x="7.0" y="147.7" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">transudato: pouca proteína e poucas</text><text x="7.0" y="157.9" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">células</text><line x1="75.0" y1="167.7" x2="75.0" y2="173.5" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="70.8,172.5 79.2,172.5 75.0,177.7" fill="#8AA9DF"/><rect x="0.0" y="178.7" width="150.0" height="46.4" rx="7" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1"/><text x="7.0" y="194.1" font-family="Inter SemiBold" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Ascite</text><text x="7.0" y="206.1" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">a complicação mais comum;</text><text x="7.0" y="216.3" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">infectada, vira peritonite</text><rect x="164.0" y="62.0" width="150.0" height="46.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="171.0" y="77.4" font-family="Inter SemiBold" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Sangue desvia do fígado</text><text x="171.0" y="89.3" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">abre caminhos colaterais para voltar</text><text x="171.0" y="99.6" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">ao coração</text><line x1="239.0" y1="109.4" x2="239.0" y2="115.2" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="234.8,114.2 243.2,114.2 239.0,119.4" fill="#8AA9DF"/><rect x="164.0" y="120.4" width="150.0" height="46.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="171.0" y="135.8" font-family="Inter SemiBold" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Veias dilatadas</text><text x="171.0" y="147.7" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">varizes do esôfago e do estômago,</text><text x="171.0" y="157.9" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">cabeça de medusa, hemorroidas</text><line x1="239.0" y1="167.7" x2="239.0" y2="173.5" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="234.8,172.5 243.2,172.5 239.0,177.7" fill="#8AA9DF"/><rect x="164.0" y="178.7" width="150.0" height="46.4" rx="7" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1"/><text x="171.0" y="194.1" font-family="Inter SemiBold" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Amônia chega ao cérebro</text><text x="171.0" y="206.1" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">as toxinas do intestino escapam da</text><text x="171.0" y="216.3" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">limpeza do fígado: encefalopatia</text><rect x="328.0" y="62.0" width="150.0" height="46.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="335.0" y="77.4" font-family="Inter SemiBold" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Veia esplênica</text><text x="335.0" y="89.3" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">a pressão passa para a veia do baço</text><line x1="403.0" y1="109.4" x2="403.0" y2="115.2" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="398.8,114.2 407.2,114.2 403.0,119.4" fill="#8AA9DF"/><rect x="328.0" y="120.4" width="150.0" height="46.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="335.0" y="135.8" font-family="Inter SemiBold" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Baço grande</text><text x="335.0" y="147.7" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">esplenomegalia e hiperesplenismo: o</text><text x="335.0" y="157.9" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">baço sequestra células</text><line x1="403.0" y1="167.7" x2="403.0" y2="173.5" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="398.8,172.5 407.2,172.5 403.0,177.7" fill="#8AA9DF"/><rect x="328.0" y="178.7" width="150.0" height="46.4" rx="7" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1"/><text x="335.0" y="194.1" font-family="Inter SemiBold" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Sangue com menos células</text><text x="335.0" y="206.1" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">anemia, leucopenia e plaquetopenia</text><line x1="239.0" y1="41.0" x2="239.0" y2="51.0" stroke="#8AA9DF" stroke-width="1.6"/><line x1="75.0" y1="51.0" x2="403.0" y2="51.0" stroke="#8AA9DF" stroke-width="1.6"/><line x1="75.0" y1="51.0" x2="75.0" y2="56.8" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="70.8,55.8 79.2,55.8 75.0,61.0" fill="#8AA9DF"/><line x1="239.0" y1="51.0" x2="239.0" y2="56.8" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="234.8,55.8 243.2,55.8 239.0,61.0" fill="#8AA9DF"/><line x1="403.0" y1="51.0" x2="403.0" y2="56.8" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="398.8,55.8 407.2,55.8 403.0,61.0" fill="#8AA9DF"/></svg>