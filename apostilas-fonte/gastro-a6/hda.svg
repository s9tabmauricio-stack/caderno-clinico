<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="337pt" viewBox="0 0 478 337"><rect x="0.5" y="1.0" width="477.0" height="36.6" rx="7" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1"/><text x="239.0" y="16.6" font-family="Inter SemiBold" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="middle">Cirrótico sangrando por varizes</text><text x="239.0" y="28.7" font-family="Inter" font-weight="400" font-size="7.5" fill="#1F2933" text-anchor="middle">vomita sangue ou evacua sangue escuro; pode estar confuso e aspirar o vômito</text><line x1="239.0" y1="38.6" x2="239.0" y2="47.4" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="234.8,46.4 243.2,46.4 239.0,51.6" fill="#8AA9DF"/><rect x="0.5" y="52.6" width="477.0" height="36.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="239.0" y="68.2" font-family="Inter SemiBold" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="middle">1. Estabilizar como no trauma</text><text x="239.0" y="80.3" font-family="Inter" font-weight="400" font-size="7.5" fill="#1F2933" text-anchor="middle">reposição de volume se necessário, oxigênio e proteção da via aérea; sangue, plaquetas e fatores de coagulação que faltarem</text><line x1="239.0" y1="90.1" x2="239.0" y2="98.9" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="234.8,97.9 243.2,97.9 239.0,103.1" fill="#8AA9DF"/><rect x="0.5" y="104.1" width="477.0" height="46.9" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="239.0" y="119.7" font-family="Inter SemiBold" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="middle">2. Droga vasoativa e antibiótico</text><text x="239.0" y="131.8" font-family="Inter" font-weight="400" font-size="7.5" fill="#1F2933" text-anchor="middle">octreotide (no slide também terlipressina e somatostatina) para baixar a pressão nas varizes; antibiótico para evitar a peritonite e</text><text x="239.0" y="142.2" font-family="Inter" font-weight="400" font-size="7.5" fill="#1F2933" text-anchor="middle">outras infecções</text><line x1="239.0" y1="152.0" x2="239.0" y2="158.5" stroke="#8AA9DF" stroke-width="1.6"/><rect x="0.5" y="166.0" width="289.0" height="46.9" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="145.0" y="181.6" font-family="Inter SemiBold" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="middle">3. Estável: endoscopia</text><text x="145.0" y="193.7" font-family="Inter" font-weight="400" font-size="7.5" fill="#1F2933" text-anchor="middle">tratamento definitivo do ponto que sangra</text><rect x="308.0" y="166.0" width="169.5" height="46.9" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="393.0" y="181.6" font-family="Inter SemiBold" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="middle">Instável ou sem controle</text><text x="393.0" y="193.7" font-family="Inter" font-weight="400" font-size="7.5" fill="#1F2933" text-anchor="middle">balão de Sengstaken-Blakemore na terapia</text><text x="393.0" y="204.1" font-family="Inter" font-weight="400" font-size="7.5" fill="#1F2933" text-anchor="middle">intensiva, só por 24 a 48 horas</text><line x1="239.0" y1="158.5" x2="393.0" y2="158.5" stroke="#8AA9DF" stroke-width="1.6"/><line x1="393.0" y1="158.5" x2="393.0" y2="160.8" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="388.8,159.8 397.2,159.8 393.0,165.0" fill="#8AA9DF"/><line x1="239.0" y1="158.5" x2="145.0" y2="158.5" stroke="#8AA9DF" stroke-width="1.6"/><line x1="145.0" y1="158.5" x2="145.0" y2="160.8" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="140.8,159.8 149.2,159.8 145.0,165.0" fill="#8AA9DF"/><rect x="0.5" y="227.9" width="139.0" height="56.5" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="7.5" y="243.2" font-family="Inter SemiBold" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Varizes do esôfago</text><text x="7.5" y="255.2" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">ligadura elástica: o endoscopista</text><text x="7.5" y="265.4" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">laça a variz com um anel de</text><text x="7.5" y="275.6" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">borracha</text><rect x="151.0" y="227.9" width="139.0" height="56.5" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="158.0" y="243.2" font-family="Inter SemiBold" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Varizes do fundo gástrico</text><text x="158.0" y="255.2" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">cianoacrilato: uma cola, como a de</text><text x="158.0" y="265.4" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">secagem rápida, que fecha a variz</text><rect x="308.0" y="227.9" width="169.5" height="56.5" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="315.0" y="243.2" font-family="Inter SemiBold" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Falharam endoscopia e balão</text><text x="315.0" y="255.2" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">derivação portossistêmica intra-hepática</text><text x="315.0" y="265.4" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">transjugular: um stent liga a veia porta à</text><text x="315.0" y="275.6" font-family="Inter" font-weight="400" font-size="7.4" fill="#1F2933" text-anchor="start">veia hepática</text><line x1="145.0" y1="213.9" x2="145.0" y2="220.4" stroke="#8AA9DF" stroke-width="1.6"/><line x1="69.5" y1="220.4" x2="220.5" y2="220.4" stroke="#8AA9DF" stroke-width="1.6"/><line x1="69.5" y1="220.4" x2="69.5" y2="222.7" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="65.3,221.7 73.7,221.7 69.5,226.9" fill="#8AA9DF"/><line x1="220.5" y1="220.4" x2="220.5" y2="222.7" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="216.3,221.7 224.7,221.7 220.5,226.9" fill="#8AA9DF"/><line x1="393.0" y1="213.9" x2="393.0" y2="222.7" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="388.8,221.7 397.2,221.7 393.0,226.9" fill="#8AA9DF"/><line x1="145.0" y1="285.4" x2="145.0" y2="294.2" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="140.8,293.2 149.2,293.2 145.0,298.4" fill="#8AA9DF"/><rect x="0.5" y="299.4" width="477.0" height="36.6" rx="7" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1"/><text x="239.0" y="315.0" font-family="Inter SemiBold" font-weight="600" font-size="8.6" fill="#16315C" text-anchor="middle">Depois: evitar o próximo sangramento</text><text x="239.0" y="327.1" font-family="Inter" font-weight="400" font-size="7.5" fill="#1F2933" text-anchor="middle">quem tem varizes comprovadas na endoscopia recebe betabloqueador: carvedilol (ou propranolol)</text></svg>