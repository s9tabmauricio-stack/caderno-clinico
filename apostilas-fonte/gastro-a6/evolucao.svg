<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="109pt" viewBox="0 0 478 109"><rect x="0.0" y="34.0" width="82.8" height="44.0" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="6.0" y="48.3" font-family="Inter SemiBold" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Fígado saudável</text><text x="6.0" y="60.1" font-family="Inter" font-weight="400" font-size="7.3" fill="#1F2933" text-anchor="start">esponja macia: o</text><text x="6.0" y="70.2" font-family="Inter" font-weight="400" font-size="7.3" fill="#1F2933" text-anchor="start">sangue passa livre</text><line x1="83.8" y1="56.0" x2="93.6" y2="56.0" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="92.6,51.8 92.6,60.2 97.8,56.0" fill="#8AA9DF"/><rect x="98.8" y="34.0" width="82.8" height="44.0" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="104.8" y="48.3" font-family="Inter SemiBold" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Esteatose</text><text x="104.8" y="60.1" font-family="Inter" font-weight="400" font-size="7.3" fill="#1F2933" text-anchor="start">gordura dentro dos</text><text x="104.8" y="70.2" font-family="Inter" font-weight="400" font-size="7.3" fill="#1F2933" text-anchor="start">hepatócitos</text><line x1="182.6" y1="56.0" x2="192.4" y2="56.0" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="191.4,51.8 191.4,60.2 196.6,56.0" fill="#8AA9DF"/><rect x="197.6" y="34.0" width="82.8" height="44.0" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="203.6" y="48.3" font-family="Inter SemiBold" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Esteato-hepatite</text><text x="203.6" y="60.1" font-family="Inter" font-weight="400" font-size="7.3" fill="#1F2933" text-anchor="start">a gordura inflama os</text><text x="203.6" y="70.2" font-family="Inter" font-weight="400" font-size="7.3" fill="#1F2933" text-anchor="start">hepatócitos</text><line x1="281.4" y1="56.0" x2="291.2" y2="56.0" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="290.2,51.8 290.2,60.2 295.4,56.0" fill="#8AA9DF"/><rect x="296.4" y="34.0" width="82.8" height="44.0" rx="7" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1"/><text x="302.4" y="48.3" font-family="Inter SemiBold" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Cirrose</text><text x="302.4" y="60.1" font-family="Inter" font-weight="400" font-size="7.3" fill="#1F2933" text-anchor="start">fibrose difusa e</text><text x="302.4" y="70.2" font-family="Inter" font-weight="400" font-size="7.3" fill="#1F2933" text-anchor="start">nódulos; não volta</text><line x1="380.2" y1="56.0" x2="390.0" y2="56.0" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="389.0,51.8 389.0,60.2 394.2,56.0" fill="#8AA9DF"/><rect x="395.2" y="34.0" width="82.8" height="44.0" rx="7" fill="#E8F0FE" stroke="#0B5BD3" stroke-width="1"/><text x="401.2" y="48.3" font-family="Inter SemiBold" font-weight="600" font-size="8.3" fill="#16315C" text-anchor="start">Hepatocarcinoma</text><text x="401.2" y="60.1" font-family="Inter" font-weight="400" font-size="7.3" fill="#1F2933" text-anchor="start">câncer que nasce</text><text x="401.2" y="70.2" font-family="Inter" font-weight="400" font-size="7.3" fill="#1F2933" text-anchor="start">no fígado doente</text><path d="M140.2,32.0 C140.2,12.0 41.4,12.0 44.4,28.0" fill="none" stroke="#0B5BD3" stroke-width="1.5"/><polygon points="40.4,26.0 48.4,25.0 43.4,33.0" fill="#0B5BD3"/><text x="90.8" y="12.0" font-family="Inter SemiBold" font-weight="600" font-size="7.4" fill="#0B5BD3" text-anchor="middle">regride</text><path d="M239.0,32.0 C239.0,12.0 140.2,12.0 143.2,28.0" fill="none" stroke="#0B5BD3" stroke-width="1.5"/><polygon points="139.2,26.0 147.2,25.0 142.2,33.0" fill="#0B5BD3"/><text x="189.6" y="12.0" font-family="Inter SemiBold" font-weight="600" font-size="7.4" fill="#0B5BD3" text-anchor="middle">regride</text><path d="M337.8,32.0 C337.8,12.0 239.0,12.0 242.0,28.0" fill="none" stroke="#8AA9DF" stroke-width="1.4" stroke-dasharray="3 3"/><line x1="283.4" y1="12.0" x2="293.4" y2="22.0" stroke="#16315C" stroke-width="1.8"/><line x1="293.4" y1="12.0" x2="283.4" y2="22.0" stroke="#16315C" stroke-width="1.8"/><text x="297.4" y="9.0" font-family="Inter SemiBold" font-weight="600" font-size="7.4" fill="#16315C" text-anchor="start">irreversível</text><text x="2.0" y="92.0" font-family="Inter" font-weight="400" font-size="7.5" fill="#3A3A3C" text-anchor="start">Vale para o álcool e para a gordura da síndrome metabólica. Sem a agressão (sem beber, perdendo peso), esteatose e</text><text x="2.0" y="102.5" font-family="Inter" font-weight="400" font-size="7.5" fill="#3A3A3C" text-anchor="start">esteato-hepatite regridem; a cirrose não, e ainda abre caminho para o câncer.</text></svg>