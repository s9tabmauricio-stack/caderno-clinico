<text x="105.0" y="48.0" font-family="Inter SemiBold" font-weight="400" font-size="8.4" fill="#16315C" text-anchor="middle">Tronco</text>
<text x="105.0" y="58.5" font-family="Inter SemiBold" font-weight="400" font-size="8.4" fill="#16315C" text-anchor="middle">braquiocefálico</text>
<text x="105.0" y="70.0" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="middle">só do lado direito;</text>
<text x="105.0" y="79.7" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="middle">abre-se em dois,</text>
<text x="105.0" y="89.3" font-family="Inter" font-weight="400" font-size="7.4" fill="#6C6C70" text-anchor="middle">como um L</text>
