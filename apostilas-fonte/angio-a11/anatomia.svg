<text x="372.0" y="52.0" font-family="Inter SemiBold" font-weight="400" font-size="7.6" fill="#0B5BD3" text-anchor="start">Carótidas internas</text>
<text x="372.0" y="62.0" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">terminam nas cerebrais</text>
<text x="372.0" y="71.4" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">médias e dão as cerebrais</text>
<text x="372.0" y="80.7" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">anteriores</text>
<text x="372.0" y="99.1" font-family="Inter SemiBold" font-weight="400" font-size="7.6" fill="#0B5BD3" text-anchor="start">Comunicantes</text>
<text x="372.0" y="109.1" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">uma anterior e duas</text>
<text x="372.0" y="118.4" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">posteriores fecham o anel</text>
<text x="372.0" y="136.8" font-family="Inter SemiBold" font-weight="400" font-size="7.6" fill="#0B5BD3" text-anchor="start">Vertebrais</text>
<text x="372.0" y="146.8" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">juntam-se na basilar, que</text>
<text x="372.0" y="156.2" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">forma as cerebrais</text>
<text x="372.0" y="165.5" font-family="Inter" font-weight="400" font-size="7.2" fill="#1F2933" text-anchor="start">posteriores</text>
