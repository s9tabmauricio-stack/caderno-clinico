<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="229pt" viewBox="0 0 478 229">
<rect x="119.0" y="0.0" width="240.0" height="30.0" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="239.0" y="17.9" font-family="Inter SemiBold" font-weight="400" font-size="8.8" fill="#16315C" text-anchor="middle">Placa na carótida medida no Doppler</text>
<rect x="0.0" y="52.0" width="150.0" height="40.0" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/>
<text x="75.0" y="69.5" font-family="Inter SemiBold" font-weight="400" font-size="8.2" fill="#16315C" text-anchor="middle">Com sintoma e estenose de 70%</text>
<text x="75.0" y="79.8" font-family="Inter SemiBold" font-weight="400" font-size="8.2" fill="#16315C" text-anchor="middle">ou mais</text>
<line x1="75.0" y1="93.0" x2="75.0" y2="102.0" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="75.0,107.0 71.2,102.0 78.8,102.0" fill="#8AA9DF"/>
<rect x="0.0" y="108.0" width="150.0" height="46.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="75.0" y="133.7" font-family="Inter SemiBold" font-weight="400" font-size="7.8" fill="#16315C" text-anchor="middle">Operar, em qualquer serviço</text>
<line x1="75.0" y1="155.4" x2="75.0" y2="164.4" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="75.0,169.4 71.2,164.4 78.8,164.4" fill="#8AA9DF"/>
<rect x="0.0" y="170.4" width="150.0" height="56.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="75.0" y="190.9" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle">A endarterectomia é a melhor</text>
<text x="75.0" y="201.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle">indicação; o stent tem evidência de</text>
<text x="75.0" y="211.4" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle">segurança</text>
<line x1="239.0" y1="31.0" x2="239.0" y2="46.0" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="239.0,51.0 235.2,46.0 242.8,46.0" fill="#8AA9DF"/>
<rect x="164.0" y="52.0" width="150.0" height="40.0" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/>
<text x="239.0" y="69.5" font-family="Inter SemiBold" font-weight="400" font-size="8.2" fill="#16315C" text-anchor="middle">Sem sintoma, com estenose</text>
<text x="239.0" y="79.8" font-family="Inter SemiBold" font-weight="400" font-size="8.2" fill="#16315C" text-anchor="middle">importante</text>
<line x1="239.0" y1="93.0" x2="239.0" y2="102.0" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="239.0,107.0 235.2,102.0 242.8,102.0" fill="#8AA9DF"/>
<rect x="164.0" y="108.0" width="150.0" height="46.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="239.0" y="124.0" font-family="Inter SemiBold" font-weight="400" font-size="7.8" fill="#16315C" text-anchor="middle">Perguntar: é saudável? Deve viver</text>
<text x="239.0" y="133.7" font-family="Inter SemiBold" font-weight="400" font-size="7.8" fill="#16315C" text-anchor="middle">mais de 5 anos? Há outro fator,</text>
<text x="239.0" y="143.5" font-family="Inter SemiBold" font-weight="400" font-size="7.8" fill="#16315C" text-anchor="middle">como placa ulcerada?</text>
<line x1="239.0" y1="155.4" x2="239.0" y2="164.4" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="239.0,169.4 235.2,164.4 242.8,164.4" fill="#8AA9DF"/>
<rect x="164.0" y="170.4" width="150.0" height="56.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="239.0" y="185.8" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle">Se sim, endarterectomia ou stent;</text>
<text x="239.0" y="196.0" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle">quanto menor a placa, mais o</text>
<text x="239.0" y="206.3" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle">serviço precisa ter menos de 3% de</text>
<text x="239.0" y="216.6" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle">acidente vascular</text>
<rect x="328.0" y="52.0" width="150.0" height="40.0" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/>
<text x="403.0" y="69.5" font-family="Inter SemiBold" font-weight="400" font-size="8.2" fill="#16315C" text-anchor="middle">Sem sintoma e menos de 60%, ou</text>
<text x="403.0" y="79.8" font-family="Inter SemiBold" font-weight="400" font-size="8.2" fill="#16315C" text-anchor="middle">artéria já ocluída</text>
<line x1="403.0" y1="93.0" x2="403.0" y2="102.0" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="403.0,107.0 399.2,102.0 406.8,102.0" fill="#8AA9DF"/>
<rect x="328.0" y="108.0" width="150.0" height="46.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="403.0" y="128.9" font-family="Inter SemiBold" font-weight="400" font-size="7.8" fill="#16315C" text-anchor="middle">Tratamento clínico: não mexer no</text>
<text x="403.0" y="138.6" font-family="Inter SemiBold" font-weight="400" font-size="7.8" fill="#16315C" text-anchor="middle">que está quieto</text>
<line x1="403.0" y1="155.4" x2="403.0" y2="164.4" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="403.0,169.4 399.2,164.4 406.8,164.4" fill="#8AA9DF"/>
<rect x="328.0" y="170.4" width="150.0" height="56.6" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/>
<text x="403.0" y="190.9" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle">Ultrassom a cada 6 meses; se a</text>
<text x="403.0" y="201.2" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle">placa crescer ou der sintoma, vai</text>
<text x="403.0" y="211.4" font-family="Inter" font-weight="400" font-size="7.6" fill="#1F2933" text-anchor="middle">para a cirurgia</text>
<path d="M119,15 L75.0,15 L75.0,46.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/>
<polygon points="75.0,51.0 71.2,46.0 78.8,46.0" fill="#8AA9DF"/>
<path d="M359,15 L403.0,15 L403.0,46.0" fill="none" stroke="#8AA9DF" stroke-width="1.6"/>
<polygon points="403.0,51.0 399.2,46.0 406.8,46.0" fill="#8AA9DF"/>
</svg>
