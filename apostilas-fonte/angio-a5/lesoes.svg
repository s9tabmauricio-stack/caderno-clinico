<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="271pt" viewBox="0 0 478 271"><g transform="translate(0.7 0.7) scale(0.99707)"><rect x="0.0" y="0.0" width="152.7" height="130.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><rect x="6.0" y="6.0" width="140.7" height="60.0" rx="5" fill="#F5F8FF"/><rect x="16.0" y="31.0" width="120.7" height="22.0" fill="#DCE8FB"/><line x1="16.0" y1="31.0" x2="136.7" y2="31.0" stroke="#16315C" stroke-width="3"/><line x1="16.0" y1="53.0" x2="136.7" y2="53.0" stroke="#16315C" stroke-width="3"/><rect x="68.3" y="29.0" width="16" height="5" fill="#F5F8FF"/><circle cx="68.3" cy="28.0" r="2.6" fill="#8AA9DF"/><circle cx="76.3" cy="23.0" r="3.2" fill="#8AA9DF"/><circle cx="84.3" cy="28.0" r="2.6" fill="#8AA9DF"/><circle cx="73.3" cy="16.0" r="2.2" fill="#8AA9DF"/><circle cx="81.3" cy="17.0" r="2" fill="#8AA9DF"/><line x1="22.0" y1="42.0" x2="57.8" y2="42.0" stroke="#8AA9DF" stroke-width="1.2"/><polygon points="62.3,42.0 57.8,44.7 57.8,39.3" fill="#8AA9DF"/><text x="76.3" y="78.0" font-family="Inter" font-weight="600" font-size="9.2" fill="#16315C" text-anchor="middle">Secção parcial</text><text x="76.3" y="91.0" font-family="Inter" font-weight="400" font-size="8.0" fill="#1F2933" text-anchor="middle">Rasga só parte da parede: o vaso</text><text x="76.3" y="101.4" font-family="Inter" font-weight="400" font-size="8.0" fill="#1F2933" text-anchor="middle">não consegue se retrair e se fechar,</text><text x="76.3" y="111.8" font-family="Inter" font-weight="400" font-size="8.0" fill="#1F2933" text-anchor="middle">e sangra por mais tempo.</text><rect x="162.7" y="0.0" width="152.7" height="130.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><rect x="168.7" y="6.0" width="140.7" height="60.0" rx="5" fill="#F5F8FF"/><path d="M178.7,25.0 L222.0,25.0 Q228.0,25.0 228.0,31.0 L228.0,41.0 Q228.0,47.0 222.0,47.0 L178.7,47.0 Z" fill="#DCE8FB"/><path d="M178.7,25.0 L222.0,25.0 Q228.0,25.0 228.0,32.0" fill="none" stroke="#16315C" stroke-width="3"/><path d="M178.7,47.0 L222.0,47.0 Q228.0,47.0 228.0,40.0" fill="none" stroke="#16315C" stroke-width="3"/><path d="M299.3,25.0 L256.0,25.0 Q250.0,25.0 250.0,31.0 L250.0,41.0 Q250.0,47.0 256.0,47.0 L299.3,47.0 Z" fill="#DCE8FB"/><path d="M299.3,25.0 L256.0,25.0 Q250.0,25.0 250.0,32.0" fill="none" stroke="#16315C" stroke-width="3"/><path d="M299.3,47.0 L256.0,47.0 Q250.0,47.0 250.0,40.0" fill="none" stroke="#16315C" stroke-width="3"/><line x1="218.0" y1="16.0" x2="206.0" y2="16.0" stroke="#8AA9DF" stroke-width="1.1"/><polygon points="202.0,16.0 206.0,13.6 206.0,18.4" fill="#8AA9DF"/><line x1="260.0" y1="16.0" x2="272.0" y2="16.0" stroke="#8AA9DF" stroke-width="1.1"/><polygon points="276.0,16.0 272.0,18.4 272.0,13.6" fill="#8AA9DF"/><line x1="184.7" y1="36.0" x2="211.5" y2="36.0" stroke="#8AA9DF" stroke-width="1.2"/><polygon points="216.0,36.0 211.5,38.7 211.5,33.3" fill="#8AA9DF"/><text x="239.0" y="78.0" font-family="Inter" font-weight="600" font-size="9.2" fill="#16315C" text-anchor="middle">Secção total (transecção)</text><text x="239.0" y="91.0" font-family="Inter" font-weight="400" font-size="8.0" fill="#1F2933" text-anchor="middle">Corta o vaso inteiro: as pontas se</text><text x="239.0" y="101.4" font-family="Inter" font-weight="400" font-size="8.0" fill="#1F2933" text-anchor="middle">retraem e se contraem, e sangra por</text><text x="239.0" y="111.8" font-family="Inter" font-weight="400" font-size="8.0" fill="#1F2933" text-anchor="middle">menos tempo.</text><rect x="325.3" y="0.0" width="152.7" height="130.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><rect x="331.3" y="6.0" width="140.7" height="60.0" rx="5" fill="#F5F8FF"/><rect x="341.3" y="25.0" width="120.7" height="22.0" fill="#DCE8FB"/><line x1="341.3" y1="25.0" x2="462.0" y2="25.0" stroke="#16315C" stroke-width="3"/><line x1="341.3" y1="47.0" x2="462.0" y2="47.0" stroke="#16315C" stroke-width="3"/><path d="M379.7,44.0 Q395.7,44.0 405.7,32.0" fill="none" stroke="#16315C" stroke-width="1.8"/><path d="M387.7,45.5 Q403.7,44.0 407.7,34.0 L433.7,34.0 Q441.7,40.0 435.7,45.5 Z" fill="#8AA9DF"/><line x1="347.3" y1="34.0" x2="371.2" y2="34.0" stroke="#8AA9DF" stroke-width="1.2"/><polygon points="375.7,34.0 371.2,36.7 371.2,31.3" fill="#8AA9DF"/><text x="401.7" y="78.0" font-family="Inter" font-weight="600" font-size="9.2" fill="#16315C" text-anchor="middle">Lesão da íntima e dissecção</text><text x="401.7" y="91.0" font-family="Inter" font-weight="400" font-size="8.0" fill="#1F2933" text-anchor="middle">A camada de dentro descola, o</text><text x="401.7" y="101.4" font-family="Inter" font-weight="400" font-size="8.0" fill="#1F2933" text-anchor="middle">sangue entra entre as camadas e o</text><text x="401.7" y="111.8" font-family="Inter" font-weight="400" font-size="8.0" fill="#1F2933" text-anchor="middle">vaso entope: isquemia.</text><rect x="0.0" y="140.2" width="152.7" height="130.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><rect x="6.0" y="146.2" width="140.7" height="60.0" rx="5" fill="#F5F8FF"/><path d="M16.0,165.2 L50.3,165.2 C64.3,165.2 64.3,171.2 76.3,171.2 C88.3,171.2 88.3,165.2 102.3,165.2 L136.7,165.2 L136.7,187.2 L102.3,187.2 C88.3,187.2 88.3,181.2 76.3,181.2 C64.3,181.2 64.3,187.2 50.3,187.2 L16.0,187.2 Z" fill="#DCE8FB"/><path d="M16.0,165.2 L50.3,165.2 C64.3,165.2 64.3,171.2 76.3,171.2 C88.3,171.2 88.3,165.2 102.3,165.2 L136.7,165.2" fill="none" stroke="#16315C" stroke-width="3"/><path d="M16.0,187.2 L50.3,187.2 C64.3,187.2 64.3,181.2 76.3,181.2 C88.3,181.2 88.3,187.2 102.3,187.2 L136.7,187.2" fill="none" stroke="#16315C" stroke-width="3"/><line x1="22.0" y1="176.2" x2="41.8" y2="176.2" stroke="#8AA9DF" stroke-width="1.2"/><polygon points="46.3,176.2 41.8,178.9 41.8,173.5" fill="#8AA9DF"/><text x="76.3" y="218.2" font-family="Inter" font-weight="600" font-size="9.2" fill="#16315C" text-anchor="middle">Espasmo</text><text x="76.3" y="231.2" font-family="Inter" font-weight="400" font-size="8.0" fill="#1F2933" text-anchor="middle">O vaso se contrai sem romper: o</text><text x="76.3" y="241.6" font-family="Inter" font-weight="400" font-size="8.0" fill="#1F2933" text-anchor="middle">pulso pode ficar mais fraco sem que</text><text x="76.3" y="252.0" font-family="Inter" font-weight="400" font-size="8.0" fill="#1F2933" text-anchor="middle">haja rotura.</text><rect x="162.7" y="140.2" width="152.7" height="130.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><rect x="168.7" y="146.2" width="140.7" height="60.0" rx="5" fill="#F5F8FF"/><circle cx="239.0" cy="169.2" r="14" fill="#C3D8F8" stroke="#8AA9DF" stroke-width="1.2" stroke-dasharray="3 2"/><circle cx="242.0" cy="166.2" r="6.5" fill="#8AA9DF"/><rect x="178.7" y="182.2" width="120.7" height="22.0" fill="#DCE8FB"/><line x1="178.7" y1="182.2" x2="299.3" y2="182.2" stroke="#16315C" stroke-width="3"/><line x1="178.7" y1="204.2" x2="299.3" y2="204.2" stroke="#16315C" stroke-width="3"/><rect x="235.0" y="180.2" width="8" height="5" fill="#C3D8F8"/><line x1="184.7" y1="193.2" x2="222.5" y2="193.2" stroke="#8AA9DF" stroke-width="1.2"/><polygon points="227.0,193.2 222.5,195.9 222.5,190.5" fill="#8AA9DF"/><text x="239.0" y="218.2" font-family="Inter" font-weight="600" font-size="9.2" fill="#16315C" text-anchor="middle">Pseudoaneurisma</text><text x="239.0" y="231.2" font-family="Inter" font-weight="400" font-size="8.0" fill="#1F2933" text-anchor="middle">Hematoma que continua recebendo</text><text x="239.0" y="241.6" font-family="Inter" font-weight="400" font-size="8.0" fill="#1F2933" text-anchor="middle">sangue pelo furo: em volta só há</text><text x="239.0" y="252.0" font-family="Inter" font-weight="400" font-size="8.0" fill="#1F2933" text-anchor="middle">gordura e coágulo.</text><rect x="325.3" y="140.2" width="152.7" height="130.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><rect x="331.3" y="146.2" width="140.7" height="60.0" rx="5" fill="#F5F8FF"/><rect x="397.7" y="163.2" width="8" height="28.0" fill="#DCE8FB"/><line x1="397.7" y1="171.2" x2="397.7" y2="183.2" stroke="#16315C" stroke-width="1.6"/><line x1="405.7" y1="171.2" x2="405.7" y2="183.2" stroke="#16315C" stroke-width="1.6"/><rect x="341.3" y="155.2" width="120.7" height="16.0" fill="#DCE8FB"/><line x1="341.3" y1="155.2" x2="462.0" y2="155.2" stroke="#16315C" stroke-width="2.6"/><line x1="341.3" y1="171.2" x2="462.0" y2="171.2" stroke="#16315C" stroke-width="2.6"/><rect x="341.3" y="183.2" width="120.7" height="16.0" fill="#DCE8FB"/><line x1="341.3" y1="183.2" x2="462.0" y2="183.2" stroke="#5E7FB8" stroke-width="2.2"/><line x1="341.3" y1="199.2" x2="462.0" y2="199.2" stroke="#5E7FB8" stroke-width="2.2"/><rect x="399.1" y="169.2" width="5.2" height="16.0" fill="#DCE8FB"/><text x="344.3" y="165.8" font-family="Inter" font-weight="500" font-size="6.6" fill="#16315C" text-anchor="start">artéria</text><text x="344.3" y="193.8" font-family="Inter" font-weight="500" font-size="6.6" fill="#16315C" text-anchor="start">veia</text><line x1="379.7" y1="163.2" x2="389.2" y2="163.2" stroke="#8AA9DF" stroke-width="1.2"/><polygon points="393.7,163.2 389.2,165.9 389.2,160.5" fill="#8AA9DF"/><line x1="401.7" y1="167.2" x2="401.7" y2="184.2" stroke="#8AA9DF" stroke-width="1.1"/><polygon points="401.7,188.2 399.3,184.2 404.1,184.2" fill="#8AA9DF"/><line x1="409.7" y1="191.2" x2="423.2" y2="191.2" stroke="#8AA9DF" stroke-width="1.2"/><polygon points="427.7,191.2 423.2,193.9 423.2,188.5" fill="#8AA9DF"/><text x="401.7" y="218.2" font-family="Inter" font-weight="600" font-size="9.2" fill="#16315C" text-anchor="middle">Fístula arteriovenosa</text><text x="401.7" y="231.2" font-family="Inter" font-weight="400" font-size="8.0" fill="#1F2933" text-anchor="middle">O furo liga artéria e veia: frêmito e</text><text x="401.7" y="241.6" font-family="Inter" font-weight="400" font-size="8.0" fill="#1F2933" text-anchor="middle">sopro, e a veia passa a pulsar.</text></g></svg>