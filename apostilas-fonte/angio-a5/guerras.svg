<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="241pt" viewBox="0 0 478 241"><g transform="translate(0.7 0.7) scale(0.99707)"><line x1="2" y1="40" x2="476" y2="40" stroke="#8AA9DF" stroke-width="1.6"/><line x1="464.0" y1="40.0" x2="471.0" y2="40.0" stroke="#8AA9DF" stroke-width="1.4"/><polygon points="477.0,40.0 471.0,43.6 471.0,36.4" fill="#8AA9DF"/><text x="44.2" y="13.0" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="middle">Primeira Guerra</text><text x="44.2" y="25.5" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="middle">Mundial</text><circle cx="44.2" cy="40" r="4.5" fill="#0B5BD3" stroke="#FFFFFF" stroke-width="1.5"/><line x1="44.2" y1="45" x2="44.2" y2="56" stroke="#8AA9DF" stroke-width="1"/><rect x="0.0" y="56.0" width="88.4" height="143.3" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="8.5" cy="68.4" r="1.6" fill="#0B5BD3"/><text x="13.0" y="71.0" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">Ligadura era o</text><text x="13.0" y="81.3" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">tratamento de</text><text x="13.0" y="91.6" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">escolha.</text><circle cx="8.5" cy="104.3" r="1.6" fill="#0B5BD3"/><text x="13.0" y="106.9" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">A infecção</text><text x="13.0" y="117.2" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">desfazia a sutura</text><text x="13.0" y="127.5" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">do vaso.</text><circle cx="8.5" cy="140.2" r="1.6" fill="#0B5BD3"/><text x="13.0" y="142.8" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">Muitos</text><text x="13.0" y="153.1" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">amputados, de</text><text x="13.0" y="163.4" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">muleta.</text><text x="141.6" y="13.0" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="middle">Segunda Guerra</text><text x="141.6" y="25.5" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="middle">Mundial</text><circle cx="141.6" cy="40" r="4.5" fill="#0B5BD3" stroke="#FFFFFF" stroke-width="1.5"/><line x1="141.6" y1="45" x2="141.6" y2="56" stroke="#8AA9DF" stroke-width="1"/><rect x="97.4" y="56.0" width="88.4" height="143.3" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="105.9" cy="68.4" r="1.6" fill="#0B5BD3"/><text x="110.4" y="71.0" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">2.471 lesões</text><text x="110.4" y="81.3" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">arteriais, 81</text><text x="110.4" y="91.6" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">reparos e 78</text><text x="110.4" y="101.9" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">suturas laterais.</text><circle cx="105.9" cy="114.6" r="1.6" fill="#0B5BD3"/><text x="110.4" y="117.2" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">Amputação: mais</text><text x="110.4" y="127.5" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">de um terço;</text><text x="110.4" y="137.8" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">depois de</text><text x="110.4" y="148.1" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">ligadura, quase</text><text x="110.4" y="158.4" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">metade.</text><circle cx="105.9" cy="171.1" r="1.6" fill="#0B5BD3"/><text x="110.4" y="173.7" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">Até o tratamento:</text><text x="110.4" y="184.0" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">10 horas.</text><text x="239.0" y="13.0" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="middle">Guerra</text><text x="239.0" y="25.5" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="middle">da Coreia</text><circle cx="239.0" cy="40" r="4.5" fill="#0B5BD3" stroke="#FFFFFF" stroke-width="1.5"/><line x1="239.0" y1="45" x2="239.0" y2="56" stroke="#8AA9DF" stroke-width="1"/><rect x="194.8" y="56.0" width="88.4" height="143.3" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="203.3" cy="68.4" r="1.6" fill="#0B5BD3"/><text x="207.8" y="71.0" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">Anestesia melhor,</text><text x="207.8" y="81.3" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">resgate aéreo e</text><text x="207.8" y="91.6" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">postos</text><text x="207.8" y="101.9" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">avançados.</text><circle cx="203.3" cy="114.6" r="1.6" fill="#0B5BD3"/><text x="207.8" y="117.2" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">Até o tratamento:</text><text x="207.8" y="127.5" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">1 a 2 horas.</text><circle cx="203.3" cy="140.2" r="1.6" fill="#0B5BD3"/><text x="207.8" y="142.8" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">Amputação: de</text><text x="207.8" y="153.1" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">35% para 13%.</text><text x="336.4" y="13.0" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="middle">Guerra</text><text x="336.4" y="25.5" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="middle">do Vietnã</text><circle cx="336.4" cy="40" r="4.5" fill="#0B5BD3" stroke="#FFFFFF" stroke-width="1.5"/><line x1="336.4" y1="45" x2="336.4" y2="56" stroke="#8AA9DF" stroke-width="1"/><rect x="292.2" y="56.0" width="88.4" height="143.3" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="300.7" cy="68.4" r="1.6" fill="#0B5BD3"/><text x="305.2" y="71.0" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">Transporte aéreo</text><text x="305.2" y="81.3" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">em 95% dos</text><text x="305.2" y="91.6" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">feridos.</text><circle cx="300.7" cy="104.3" r="1.6" fill="#0B5BD3"/><text x="305.2" y="106.9" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">Ainda muitas</text><text x="305.2" y="117.2" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">lesões vasculares,</text><text x="305.2" y="127.5" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">mas a amputação</text><text x="305.2" y="137.8" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">continuou baixa.</text><text x="433.8" y="13.0" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="middle">Hoje:</text><text x="433.8" y="25.5" font-family="Inter" font-weight="600" font-size="9" fill="#16315C" text-anchor="middle">trauma civil</text><circle cx="433.8" cy="40" r="4.5" fill="#0B5BD3" stroke="#FFFFFF" stroke-width="1.5"/><line x1="433.8" y1="45" x2="433.8" y2="56" stroke="#8AA9DF" stroke-width="1"/><rect x="389.6" y="56.0" width="88.4" height="143.3" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><circle cx="398.1" cy="68.4" r="1.6" fill="#0B5BD3"/><text x="402.6" y="71.0" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">Arma de fogo,</text><text x="402.6" y="81.3" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">trânsito e</text><text x="402.6" y="91.6" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">violência; atinge</text><text x="402.6" y="101.9" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">jovens.</text><circle cx="398.1" cy="114.6" r="1.6" fill="#0B5BD3"/><text x="402.6" y="117.2" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">Mais iatrogenia</text><text x="402.6" y="127.5" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">(cateterismos).</text><circle cx="398.1" cy="140.2" r="1.6" fill="#0B5BD3"/><text x="402.6" y="142.8" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">Primeiros artigos</text><text x="402.6" y="153.1" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">de tratamento</text><text x="402.6" y="163.4" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">endovascular:</text><text x="402.6" y="173.7" font-family="Inter" font-weight="400" font-size="7.9" fill="#1F2933" text-anchor="start">1997.</text><rect x="0.0" y="209.3" width="478.0" height="30.0" rx="7" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><text x="12.0" y="228.1" font-family="Inter" font-weight="600" font-size="8.8" fill="#16315C" text-anchor="start">O que mudou o resultado:</text><text x="127.6" y="228.1" font-family="Inter" font-weight="400" font-size="8.8" fill="#1F2933" text-anchor="start">chegar rápido ao cirurgião e reconstruir o vaso em vez de amarrar.</text></g></svg>