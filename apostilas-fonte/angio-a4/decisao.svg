<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="343pt" viewBox="0 0 478 343"><rect x="0.0" y="1.0" width="478.0" height="38.9" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="239.0" y="17.2" font-family="Inter" font-size="8.6" font-weight="600" fill="#16315C" text-anchor="middle">Membro pálido, com dor, parestesia, paralisia e sem pulso</text><text x="239.0" y="31.4" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="middle">Os 5 Ps: oclusão arterial aguda.</text><line x1="239.0" y1="41.9" x2="239.0" y2="48.9" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="235.0,47.9 243.0,47.9 239.0,53.9" fill="#8AA9DF"/><rect x="0.0" y="53.9" width="478.0" height="38.9" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="239.0" y="70.1" font-family="Inter" font-size="8.6" font-weight="600" fill="#16315C" text-anchor="middle">Quanto tempo de evolução? Viável, ameaçado ou inviável?</text><text x="239.0" y="84.3" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="middle">Classificação de Rutherford e exames de sangue (creatinina, potássio, enzimas musculares, gasometria).</text><line x1="239.0" y1="93.9" x2="239.0" y2="101.9" stroke="#8AA9DF" stroke-width="1.6"/><line x1="158.0" y1="101.9" x2="405.0" y2="101.9" stroke="#8AA9DF" stroke-width="1.6"/><line x1="158.0" y1="101.9" x2="158.0" y2="107.9" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="154.0,106.9 162.0,106.9 158.0,112.9" fill="#8AA9DF"/><line x1="405.0" y1="101.9" x2="405.0" y2="107.9" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="401.0,106.9 409.0,106.9 405.0,112.9" fill="#8AA9DF"/><rect x="0.0" y="112.9" width="316.0" height="38.9" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="8.0" y="129.1" font-family="Inter" font-size="8.6" font-weight="600" fill="#16315C" text-anchor="start">Viável ou ameaçado</text><text x="8.0" y="143.2" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">Classes I, IIa e IIb: ainda dá para salvar o membro.</text><rect x="332.0" y="112.9" width="146.0" height="71.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="340.0" y="129.1" font-family="Inter" font-size="8.6" font-weight="600" fill="#16315C" text-anchor="start">Inviável</text><text x="340.0" y="143.2" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">Classe III, rigor mortis; ou muitas</text><text x="340.0" y="154.0" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">horas, com rigidez, creatinina,</text><text x="340.0" y="164.8" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">potássio e enzimas altos e</text><text x="340.0" y="175.5" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">acidose.</text><line x1="158.0" y1="153.8" x2="158.0" y2="160.8" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="154.0,159.8 162.0,159.8 158.0,165.8" fill="#8AA9DF"/><rect x="0.0" y="165.8" width="316.0" height="49.7" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="8.0" y="182.0" font-family="Inter" font-size="8.6" font-weight="600" fill="#16315C" text-anchor="start">Centro cirúrgico já, sem esperar exame de fora</text><text x="8.0" y="196.2" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">Angiografia na mesa. Centro cirúrgico longe: heparina, algodão, não elevar o</text><text x="8.0" y="206.9" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">membro, sem vasodilatador, enquanto transfere.</text><line x1="158.0" y1="216.5" x2="158.0" y2="223.5" stroke="#8AA9DF" stroke-width="1.6"/><line x1="76.0" y1="223.5" x2="240.0" y2="223.5" stroke="#8AA9DF" stroke-width="1.6"/><line x1="76.0" y1="223.5" x2="76.0" y2="229.5" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="72.0,228.5 80.0,228.5 76.0,234.5" fill="#8AA9DF"/><line x1="240.0" y1="223.5" x2="240.0" y2="229.5" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="236.0,228.5 244.0,228.5 240.0,234.5" fill="#8AA9DF"/><rect x="0.0" y="234.5" width="152.0" height="49.7" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="8.0" y="250.7" font-family="Inter" font-size="8.6" font-weight="600" fill="#16315C" text-anchor="start">Embolia: artéria sadia</text><text x="8.0" y="264.9" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">Fogarty por incisão transversal;</text><text x="8.0" y="275.7" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">angiografia para conferir.</text><rect x="164.0" y="234.5" width="152.0" height="49.7" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="172.0" y="250.7" font-family="Inter" font-size="8.6" font-weight="600" fill="#16315C" text-anchor="start">Trombose: artéria com placa</text><text x="172.0" y="264.9" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">Cirurgia planejada: ponte com a</text><text x="172.0" y="275.7" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">safena ou endovascular.</text><line x1="76.0" y1="285.2" x2="76.0" y2="292.2" stroke="#8AA9DF" stroke-width="1.6"/><line x1="240.0" y1="285.2" x2="240.0" y2="292.2" stroke="#8AA9DF" stroke-width="1.6"/><line x1="76.0" y1="292.2" x2="240.0" y2="292.2" stroke="#8AA9DF" stroke-width="1.6"/><line x1="158.0" y1="292.2" x2="158.0" y2="298.2" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="154.0,297.2 162.0,297.2 158.0,303.2" fill="#8AA9DF"/><rect x="0.0" y="303.2" width="316.0" height="38.9" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="8.0" y="319.4" font-family="Inter" font-size="8.6" font-weight="600" fill="#16315C" text-anchor="start">Depois de revascularizar: vigiar a reperfusão</text><text x="8.0" y="333.6" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">Dor fora da proporção, parestesia, perna dura: fasciotomia.</text><rect x="332.0" y="303.2" width="146.0" height="38.9" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="340.0" y="319.4" font-family="Inter" font-size="8.6" font-weight="600" fill="#16315C" text-anchor="start">Amputação</text><text x="340.0" y="333.6" font-family="Inter" font-size="7.8" font-weight="400" fill="#1F2933" text-anchor="start">Revascularizar mataria o paciente.</text><line x1="405.0" y1="186.1" x2="405.0" y2="298.2" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="401.0,297.2 409.0,297.2 405.0,303.2" fill="#8AA9DF"/></svg>
