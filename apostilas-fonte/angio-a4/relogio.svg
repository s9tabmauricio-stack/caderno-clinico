<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="174pt" viewBox="0 0 478 174"><text x="0.0" y="8.0" font-family="Inter" font-size="7.2" font-weight="500" fill="#6C6C70" text-anchor="start">Oclusão</text><text x="478.0" y="8.0" font-family="Inter" font-size="7.2" font-weight="500" fill="#6C6C70" text-anchor="end">tempo de isquemia</text><line x1="2" y1="16" x2="470" y2="16" stroke="#8AA9DF" stroke-width="2.2"/><polygon points="469,11 469,21 478,16" fill="#8AA9DF"/><circle cx="3" cy="16" r="3.5" fill="#8AA9DF"/><circle cx="75.7" cy="16" r="5" fill="#0B5BD3"/><line x1="75.7" y1="21" x2="75.7" y2="34" stroke="#8AA9DF" stroke-width="1.2"/><rect x="0.0" y="34" width="151.3" height="89.9" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="10.0" y="58.0" font-family="Inter" font-size="16" font-weight="700" fill="#16315C" text-anchor="start">2 h</text><text x="40.8" y="57.0" font-family="Inter" font-size="10" font-weight="600" fill="#0B5BD3" text-anchor="start">Nervo</text><text x="10.0" y="76.0" font-family="Inter" font-size="8.2" font-weight="400" fill="#1F2933" text-anchor="start">Começa a formigar a perna:</text><text x="10.0" y="87.6" font-family="Inter" font-size="8.2" font-weight="400" fill="#1F2933" text-anchor="start">parestesia. Com 2 a 3 horas, o</text><text x="10.0" y="99.3" font-family="Inter" font-size="8.2" font-weight="400" fill="#1F2933" text-anchor="start">nervo já está comprometido.</text><circle cx="239.0" cy="16" r="5" fill="#0B5BD3"/><line x1="239.0" y1="21" x2="239.0" y2="34" stroke="#8AA9DF" stroke-width="1.2"/><rect x="163.3" y="34" width="151.3" height="89.9" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="173.3" y="58.0" font-family="Inter" font-size="16" font-weight="700" fill="#16315C" text-anchor="start">12 h</text><text x="211.1" y="57.0" font-family="Inter" font-size="10" font-weight="600" fill="#0B5BD3" text-anchor="start">Músculo</text><text x="173.3" y="76.0" font-family="Inter" font-size="8.2" font-weight="400" fill="#1F2933" text-anchor="start">O músculo fica rígido.</text><circle cx="402.3" cy="16" r="5" fill="#0B5BD3"/><line x1="402.3" y1="21" x2="402.3" y2="34" stroke="#8AA9DF" stroke-width="1.2"/><rect x="326.7" y="34" width="151.3" height="89.9" rx="8" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1.1"/><text x="336.7" y="58.0" font-family="Inter" font-size="16" font-weight="700" fill="#16315C" text-anchor="start">24 h</text><text x="378.1" y="57.0" font-family="Inter" font-size="10" font-weight="600" fill="#0B5BD3" text-anchor="start">Pele</text><text x="336.7" y="76.0" font-family="Inter" font-size="8.2" font-weight="400" fill="#1F2933" text-anchor="start">A pele começa a fazer flictenas e</text><text x="336.7" y="87.6" font-family="Inter" font-size="8.2" font-weight="400" fill="#1F2933" text-anchor="start">bolhas.</text><rect x="0" y="133.9" width="478" height="39.3" rx="8" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><text x="12.0" y="149.9" font-family="Inter" font-size="8.2" font-weight="400" fill="#1F2933" text-anchor="start">Ordem de resistência à isquemia: o nervo é o primeiro a sofrer e a pele, a última. Se a pele já morreu, o músculo</text><text x="12.0" y="161.6" font-family="Inter" font-size="8.2" font-weight="400" fill="#1F2933" text-anchor="start">embaixo dela está ainda pior.</text></svg>
