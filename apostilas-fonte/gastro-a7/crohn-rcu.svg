<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="124pt" viewBox="0 0 478 124"><text x="31.0" y="12.0" font-family="Inter Medium" font-weight="500" font-size="7" fill="#6C6C70" text-anchor="middle">Boca e esôfago</text><text x="87.0" y="12.0" font-family="Inter Medium" font-weight="500" font-size="7" fill="#6C6C70" text-anchor="middle">Estômago</text><text x="158.0" y="12.0" font-family="Inter Medium" font-weight="500" font-size="7" fill="#6C6C70" text-anchor="middle">Intestino delgado</text><text x="246.0" y="12.0" font-family="Inter Medium" font-weight="500" font-size="7" fill="#6C6C70" text-anchor="middle">Íleo terminal e ceco</text><text x="343.0" y="12.0" font-family="Inter Medium" font-weight="500" font-size="7" fill="#6C6C70" text-anchor="middle">Cólon</text><text x="420.0" y="12.0" font-family="Inter Medium" font-weight="500" font-size="7" fill="#6C6C70" text-anchor="middle">Reto</text><text x="460.0" y="12.0" font-family="Inter Medium" font-weight="500" font-size="7" fill="#6C6C70" text-anchor="middle">Ânus</text><text x="0.0" y="31.0" font-family="Inter SemiBold" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Doença de Crohn</text><rect x="1.0" y="36.0" width="60.0" height="16" rx="4" fill="#FFFFFF" stroke="#C3D8F8"/><rect x="63.0" y="36.0" width="48.0" height="16" rx="4" fill="#FFFFFF" stroke="#C3D8F8"/><rect x="113.0" y="36.0" width="90.0" height="16" rx="4" fill="#FFFFFF" stroke="#C3D8F8"/><rect x="205.0" y="36.0" width="82.0" height="16" rx="4" fill="#FFFFFF" stroke="#C3D8F8"/><rect x="289.0" y="36.0" width="108.0" height="16" rx="4" fill="#FFFFFF" stroke="#C3D8F8"/><rect x="399.0" y="36.0" width="42.0" height="16" rx="4" fill="#FFFFFF" stroke="#C3D8F8"/><rect x="443.0" y="36.0" width="34.0" height="16" rx="4" fill="#FFFFFF" stroke="#C3D8F8"/><rect x="20.0" y="38.5" width="14.0" height="11" rx="3.5" fill="#8AA9DF"/><rect x="78.0" y="38.5" width="16.0" height="11" rx="3.5" fill="#8AA9DF"/><rect x="126.0" y="38.5" width="22.0" height="11" rx="3.5" fill="#8AA9DF"/><rect x="170.0" y="38.5" width="16.0" height="11" rx="3.5" fill="#8AA9DF"/><rect x="212.0" y="38.5" width="66.0" height="11" rx="3.5" fill="#0B5BD3"/><rect x="310.0" y="38.5" width="20.0" height="11" rx="3.5" fill="#8AA9DF"/><rect x="358.0" y="38.5" width="18.0" height="11" rx="3.5" fill="#8AA9DF"/><rect x="450.0" y="38.5" width="20.0" height="11" rx="3.5" fill="#8AA9DF"/><text x="0.0" y="64.0" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Da boca ao ânus, em saltos, com trechos sadios no meio. O ponto mais comum (azul forte) é a junção do íleo com o ceco.</text><text x="0.0" y="87.0" font-family="Inter SemiBold" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Retocolite ulcerativa</text><rect x="1.0" y="92.0" width="60.0" height="16" rx="4" fill="#FFFFFF" stroke="#C3D8F8"/><rect x="63.0" y="92.0" width="48.0" height="16" rx="4" fill="#FFFFFF" stroke="#C3D8F8"/><rect x="113.0" y="92.0" width="90.0" height="16" rx="4" fill="#FFFFFF" stroke="#C3D8F8"/><rect x="205.0" y="92.0" width="82.0" height="16" rx="4" fill="#FFFFFF" stroke="#C3D8F8"/><rect x="289.0" y="92.0" width="108.0" height="16" rx="4" fill="#FFFFFF" stroke="#C3D8F8"/><rect x="399.0" y="92.0" width="42.0" height="16" rx="4" fill="#FFFFFF" stroke="#C3D8F8"/><rect x="443.0" y="92.0" width="34.0" height="16" rx="4" fill="#FFFFFF" stroke="#C3D8F8"/><rect x="318.0" y="94.5" width="121.0" height="11" rx="3.5" fill="#0B5BD3"/><text x="0.0" y="120.0" font-family="Inter" font-weight="400" font-size="7.8" fill="#1F2933" text-anchor="start">Só no cólon: começa sempre no reto e sobe sem pular nenhum trecho; pode tomar o cólon inteiro (pancolite).</text></svg>