<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="300pt" viewBox="0 0 478 300"><rect x="0.0" y="0.0" width="478.0" height="24.0" rx="6" fill="#F5F8FF" stroke="#C3D8F8" stroke-width="1"/><text x="239.0" y="15.5" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#16315C" text-anchor="middle">Dor embaixo e à esquerda com febre: tomografia do abdome para confirmar e dar o grau</text><text x="23.0" y="39.0" font-family="Inter SemiBold" font-weight="600" font-size="7.2" fill="#6C6C70" text-anchor="middle">Grau</text><text x="61.0" y="39.0" font-family="Inter SemiBold" font-weight="600" font-size="7.2" fill="#6C6C70" text-anchor="start">O que a tomografia mostra</text><text x="251.0" y="39.0" font-family="Inter SemiBold" font-weight="600" font-size="7.2" fill="#6C6C70" text-anchor="start">Conduta</text><rect x="0" y="45.0" width="46" height="44.8" rx="7" fill="#0B5BD3"/><text x="23.0" y="70.6" font-family="Inter SemiBold" font-weight="600" font-size="9" fill="#FFFFFF" text-anchor="middle">0 e Ia</text><rect x="54.0" y="45.0" width="168.0" height="44.8" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="61.0" y="64.9" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">Inflamação só em volta do cólon, sem</text><text x="61.0" y="75.5" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">abscesso</text><rect x="244.0" y="45.0" width="234.0" height="44.8" rx="7" fill="#F5F8FF" stroke="#0B5BD3" stroke-width="1.2"/><text x="251.0" y="59.6" font-family="Inter Medium" font-weight="500" font-size="8" fill="#16315C" text-anchor="start">Casa: dieta líquida ou pastosa e analgesia. Antibiótico só</text><text x="251.0" y="70.2" font-family="Inter Medium" font-weight="500" font-size="8" fill="#16315C" text-anchor="start">para idoso, imunossuprimido, gestante ou proteína C</text><text x="251.0" y="80.8" font-family="Inter Medium" font-weight="500" font-size="8" fill="#16315C" text-anchor="start">reativa muito alta</text><line x1="224.0" y1="67.4" x2="237.0" y2="67.4" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="236.0,63.4 236.0,71.4 242.0,67.4" fill="#8AA9DF"/><line x1="23.0" y1="90.8" x2="23.0" y2="93.8" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="19.0,92.8 27.0,92.8 23.0,98.8" fill="#8AA9DF"/><rect x="0" y="99.8" width="46" height="34.2" rx="7" fill="#0B5BD3"/><text x="23.0" y="120.1" font-family="Inter SemiBold" font-weight="600" font-size="9" fill="#FFFFFF" text-anchor="middle">Ib</text><rect x="54.0" y="99.8" width="168.0" height="34.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="61.0" y="114.4" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">Abscesso pequeno ao lado do cólon,</text><text x="61.0" y="125.0" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">menor que 4 cm</text><rect x="244.0" y="99.8" width="234.0" height="34.2" rx="7" fill="#F5F8FF" stroke="#0B5BD3" stroke-width="1.2"/><text x="251.0" y="119.7" font-family="Inter Medium" font-weight="500" font-size="8" fill="#16315C" text-anchor="start">Internação e antibiótico na veia, sem drenar</text><line x1="224.0" y1="116.9" x2="237.0" y2="116.9" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="236.0,112.9 236.0,120.9 242.0,116.9" fill="#8AA9DF"/><line x1="23.0" y1="135.0" x2="23.0" y2="138.0" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="19.0,137.0 27.0,137.0 23.0,143.0" fill="#8AA9DF"/><rect x="0" y="144.0" width="46" height="34.2" rx="7" fill="#0B5BD3"/><text x="23.0" y="164.3" font-family="Inter SemiBold" font-weight="600" font-size="9" fill="#FFFFFF" text-anchor="middle">II</text><rect x="54.0" y="144.0" width="168.0" height="34.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="61.0" y="158.6" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">Abscesso na pelve ou à distância, maior</text><text x="61.0" y="169.2" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">que 4 cm</text><rect x="244.0" y="144.0" width="234.0" height="34.2" rx="7" fill="#F5F8FF" stroke="#0B5BD3" stroke-width="1.2"/><text x="251.0" y="158.6" font-family="Inter Medium" font-weight="500" font-size="8" fill="#16315C" text-anchor="start">Drenagem pela pele guiada por tomografia e antibiótico</text><text x="251.0" y="169.2" font-family="Inter Medium" font-weight="500" font-size="8" fill="#16315C" text-anchor="start">na veia</text><line x1="224.0" y1="161.1" x2="237.0" y2="161.1" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="236.0,157.1 236.0,165.1 242.0,161.1" fill="#8AA9DF"/><line x1="23.0" y1="179.2" x2="23.0" y2="182.2" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="19.0,181.2 27.0,181.2 23.0,187.2" fill="#8AA9DF"/><rect x="0" y="188.2" width="46" height="34.2" rx="7" fill="#0B5BD3"/><text x="23.0" y="208.5" font-family="Inter SemiBold" font-weight="600" font-size="9" fill="#FFFFFF" text-anchor="middle">III</text><rect x="54.0" y="188.2" width="168.0" height="34.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="61.0" y="202.8" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">Pus espalhado pela barriga (peritonite</text><text x="61.0" y="213.4" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">purulenta)</text><rect x="244.0" y="188.2" width="234.0" height="34.2" rx="7" fill="#F5F8FF" stroke="#0B5BD3" stroke-width="1.2"/><text x="251.0" y="208.1" font-family="Inter Medium" font-weight="500" font-size="8" fill="#16315C" text-anchor="start">Cirurgia de urgência: operação de Hartmann</text><line x1="224.0" y1="205.3" x2="237.0" y2="205.3" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="236.0,201.3 236.0,209.3 242.0,205.3" fill="#8AA9DF"/><line x1="23.0" y1="223.4" x2="23.0" y2="226.4" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="19.0,225.4 27.0,225.4 23.0,231.4" fill="#8AA9DF"/><rect x="0" y="232.4" width="46" height="34.2" rx="7" fill="#0B5BD3"/><text x="23.0" y="252.7" font-family="Inter SemiBold" font-weight="600" font-size="9" fill="#FFFFFF" text-anchor="middle">IV</text><rect x="54.0" y="232.4" width="168.0" height="34.2" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="61.0" y="247.0" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">Fezes espalhadas pela barriga</text><text x="61.0" y="257.6" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">(peritonite fecal)</text><rect x="244.0" y="232.4" width="234.0" height="34.2" rx="7" fill="#F5F8FF" stroke="#0B5BD3" stroke-width="1.2"/><text x="251.0" y="247.0" font-family="Inter Medium" font-weight="500" font-size="8" fill="#16315C" text-anchor="start">Cirurgia de urgência: operação de Hartmann. É o grau</text><text x="251.0" y="257.6" font-family="Inter Medium" font-weight="500" font-size="8" fill="#16315C" text-anchor="start">que mais mata</text><line x1="224.0" y1="249.5" x2="237.0" y2="249.5" stroke="#8AA9DF" stroke-width="1.6"/><polygon points="236.0,245.5 236.0,253.5 242.0,249.5" fill="#8AA9DF"/><rect x="0.0" y="274.6" width="478.0" height="24.0" rx="6" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1" stroke-dasharray="3 2"/><text x="239.0" y="290.1" font-family="Inter Medium" font-weight="500" font-size="8.2" fill="#1F2933" text-anchor="middle">Passadas 6 semanas da crise: colonoscopia para confirmar a cura e afastar câncer</text></svg>