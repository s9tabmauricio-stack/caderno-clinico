<svg xmlns="http://www.w3.org/2000/svg" width="478pt" height="117pt" viewBox="0 0 478 117"><line x1="4" y1="30" x2="468" y2="30" stroke="#8AA9DF" stroke-width="2"/><polygon points="467,25.5 467,34.5 474,30" fill="#8AA9DF"/><circle cx="150" cy="30" r="5" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1.6"/><text x="150.0" y="19.0" font-family="Inter SemiBold" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="middle">14 dias</text><circle cx="300" cy="30" r="5" fill="#FFFFFF" stroke="#0B5BD3" stroke-width="1.6"/><text x="300.0" y="19.0" font-family="Inter SemiBold" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="middle">4 semanas</text><text x="4.0" y="19.0" font-family="Inter SemiBold" font-weight="600" font-size="8.4" fill="#16315C" text-anchor="start">Começo</text><text x="474.0" y="19.0" font-family="Inter Medium" font-weight="500" font-size="7.4" fill="#6C6C70" text-anchor="end">tempo</text><rect x="4.0" y="44.0" width="140.0" height="72.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="12.0" y="59.0" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#0B5BD3" text-anchor="start">Aguda: menos de 14 dias</text><text x="12.0" y="72.0" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">Vírus ou bactéria, quase sempre</text><text x="12.0" y="82.6" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">acaba sozinha. Hidratar e</text><text x="12.0" y="93.2" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">manter a comida, sem exames e</text><text x="12.0" y="103.8" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">sem antibiótico de rotina.</text><rect x="156.0" y="44.0" width="138.0" height="72.4" rx="7" fill="#F7F7FA" stroke="#E3E3E8" stroke-width="1"/><text x="164.0" y="59.0" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#6C6C70" text-anchor="start">Entre as duas</text><text x="164.0" y="72.0" font-family="Inter" font-weight="400" font-size="8" fill="#6C6C70" text-anchor="start">Faixa sem nome na aula.</text><rect x="306.0" y="44.0" width="168.0" height="72.4" rx="7" fill="#FFFFFF" stroke="#C3D8F8" stroke-width="1"/><text x="314.0" y="59.0" font-family="Inter SemiBold" font-weight="600" font-size="8.2" fill="#0B5BD3" text-anchor="start">Crônica: mais de 4 semanas</text><text x="314.0" y="72.0" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">Nunca é banal: sempre investigar com</text><text x="314.0" y="82.6" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">exames de sangue, de fezes e de</text><text x="314.0" y="93.2" font-family="Inter" font-weight="400" font-size="8" fill="#1F2933" text-anchor="start">imagem.</text></svg>