# Junta ao main, sozinho, os PRs do Codex e do Antigravity (ramos codex/...
# e antigravity/...), depois de
# conferir que o site compila. Se a compilação falhar, o PR fica aberto
# e nada vai para o ar.
name: Codex e Antigravity juntam ao main

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  juntar:
    # Só ramos codex/ ou antigravity/ deste repositório (nunca de cópias de fora) e PRs que não são rascunho.
    if: >-
      (startsWith(github.head_ref, 'codex/') || startsWith(github.head_ref, 'antigravity/')) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Juntar ao main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --squash --delete-branch
