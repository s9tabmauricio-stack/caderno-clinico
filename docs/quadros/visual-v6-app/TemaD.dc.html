<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>D · Interruptor sol e lua</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tema.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 470px; height: 960px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 16px; background: #24272D; font-family: Inter, system-ui, sans-serif">
<div class="modo-rotulo" style="letter-spacing: .1em">D · Agora: {{estado}}</div>
<div style="position: relative; width: 390px; height: 844px">
<dc-import name="EntradaBase" classe="{{classe}}" hint-size="390px,844px"></dc-import>
<div class="tema-camada {{classe}}">
<div class="tema-linha" role="group" aria-label="Aparência" style="position: absolute; top: 18px; right: 18px">
<button class="{{cAuto}}" type="button" aria-pressed="{{pAuto}}" onClick="{{auto}}">Auto</button>
<button class="tema-chave" type="button" role="switch" aria-checked="{{ehNoite}}" aria-label="Modo noite" onClick="{{virar}}">
<svg class="tema-ico lado" viewBox="0 0 24 24" aria-hidden="true" style="left: 12px"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
<svg class="tema-ico lado" viewBox="0 0 24 24" aria-hidden="true" style="right: 12px"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
<span class="tema-bola" style="{{bola}}">
<sc-if value="{{mostraSol}}" hint-placeholder-val="{{ false }}"><svg class="tema-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
<sc-if value="{{mostraLua}}" hint-placeholder-val="{{ true }}"><svg class="tema-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if>
</span>
</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":470,"height":960}}'>
class Component extends DCLogic {
  componentDidMount() {
    try {
      const claro = window.matchMedia('(prefers-color-scheme: light)').matches;
      this.setState({ sistema: claro ? 'dia' : 'noite' });
    } catch (e) {}
  }
  renderVals() {
    const s = this.state || {};
    const modo = s.modo || 'auto';
    const sistema = s.sistema || 'noite';
    const classe = modo === 'auto' ? sistema : modo;
    const estado = modo === 'auto' ? 'Automático (' + (sistema === 'dia' ? 'dia' : 'noite') + ' no aparelho)' : modo === 'dia' ? 'Dia' : 'Noite';
    return {
      classe, estado,
      cAuto: 'tema-auto' + (modo === 'auto' ? ' on' : ''),
      pAuto: String(modo === 'auto'),
      ehNoite: String(classe === 'noite'),
      mostraSol: classe === 'dia', mostraLua: classe === 'noite',
      bola: 'left: ' + (classe === 'dia' ? 4 : 48) + 'px',
      auto: () => this.setState({ modo: 'auto' }),
      virar: () => this.setState({ modo: classe === 'dia' ? 'noite' : 'dia' }),
    };
  }
}
</script>
</body>
</html>
