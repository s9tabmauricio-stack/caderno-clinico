<div class="vidro" style="padding: 10px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 3px"><span class="n-ouro" style="font-size: 24px">8</span><span class="s">novos</span></div>
<div class="vidro" style="padding: 10px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 3px"><span class="n-ouro" style="font-size: 24px">6</span><span class="s">feitos hoje</span></div>

<button class="capsula" type="button"><span class="ponto-m" style="background: #0E7490; width: 8px; height: 8px"></span>Pneumo · 8</button>

<span class="s num">7 de 32</span>
</div>
<div>

<div style="height: 1px; background: var(--divisor)"></div>
<div>

</div>
</section>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<button class="btn-vidro" type="button" style="flex-direction: column; gap: 3px; min-height: 56px; padding: 0 4px; color: var(--errado)">Errei<span class="s" style="font-size: 11.5px; font-weight: 500">10 min</span></button>
<button class="btn-vidro" type="button" style="flex-direction: column; gap: 3px; min-height: 56px; padding: 0 4px; color: var(--ambar)">Difícil<span class="s" style="font-size: 11.5px; font-weight: 500">1 dia</span></button>
<button class="btn-ouro" type="button" style="min-height: 56px; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; letter-spacing: .08em">Bom<span style="font-family: Inter, sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: 0; text-transform: none">3 dias</span></button>
<button class="btn-vidro azul" type="button" style="flex-direction: column; gap: 3px; min-height: 56px; padding: 0 4px">Fácil<span class="s" style="font-size: 11.5px; font-weight: 500">6 dias</span></button>
