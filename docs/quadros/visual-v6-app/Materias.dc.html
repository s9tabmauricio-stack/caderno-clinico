<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Matérias</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tema.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 908px; height: 960px; box-sizing: border-box; padding: 40px; display: flex; gap: 48px; background: #24272D; font-family: Inter, system-ui, sans-serif">
<sc-for list="{{modos}}" as="m" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 16px">
<div class="modo-rotulo">{{m.nome}}</div>
<div class="tela {{m.classe}}">
<svg class="decor" viewBox="0 0 390 844" aria-hidden="true">
<path class="tr" d="M390 210H360L344 226V280"></path>
<path class="tr" d="M0 610H24L40 594V556"></path>
<path class="tr" d="M0 700H16L32 716V760"></path>
<circle class="tr-fim" cx="344" cy="284" r="3"></circle>
<circle class="tr-fim" cx="40" cy="552" r="3"></circle>
<path class="ra" d="M284 18C300 52 326 80 372 100"></path>
<path class="ga" d="M322 70C340 62 352 46 358 26"></path>
<circle class="halo" cx="372" cy="100" r="8"></circle><circle class="pt" cx="372" cy="100" r="2.6"></circle>
<circle class="halo" cx="358" cy="26" r="7"></circle><circle class="pt" cx="358" cy="26" r="2.2"></circle>
</svg>
<div class="conteudo" style="gap: 10px">
<header class="topo">
<div>
<div class="eyebrow">Estudar</div>
<h1 class="titulo">Matérias</h1>
</div>
<a class="engrenagem" href="#" aria-label="Configurações"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></a>
</header>

<sc-for list="{{materias}}" as="x" hint-placeholder-count="6">
<div class="vidro" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border-radius: 22px">
<a href="Questao.dc.html" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px">
<span class="gema" style="{{x.gema}}">{{x.sigla}}</span>
<span class="main" style="gap: 5px">
<span class="materia">{{x.nome}}</span>
<span class="s">{{x.aulas}} · {{x.pct}}</span>
<span class="barra"><i style="{{x.barra}}"></i></span>
</span>
</a>
<a class="btn-vidro azul" href="Questao.dc.html" style="min-height: 44px; padding: 0 12px; font-size: 12.5px; flex-direction: column; gap: 2px" aria-label="Banco de questões de {{x.nome}}">
<svg class="ico p" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l2 2 4-4"></path><rect x="4" y="3" width="16" height="18" rx="3"></rect></svg>Banco
</a>
</div>
</sc-for>
</div>

<nav class="abas" aria-label="Navegação principal">
<a class="aba" href="Main.dc.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>Início</a>
<a class="aba" href="Agenda.dc.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Agenda</a>
<a class="aba ativa" href="Materias.dc.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h14v14H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h14"></path></svg>Matérias</a>
<a class="aba" href="Revisao.dc.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"></rect><path d="M7 3h12a2 2 0 0 1 2 2v12"></path></svg>Revisão<span class="badge">24</span></a>
<a class="aba" href="Desempenho.dc.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M11 20V5M17 20v-7M3 20h18"></path></svg>Desempenho</a>
</nav>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":908,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const m = (sigla, nome, c1, c2, aulas, pct) => ({
      sigla, nome, aulas: aulas + (aulas === 1 ? ' aula' : ' aulas'), pct: pct + '% concluído',
      gema: 'background: linear-gradient(145deg, ' + c1 + ', ' + c2 + ')',
      barra: 'width: ' + Math.max(pct, 2) + '%',
    });
    return {
      modos: [
        { classe: 'noite', nome: 'Noite (padrão)' },
        { classe: 'dia', nome: 'Dia' },
      ],
      materias: [
        m('NE', 'Nefrologia', '#2563EB', '#1E3A8A', 5, 60),
        m('PN', 'Pneumologia', '#0E7490', '#155E75', 3, 35),
        m('GA', 'Gastroenterologia', '#047857', '#065F46', 4, 20),
        m('OR', 'Ortopedia', '#B45309', '#7C2D12', 2, 10),
        m('UR', 'Urologia', '#6D28D9', '#4C1D95', 3, 45),
        m('PA', 'PASS', '#BE185D', '#831843', 2, 0),
      ],
    };
  }
}
</script>
</body>
</html>
